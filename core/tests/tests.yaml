# Named tests. Lenses cite a test id as evidence ("failed T-GHOST-DECK").
# kind: J = a judgment procedure for a lens; M = scripted (detector named).
- {id: T-RIVAL-NAME, name: Rival's-name swap, lens: [concept, copy], kind: J,
   run: "Put a competitor's name, or the same trade in another town, into the h1, sub-line and every heading.",
   pass: "No line stays true. If the design still holds under another client's name, Concept is capped at 5.",
   sources: ["hallmark §14 §101", "taste-skill §642", "huashu §97", "impeccable §149"]}
- {id: T-MIRROR, name: Mirror, lens: [concept], kind: J,
   run: "Ask whether a neighbouring brief in the same category would get this hero, nav, footer and first section.",
   pass: "No. If yes, change one decision and name it.", sources: ["hallmark §12"]}
- {id: T-ONE-SENTENCE, name: One-sentence idea, lens: [concept], kind: J,
   run: "State the design's idea in one sentence.", pass: "It can be done.", sources: ["huashu §97", "hallmark §15"]}
- {id: T-COVER-TEXT, name: Cover-the-text, lens: [concept], kind: J,
   run: "Hide all text and logos.", pass: "The theme is still recognisable.", sources: ["huashu §97"]}
- {id: T-REMOVE-DEVICE, name: Remove-the-device, lens: [concept], kind: J,
   run: "Remove the central metaphor or device.", pass: "The page still works and is no less clear.", sources: ["huashu §54 §115"]}
- {id: T-DEFAULT-AGENT, name: Default-agent kill question, lens: [concept, slop], kind: J,
   run: "Could typing 'landing page' into an agent produce this?", pass: "No.", sources: ["design-taste §6 §62"]}
- {id: T-MEMORY, name: Memory, lens: [concept], kind: J,
   run: "Look at the first viewport only, then away.", pass: "You can describe a thing, not a mood.", sources: ["impeccable §225"]}
- {id: T-OWN-SYSTEM, name: Own system, lens: [concept], kind: J,
   run: "Before judging novelty, ask whether the look comes from this client's own brand or design system (its logo, palette, faces, photography and components, applied the same way across the artifact) or from a framework default or look family.",
   pass: "Either answer is recorded with evidence. When the system is the client's own and applied throughout, it is the concept: judge whether the artifact uses it well for its job, not whether it is unconventional. A direction you would not have chosen is not a finding.",
   sources: ["hallmark §5 §139-140 §157", "huashu §5"]}
- {id: T-SIGNATURE, name: Signature, lens: [concept], kind: J,
   run: "Name the artifact's signature: the brief's strongest real thing shown at its best on the first screen (on an app screen, the object the tool is known by, such as a ledger, timeline or queue).",
   pass: "One exists, it is real material from this client, and it is on the first screen. A number drawn as marks, a greeting over stat cards or a gradient garnish is not a signature.",
   sources: ["hallmark §13", "huashu §7 §158"]}
- {id: T-DELETE-PICTURE, name: Delete-the-picture, lens: [concept, imagery], kind: J,
   run: "Remove the lead image in your head and reread the first screen.", pass: "The screen loses what it says. If it says the same thing, the picture is too weak or too small.",
   sources: ["hallmark §47"]}
- {id: T-IDEA-CARRIES, name: Idea carries, lens: [concept], kind: J,
   run: "Take the one-sentence idea (T-ONE-SENTENCE) and look for it on every screen or slide after the first.",
   pass: "The idea shapes sections below the hero. An idea that stops at the hero is a template with a good hero.", sources: ["hallmark §15 §158"]}
- {id: T-BOLD-MOVE, name: One bold move, lens: [concept], kind: J,
   run: "List every element louder than the rest (scale, colour, motion, device). Then take one accessory off.",
   pass: "One move carries the boldness and the rest stays quiet. None means timid; several competing means no focus.",
   sources: ["huashu §7 §181", "taste-skill §99"]}
- {id: T-DEFAULT-PLAN, name: Default plan, lens: [concept], kind: J,
   run: "Mark each default-plan move present: split hero (head left, picture right), three numbered steps, label and value rows between hairlines, closing band with a form, dark footer under a huge wordmark, small grey labels, pale ground with one careful accent.",
   pass: "At most one. Two or more in one artifact means the plan is the template.", sources: ["hallmark §15"]}
- {id: T-KIND-FIT, name: Business-kind fit, lens: [concept], kind: J,
   run: "Classify the business kind (software, gaming, tech hardware, product, service, place, other) and the visitor's job, then check what leads: software shows its own UI at work, a product is shown big, a place leads with photographs, a service shows the work and the people doing it.",
   pass: "The lead material matches the kind and is the client's own. Effects, shader grounds and dark heroes appear only on tech kinds.",
   sources: ["taste-skill §5 §7 §10-11 §16-21 §25", "hallmark §17 §203"]}
- {id: T-PROMISE-PICTURED, name: Promise pictured, lens: [concept, imagery], kind: J,
   run: "For the h1 and each section heading that makes a concrete promise, find the picture that shows it.",
   pass: "Each concrete promise is shown (\"takes four crates\" shows four crates). Otherwise add the picture or cut the promise.", sources: ["taste-skill §16-17"]}
- {id: T-SQUINT, name: Squint, lens: [structure], kind: H, detector: blur_render,
   run: "Blur the render (Gaussian 8px at 1440; lens-structure gives the Pillow snippet that writes 03-lenses/squint/).", pass: "Primary, secondary and groups read in order; heavy and light rhythm.",
   sources: ["hallmark §151 §210", "huashu §99", "impeccable §62"]}
- {id: T-SKELETON, name: Skeleton, lens: [structure], kind: J,
   run: "Strip the copy from a section.", pass: "Structure alone says what it is.", sources: ["impeccable §290"]}
- {id: T-SCREEN-BY-SCREEN, name: Screen-by-screen, lens: [structure], kind: J,
   run: "Scroll at 1440x900 one screen at a time (capture tiles).", pass: "Every screen has something big enough to be its reason. Outranks detail findings.",
   sources: ["hallmark §157 §210"]}
- {id: T-JUDGE-TILE, name: Judge tile, lens: [structure], kind: H, detector: viewport_tiles,
   run: "Screenshot at scrollY = k x viewport height (scripts/capture/tiles.py writes 01-evidence/tiles/).", pass: "Each tile shows one section, no neighbour's heading.", sources: ["taste-skill §71 §78"]}
- {id: T-ANATOMY, name: Anatomy, lens: [structure], kind: J,
   run: "Check the primary action sits where category sites put it and the category's own sections are present.",
   pass: "Yes, yes, and the sequence could not sit under another business.", sources: ["hallmark §17 §518"]}
- {id: T-FIVE-SECOND, name: Five-second, lens: [structure, copy], kind: J,
   run: "First screen only.", pass: "What it is, who it is for and what to do are answered.", sources: ["taste-skill §4", "huashu §158", "design-taste §39"]}
- {id: T-HEADINGS-READ, name: Headings-and-hero read, lens: [structure], kind: J,
   run: "Read only the hero and the section headings, in page order, and nothing else.",
   pass: "They tell the page's story in order. A heading that only names a category ('Features', 'How it works', 'Why us') breaks the story; if the headings tell it, the body is the right length.",
   sources: ["hallmark §30"]}
- {id: T-COMPOSITION-RUN, name: Composition run, lens: [structure], kind: J,
   run: "Name each section's composition in order (split, grid, bento, showcase, statement, rows, index, rail, pinned, table, form, band) and mark neighbours that share one, every card layout, and every mirrored split.",
   pass: "3 to 6 compositions on the page; no more than two neighbours share a skeleton; any card layout at most twice; splits do not alternate A-B-A-B (conflict C24: one mirror allowed).",
   sources: ["hallmark §41 §174 §178 §195 §205", "taste-skill §82 §92 §99", "kami §161 §270"]}
- {id: T-LEFT-EDGES, name: Left edges, lens: [structure], kind: H,
   run: "List the x positions where text blocks start at 1440 (computed from dom-1440.json with the snippet in lens-structure, never by eye) and look at them against the tiles.",
   pass: "Text starts on the container's left line and at most one split line; blocks start on column starts, so edges line up from nav to footer.",
   sources: ["taste-skill §70 §81", "hallmark §168"]}
- {id: T-PHONE-ORDER, name: Phone reading order, lens: [structure], kind: J,
   run: "Read shot-375 top to bottom against the 1440 section order.",
   pass: "Every composition stacks in reading order: head block, then body; a split's visual after its text; the bento lead tile first; nothing reordered so that a section's action comes before what it acts on.",
   sources: ["hallmark §196", "taste-skill §74 §82"]}
- {id: T-DENSITY-FIT, name: Density fits the job, lens: [structure, media-app], kind: J,
   run: "Set the density dial from the visitor mode (marketing low, documents mid, dashboards and tools high), then compare the measured gaps and words per screen with it.",
   pass: "The spacing scale and the amount on each screen match the dial, and density is even across the screen: no dashboard padded like a landing page, no landing page packed like a dashboard.",
   sources: ["ux-ui-agent-skills §246", "hallmark §145 §159"]}
- {id: T-EYEBROW, name: Eyebrow, lens: [slop], kind: H, detector: eyebrow,
   run: "Cover the small line above a heading and reread.", pass: "A fact, destination or identifier is lost. Otherwise promote it into the heading.",
   sources: ["hallmark §111 §369", "kami §4", "impeccable §520"]}
- {id: T-LABEL-TRANSFORM, name: Label transform-delete, lens: [typography, slop], kind: J,
   run: "Remove text-transform and tracking from a label.", pass: "It reads worse; if not, the caps were costume.", sources: ["hallmark §60"]}
- {id: T-TYPE-SOURCE, name: Where the type came from, lens: [typography], kind: J,
   run: "For each face that draws text (fonts.json), name its source: the brand or design system, the contract, the content and voice, or a default (framework stack, one UI sans for every role, a saturated face with no stated reason).",
   pass: "Every face has a source other than a default. A brand's or client's own face is a source even when the face is popular.",
   sources: ["huashu §117", "hallmark §137 §290 §292", "huashu §125"]}
- {id: T-FACE-ROLES, name: Face roles, lens: [typography], kind: H,
   run: "List each drawn face with the roles it sets (heading levels, body, controls, small labels, code, figures) from the type table that skills/lens-typography/type_table.py writes.",
   pass: "Display and body faces, plus at most one outlier with one role; no face in unrelated roles; mono only on code and figures; display-only cuts only at 24px and up.",
   sources: ["hallmark §52 §61 §64 §290", "huashu §124 §126", "taste-skill §57"]}
- {id: T-LADDER, name: Ladder audit, lens: [typography], kind: H,
   run: "List every distinct font size with its roles and the ratio between adjacent roles (type table), then compare same-kind elements across sections.",
   pass: "Each size is a declared step on one ratio fitted to the medium; each kind of element has one size; weight steps that carry hierarchy are clear.",
   sources: ["kami §35", "huashu §118", "hallmark §54", "taste-skill §59"]}
- {id: T-HEADLINE-FIT, name: Headline fit, lens: [typography], kind: H,
   run: "For the h1 and each h2, read its characters, its line count at 375 and 1440 and its last-line share (type table), then look at it on the tiles.",
   pass: "The size suits the length, headings hold to two lines (h1 to three), breaks fall between phrases, and no button label or nav link wraps.",
   sources: ["hallmark §56 §58 §401 §407", "taste-skill §30 §59"]}
- {id: T-LEADING, name: Leading and tracking, lens: [typography], kind: H,
   run: "Read line-height divided by font size, and letter-spacing in em, for body, display and caps roles (type table); then check every caps display line and every control on the screenshots for overlap or clipping.",
   pass: "Body and display sit in their ranges, and no lines collide or clip at any width.",
   sources: ["hallmark §55 §59 §394", "huashu §121", "kami §40 §60"]}
- {id: T-MEASURE, name: Measure, lens: [typography], kind: M,
   run: "For running paragraphs of 3 or more lines, divide characters by lines (type table: rect height over computed line height) at 1440 and 375.",
   pass: "Median 45 to 75 characters per line; none at 88 or more over 3 lines; no sliver under 16 over 4 lines.",
   sources: ["hallmark §397", "ui-ux-pro-max §89", "huashu §120", "kami §45"]}
- {id: T-HEAD-TREATMENT, name: Head treatment, lens: [typography, slop], kind: H,
   run: "List the children of each h1 and h2 that change face, style, weight or colour (type table), then look at them on the tiles.",
   pass: "None, or one declared signature in the hero only.",
   sources: ["hallmark §57 §370 §393", "huashu §59 §60"]}
- {id: T-FIGURES, name: Figures, lens: [typography, dataviz], kind: J,
   run: "Find every place numbers compare (tables, prices, stats, axes, counts) on the tiles, and check the stylesheet for tabular-nums.",
   pass: "Digits line up in columns and figures are lining; or the stylesheet sets tabular-nums on those roles.",
   sources: ["hallmark §63 §402", "huashu §129", "kami §58 §190"]}
- {id: T-PUNCTUATION, name: Punctuation, lens: [typography, copy], kind: M,
   run: "Count straight and curly quotes and apostrophes, three-dot runs and true ellipses in the page text (type table).",
   pass: "One quote style throughout (conflict C32) and no three-dot ellipses.",
   sources: ["hallmark §63 §403", "agent-skills §155", "taste-skill §60"]}
- {id: T-FONT-RENDERED, name: Font actually rendered, lens: [typography, sweep], kind: M, detector: fallback_face,
   run: "Compare the face that drew each text run (fonts.json, from the browser) with the declared first family.",
   pass: "The declared face drew the text; a fallback is a failure, and a blocked font is not verified.",
   sources: ["hallmark §462", "kami §189"]}
- {id: T-WIDOWS, name: Widow check, lens: [typography, sweep], kind: M, detector: widows,
   run: "Inspect paragraphs and 2 to 3 line headings at 375 and 1280.", pass: "No single-word last line and no last line under 35% of the line before.",
   sources: ["hallmark §401"]}
- {id: T-COLOUR-SOURCE, name: Why this colour, lens: [color], kind: J,
   run: "For the ground, the ink and each chromatic colour (palette table), write one sentence that traces it to a brand asset or design system, the content's own imagery, or the culture of the subject (Sample, Converge, Justify).",
   pass: "Every primary has a sentence. A colour whose only source is a framework default, a model favourite or a look family has none. A brand's own colour is a source even when it resembles a default family.",
   sources: ["huashu §62 §211", "hallmark §134 §137"]}
- {id: T-PALETTE-ROLES, name: Palette roles, lens: [color], kind: H,
   run: "Map each measured colour to one role (ground, surface, ink, text level, accent, state, data) from the palette table: area palette from the background render, colours per text role, chromatic groups by hue, grounds and text levels.",
   pass: "2 to 3 chromatic colours plus one neutral set, one accent unless the posture is full palette, at most 4 text levels and 3 grounds, and no colour in two unrelated roles.",
   sources: ["huashu §211 §73 §144", "taste-skill §31 §61", "kami §10 §13", "hallmark §68"]}
- {id: T-ACCENT-DOSAGE, name: Accent dosage, lens: [color], kind: H,
   run: "Name the posture (restrained, committed, full palette, drenched), then list where the accent sits by role (palette table chromatic groups: uses, fill area, display text, page-scale fills) and look at each place on the tiles.",
   pass: "Under a restrained posture the accent marks only the primary action, current state, focus, link hover and one focal element, and never sets display type or paints a page-scale surface. Other postures hold to their own definition.",
   sources: ["hallmark §67 §68 §144 §410", "kami §11 §181", "taste-skill §61"]}
- {id: T-NEUTRALS, name: Neutral temperature, lens: [color], kind: H,
   run: "Read the neutral temperature counts and the pure black and white counts (palette table); then inspect the rgb() of the paper, the text greys and the hairlines (warm R>=G>B, cool R<G<B).",
   pass: "The neutrals hold one temperature that agrees with the ground, and pure black or white appears only where the system documents it (conflict C09).",
   sources: ["kami §12 §14 §23", "hallmark §65 §66 §409"]}
- {id: T-SURFACE-LADDER, name: Surface ladder, lens: [color, structure], kind: H,
   run: "For each grouped region on the tiles, name the rung that separates it (whitespace, hairline, tinted well, card), and read the shadow recipes, border-plus-shadow count and grounds in the palette table.",
   pass: "Each region uses the lowest rung that works; one resting shadow recipe; shadows only on things that float; no white card on a tinted page and no bordered box in a well.",
   sources: ["hallmark §70 §74 §76 §373 §385", "kami §74 §75"]}
- {id: T-LINE-DELETION, name: Line deletion, lens: [color, structure], kind: J,
   run: "Hide a line or rule in your head and reread the region.", pass: "Meaning, state, grouping or navigation is lost. If not, delete it and restore the pause with spacing.",
   sources: ["kami §73"]}
- {id: T-DARK-MODE, name: Dark verification, lens: [color], kind: H,
   run: "If the artifact is dark or ships a dark theme, read the dark ground and ink lightness, surfaces darker than the page, shadows on dark and the stylesheet flags (prefers-color-scheme, color-scheme, filter invert) from the palette table; run every contrast pair numerically in both modes when both were captured.",
   pass: "Dark paper and ink sit in their bands, elevation gets lighter, shadows give way to lightness steps, the accent is re-derived for dark, and nothing is inverted by filter. A mode that was not captured is not verified.",
   sources: ["hallmark §71 §299 §300 §302 §303", "ui-ux-pro-max §242"]}
- {id: T-FINGERPRINT, name: Fingerprint, lens: [slop], kind: H, detector: fingerprint,
   run: "Record six axes and compare with the last 3 builds in the ledger.", pass: "At most 3 of 6 shared.", sources: ["hallmark §233 §234 §519"]}
- {id: T-LOOK-LEDGER, name: Look-ledger, lens: [slop], kind: M, detector: distinctness,
   run: "Compare background family, palette, headline face and skeleton with the last 8 deliveries.",
   pass: "No trait recurs in more than max(2, 50%) of them; palette oklab distance >= 0.06; edge-map correlation <= 0.55.", sources: ["huashu §69 §111"]}
- {id: T-STOCK-ORDER, name: Stock page order, lens: [slop, structure], kind: J,
   run: "List the page's sections in order and mark each that matches a stock section: hero with product mock, logo strip, three or four equal feature cards, 1-2-3 steps, stat band, testimonial cards, three pricing tiers, FAQ accordion, closing CTA band, link-farm footer.",
   pass: "Fewer than 5 stock sections. 5 or 6 in stock order caps overall_read at mixed; 7 or more means generated, however specific the copy.",
   sources: ["hallmark §17 §518 anatomy", "lens review test set 1 (I01-I03: specific copy on a stock skeleton)"]}
- {id: T-OVER-CORRECTION, name: Over-correction, lens: [slop, copy], kind: J,
   run: "After a fix, look for the habit that replaced the removed one.", pass: "None multiplied.", sources: ["taste-skill §51 §642"]}
- {id: T-THREE-LINE, name: Three tests per line, lens: [copy], kind: J,
   run: "For each claim: can the reader picture it, could it be proven false, could only this business say it?", pass: "Yes to all three.", sources: ["hallmark §102"]}
- {id: T-FRESH-READER, name: Fresh-reader, lens: [copy], kind: J,
   run: "Give a fresh reader or model only the text: what, for whom, why this, cost, hesitations, which 3 lines sound generic.",
   pass: "Correct answers, no generic lines. Never iterate to beat a detector.", sources: ["taste-skill §642", "writing-guidelines §86"]}
- {id: T-READ-ALOUD, name: Read-aloud and nine-trades, lens: [copy], kind: J,
   run: "Read as the client; picture the voice on nine other businesses.", pass: "They would say it; it fits none of the nine.", sources: ["taste-skill §330 §332"]}
- {id: T-SECOND-READ, name: Second-read and by-monkeys, lens: [copy], kind: J,
   run: "Read each sentence once at speaking pace; append 'by monkeys' after verbs.", pass: "Parses first time; no passive.", sources: ["writing-guidelines §10 §18", "agent-skills §107 §116"]}
- {id: T-GHOST-DECK, name: Ghost deck, lens: [media-slides, structure], kind: H, detector: slide_titles,
   run: "Read only slide titles in order.", pass: "They tell the argument as assertions, each unique.", sources: ["kami §129 §304 §703"]}
- {id: T-SO-WHAT, name: So-what, lens: [copy], kind: J,
   run: "Ask 'so what?' of each claim and bullet.", pass: "Each answers why the reader should care.", sources: ["kami §240 §242 §699"]}
- {id: T-HEADING-FORM, name: Heading formulas, lens: [copy], kind: H,
   run: "Read each heading from the copy sheet (skills/lens-copy/copy_sheet.py writes 03-lenses/copy/copy-sheet.json) against the formula list: 'Meet <Name>', triads, colon titles, two-fragment heads, number pairs, bare commands, questions; then check each for a naming noun and read the body opener under it.",
   pass: "No formula past its budget, every heading has a naming noun, and no body opener restates its heading.",
   sources: ["hallmark §104 §106 §360", "taste-skill §317 §322"]}
- {id: T-CADENCE, name: Cadence count, lens: [copy], kind: H,
   run: "Read the copy sheet's counts of contrast frames, negation runs, -ing riders, triads, rhetorical questions and exclamation marks, and its sentence-length spread and card evenness; then read each example in its sentence.",
   pass: "Each device sits within its budget (CPY-011 to CPY-013, CPY-021). A count is a pointer: a device the sentence needs is not a finding.",
   sources: ["taste-skill §40 §47 §50 §51", "hallmark §104 §359"]}
- {id: T-LABEL-READ, name: Labels read alone, lens: [copy], kind: H,
   run: "Read every button and link label alone, out of context (copy sheet labels), then with its target: one wording per target, one target per wording.",
   pass: "Each label names its action as a verb and an object, or its destination; the main action has one wording everywhere.",
   sources: ["hallmark §107 §361", "taste-skill §318 §319 §356", "agent-skills §164-165"]}
- {id: T-STATE-COPY, name: State copy, lens: [copy], kind: H,
   run: "Read every error, empty, loading, confirmation and 404 text the capture recorded (copy sheet microcopy from forms.json and async.json, and the tiles), in the order a user meets it.",
   pass: "Each says what happened; an error names the field and what to type; a confirmation names what was sent and the real next step; all in the page's register.",
   sources: ["taste-skill §327 §357", "ui-ux-pro-max §37 §96 §97 §100", "awesome-design-patterns §52"]}
- {id: T-TERMS, name: One name per thing, lens: [copy], kind: H,
   run: "Read the copy sheet's term variants (one term, several spellings, used 3 or more times); in long-form text, list the nouns used for each main referent.",
   pass: "One spelling per term, and one name per thing in long-form text.",
   sources: ["kami §251", "ui-ux-pro-max §306", "research/notes/unslop-writing-skill-review.md (synonym cycling)"]}
- {id: T-LONG-FORM, name: Long-form read, lens: [copy], kind: H,
   run: "Long-form content only (articles, docs, emails, reports, or a running-text region of the copy sheet). Read each paragraph at speaking pace with the region's counts beside it, and mark passive stacks, stacked hedges, vague attributions, synonym cycling, false ranges, template framing, generic conclusions, mannered and over-compressed sentences.",
   pass: "None of these past CPY-024 to CPY-029. Never run on landing-page copy: these tells do not separate slop from good there.",
   sources: ["research/notes/unslop-writing-skill-review.md", "agent-skills §107-124", "writing-guidelines §10 §18"]}
- {id: T-DELETION, name: Deletion (image, line, element), lens: [imagery, structure, copy], kind: J,
   run: "Remove it (for copy: a sentence, an intro line, a caption or a closing line).", pass: "Meaning, state, grouping, navigation or a fact is lost.", sources: ["hallmark §114", "kami §250 §394 §428", "huashu §71 §180"]}
- {id: T-FILLER, name: Filler, lens: [integrity], kind: J,
   run: "Remove an element; ask what problem it solves and whether its data is real.", pass: "Worse without it; solves a real problem; real data.", sources: ["huashu §71 §101"]}
- {id: T-FAKE-SEND, name: Fake-send, lens: [integrity], kind: M, detector: fake_send,
   run: "Submit every form with the network blocked.", pass: "No success copy appears; an honest failure message shows.", sources: ["hallmark §364 §510"]}
- {id: T-DIAGRAM-EARNS, name: Diagram earns its place, lens: [dataviz], kind: J,
   run: "Would a paragraph or table teach as much? Can any node, arrow or label be removed?", pass: "No and no.", sources: ["diagram-design §4 §5", "kami §338"]}
- {id: T-30S-BOARD, name: 30-second board, lens: [dataviz], kind: J,
   run: "Ask a reader to state a diagram's main path.", pass: "Done in 30 seconds.", sources: ["kami §398"]}
- {id: T-GRAYSCALE, name: Grayscale, lens: [dataviz, color], kind: H, detector: grayscale_render,
   run: "View the chart or palette in grayscale (skills/lens-color/palette_table.py writes 03-lenses/color/gray-fold-<w>.png).", pass: "Meaning survives without hue.", sources: ["ui-ux-pro-max §256"]}
- {id: T-GRADIENT-STOPS, name: Gradient-stop contrast, lens: [color, a11y], kind: M, detector: contrast,
   run: "Sample the darkest and lightest pixels behind each text run.", pass: "Worst sample meets 4.5:1 body, 3:1 large.", sources: ["hallmark §411 §454"]}
- {id: T-TAB-THROUGH, name: Focus by tabbing, lens: [a11y], kind: M, detector: focus_walk,
   run: "Tab from page top through every control.", pass: "Skip link first; visible ring at 3:1 or better; never under a sticky header.", sources: ["hallmark §455", "taste-skill §639"]}
- {id: T-HIDDEN-CONTENT, name: Three-condition hidden content, lens: [robustness, motion], kind: M, detector: hidden_content,
   run: "Load with reduced motion, with IntersectionObserver never firing for 4s, and with scripts off.", pass: "All content visible in all three; under 30% of text hidden after load.",
   sources: ["taste-skill §437", "hallmark §445"]}
- {id: T-PURPOSE, name: Purpose and 50th use, lens: [motion], kind: J,
   run: "Say what each animation communicates (feedback, orientation, continuity, or a showpiece the visitor chose; skills/lens-motion/motion_table.py lists what each trigger moved); imagine its 50th use today.", pass: "It has a job and is still wanted.", sources: ["agent-skills §1", "Design Rules 1 §2"]}
- {id: T-RAPID-TOGGLE, name: Rapid toggle, lens: [motion], kind: M, detector: rapid_toggle,
   run: "Click a control repeatedly mid-transition.", pass: "Final state correct; nothing stuck.", sources: ["ui-ux-pro-max §16"]}
- {id: T-FREQUENCY, name: Frequency gate, lens: [motion], kind: H,
   run: "For each measured trigger and the passive recording (skills/lens-motion/motion_table.py writes 03-lenses/motion/motion-table.json), name what started it (a click on a control used many times, a one-time click, page load, nothing) and how often a visitor sees it; then read its duration, live end and easing against that frequency.",
   pass: "Motion seen often (tabs, menus, toggles, disclosures, copy buttons) sits on the short UI scale; long, springy or storytelling timing appears only on a showpiece the visitor started or sees once, and UI feedback inside a demo keeps product speed (conflict C45).",
   sources: ["uupm §8 §143 §237", "agent §78", "hallmark §83", "stageshow §48"]}
- {id: T-MOTION-BUDGET, name: Motion budget, lens: [motion], kind: H,
   run: "List every motion primitive on the page from the motion table (triggers, running animations, passive recording) and the tiles: page-load reveals, hover signals, loops, transitions. Count the things that move in one screen at once.",
   pass: "About three primitives on the page, one or two moving things per view, at most one self-moving thing per screen, and no identical entrance on every block.",
   sources: ["hallmark §323", "taste-skill §33 §407 §428 §431 §441", "uupm §7 §237", "huashu §324 §364"]}
- {id: T-MOTION-SYSTEM, name: Motion system, lens: [motion], kind: H,
   run: "Read the motion table's measured_system (easings and durations of the animations the clicks started) and declared (the transitions and easings the visible elements declare, with flags for the browser's ease, Tailwind's default curve, linear and overshoot).",
   pass: "One curve family and one duration scale (conflicts C38, C39), arrival and exit curves that fit their direction, and overshoot only on a showpiece or demo (conflict C15).",
   sources: ["hallmark §82 §83 §340 §438", "uupm §8 §14 §237", "huashu §332 §335"]}
- {id: T-ENTER-EXIT, name: Enter and exit, lens: [motion], kind: H,
   run: "For each overlay, view or panel that opens, find its exit (a second click, Escape, a close control) in the frames or the declared transitions, and compare the two durations; look for blank frames between the old and new content on the contact sheet.",
   pass: "Every enter has an exit at 60 to 75% of its length, and no blank gap over 0.3s.",
   sources: ["hallmark §83 §324", "agent §51 §79", "huashu §377", "stageshow §50"]}
- {id: T-SPATIAL-MEANING, name: Spatial meaning, lens: [motion], kind: J,
   run: "For each transition, say what changed (the same thing deeper, an ordered step, a lateral swap, an overlay) and the direction the frames show it moving.",
   pass: "Morphs for the same thing, slides only for ordered steps in the reading direction, cross-fades for peers, overlays from their trigger.",
   sources: ["agent §3 §7-§14 §49", "uupm §237 §364", "hallmark §329"]}
- {id: T-CHOREOGRAPHY, name: Choreography, lens: [motion], kind: H,
   run: "Read each trigger's stagger (items, step, spread) and the page's running animations at load (motion table, declared), and scroll the tiles for entrances on headings, cards and the hero picture.",
   pass: "One load reveal at most, once, in reading order; staggers of 8 items or fewer at 30 to 100ms a step, 500ms in all (conflict C50 for demos and bento grids); no stagger on filtering; no gate before reading.",
   sources: ["hallmark §83 §84 §330 §338 §339", "taste-skill §33 §427 §459", "uupm §157 §237", "stageshow §43 §48"]}
- {id: T-HOVER-SIGNAL, name: Hover signal, lens: [motion], kind: H,
   run: "Read the declared transitions on links, buttons and cards (motion table, declared; dom-1440.json transitionProperty and the stylesheet text) and name each hover signal. Hover is not captured as frames, so judge only what the declarations show.",
   pass: "One quiet signal per interactive element (a colour step, a 1 to 2px lift or a border step), no uniform lift or scale on every card, no tilt, glow, shine, magnetic pull or cursor-follow, and no hover on non-interactive elements.",
   sources: ["hallmark §85 §311 §440", "taste-skill §412 §413 §414 §420"]}
- {id: T-LOOPS, name: Loops, lens: [motion], kind: H,
   run: "List what moves on its own: running animations at load and stylesheet `infinite` counts (motion table, declared), the passive recording, and the live runs' ambient count; name what each loop shows.",
   pass: "Every loop shows progress, a live state or real data, or is the one declared ambient loop; no decorative pulse, shimmer, twinkle, typing dots or logo marquee with nothing to show.",
   sources: ["hallmark §87", "taste-skill §33 §428 §429", "uupm §12 §145", "stageshow §48"]}
- {id: T-CONTINUITY, name: Continuity, lens: [motion], kind: H,
   run: "Step through each trigger's frame stills on the contact sheet (03-lenses/motion/contact-sheet.png) and read the live snaps and layout movement in the motion table.",
   pass: "Content changes with its surface (no label or number swapped in one frame while the surface glides), solid surfaces arrive opaque and whole, popovers hold their anchor, and resizing surfaces move as one.",
   sources: ["stageshow §49 §50 §56"]}
- {id: T-POSTER, name: Poster test, lens: [motion], kind: J,
   run: "Demo animations and product illustrations only. Cover the motion and look at the still the page shows with reduced motion and in the screenshot; then ask what happened in the demo and where its payoff is held.",
   pass: "The poster frame answers on its own with the result on screen; three to five beats build to one payoff that arrives full and is held about 2s.",
   sources: ["stageshow §45 §46 §47"]}
- {id: T-DEMO-LOOP, name: Demo loop seam, lens: [motion], kind: H,
   run: "Looping demos only. Read the passive recording (motion end, still moving, snaps) and watch the seam where the loop resets.",
   pass: "Every reset has a seen cause or is invisible, nothing rewinds in view, and the next action starts within about 1s of the exit from a calm, complete frame. An empty, short or gapped recording is inconclusive, never a pass.",
   sources: ["stageshow §45 §47 §61", "taste-skill §428"]}
- {id: T-STRESS, name: Stress matrix, lens: [robustness], kind: H, detector: stress,
   run: "Inject fixtures (data/fixtures) varying length, script, quantity and state.", pass: "Nothing visibly breaks.", sources: ["krehel §113"]}
- {id: T-SLOW-LINE, name: Slow mobile line, lens: [robustness], kind: M, detector: slow_network,
   run: "Throttle to 1.6 Mbit/s with 400ms RTT and scroll.", pass: "No image frame empty 1s after it enters the viewport.", sources: ["taste-skill §622"]}
- {id: T-PHONE-PARITY, name: Phone parity, lens: [robustness], kind: M, detector: phone_parity,
   run: "Compare words visible at 1440 and at 375.", pass: "Fewer than 40 words hidden on phone.", sources: ["hallmark §435"]}
- {id: T-COVER-FRAME, name: Cover (video), lens: [media-video], kind: J,
   run: "Pause at 3 random times.", pass: "Each frame works as a cover: one protagonist, at most 3 active elements.", sources: ["huashu §478 §479"]}
- {id: T-THUMBNAIL, name: 50% thumbnail and 3-metre, lens: [media-social, media-video], kind: H, detector: thumbnail,
   run: "View at 50% size (social) or phone size (video frame).", pass: "Text readable.", sources: ["ui-ux-pro-max §278", "huashu §489"]}
- {id: T-VERIFY-VERIFIER, name: Verify the verifier, lens: [capture], kind: M, detector: control_render,
   run: "Render evals/seeded-defects/control.html before the artifact.", pass: "Expected text and element counts match exactly; screenshot not near-blank.", sources: ["huashu §106"]}
- {id: T-SEEDED-DEFECT, name: Seeded defect, lens: [sweep], kind: M, detector: self_test,
   run: "Run every detector on evals/seeded-defects/seeded.html.", pass: "Every detector flags its seed; none flags the control.", sources: ["ux-ui-agent-skills §262"]}
- {id: T-REPRODUCTION-DIFF, name: Reproduction diff, lens: [fidelity], kind: H, detector: comp_diff,
   run: "Screenshot the build at comp size and compare region by region.", pass: "Largest divergence named; first-viewport fidelity >= 0.72.", sources: ["hallmark §149", "impeccable §497"]}
- {id: T-VARIANT-JUDGING, name: Variant judging, lens: [explore-directions], kind: J,
   run: "Show each option alone, full size, with real neighbours and data.", pass: "Never judged from thumbnails or with a favourite picked first.", sources: ["krehel §115", "Design Rules 1 §25"]}
