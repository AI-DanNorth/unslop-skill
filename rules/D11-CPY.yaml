  fix: Rewrite with a literal subject and verb, keep the articles, and name the actual range or the actual cases.
  sources:
  - research/notes/unslop-writing-skill-review.md (mannered prose, over-compression, false ranges, adverbs)
  - CPY-210 (KM §238)
  priority: P3
  waivable_by: brief
  status: active
