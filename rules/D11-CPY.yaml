- id: CPY-029
  title: 'Long-form: plain, whole sentences'
  domain: D11
  tier: Finish
  kind: context
  check: J
  applies_when:
  - web
  - email
  - print
  remedy: fix-copy
  tests:
  - T-LONG-FORM
  - T-SECOND-READ
  rule: 'In long-form content only, write plain, whole sentences: no mannered prose (metaphor nouns and verbs where a literal one exists), no
