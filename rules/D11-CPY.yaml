- id: CPY-025
  title: 'Long-form: one hedge is enough'
  domain: D11
  tier: Finish
  kind: context
  check: H
  applies_when:
  - web
  - email
  - print
  remedy: fix-copy
  tests:
  - T-LONG-FORM
  rule: 'In long-form content only, hedge a claim once or not at all: ''may'' is enough. Stacked hedges (''may perhaps'', ''arguably it could
