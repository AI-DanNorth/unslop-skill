- id: CON-001
  title: The client's own system is the concept
  domain: D02
  tier: Reflex
  kind: context
  check: J
  remedy: none
  tests:
  - T-OWN-SYSTEM
  rule: 'When the artifact applies the client''s own brand or design system consistently, judge it as a concept: score how well it uses that system
    for its job, and do not report its conventions as template. A direction the reviewer would not have chosen is not a finding.'
  why: A locked system overrides every other choice; calling an intentional, conventional identity 'generic' punishes the client for being consistent.
  fix: None when the system holds. Where a section drops the system for a framework default, bring that section back into the system.
  sources:
  - CON-112 (HM §5, HU §5)
  - CON-145 (HM §139-140)
  - CON-163 (HM §157, HM §155)
  priority: P1
  waivable_by: brief
  status: active
- id: CON-002
  title: Every large decision belongs to this client
  domain: D02
  tier: Reflex
  check: J
  remedy: explore-directions
  tests:
  - T-RIVAL-NAME
  - T-MIRROR
  rule: Make the subject, place, materials, numbers and voice of every large decision belong to this client. Under a rival's name, no heading
    stays true; a neighbouring brief in the same category would not get this hero, nav, footer and first section.
  why: A page that would work for any competitor tells the visitor nothing about this one.
  fix: Replace each line that survives the swap with a noun only this client has; change the one shared decision the mirror test names.
  sources:
  - CON-133 (HM §14)
  - CON-117 (HM §11)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: CON-003
  title: The idea fits in one sentence
  domain: D02
  tier: Reflex
  check: J
  remedy: explore-directions
  tests:
  - T-ONE-SENTENCE
  rule: State the design's idea in one sentence and its look as ground, ink, accent and faces, each with a source. If no sentence can be written,
    there is no concept.
  values:
    idea_sentences: 1
  why: Without a statable idea, every later choice is a default.
  fix: Write the sentence from the client's real material, then make the hero and first section say it.
  sources:
  - CON-122 (HM §15, HU §97)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: CON-004
  title: One idea runs the whole artifact
  domain: D02
  tier: Reflex
  check: J
  remedy: explore-directions
  tests:
  - T-IDEA-CARRIES
  rule: Let the one idea shape every screen, slide or page, top to bottom. An idea that stops at the hero is a template with a good hero.
  why: Visitors judge the page past the first screen; a strong hero over stock sections reads as a theme with a cover.
  fix: Carry the idea's material or device into the first two sections below the hero, or simplify the hero to match the rest.
  sources:
  - CON-121 (HM §15, HM §158)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: CON-005
  title: One real signature on the first screen
  domain: D02
  tier: Reflex
  check: J
  remedy: explore-directions
  tests:
  - T-SIGNATURE
  - T-DELETE-PICTURE
  rule: 'Give every artifact one signature: the brief''s strongest real thing at its best, on the first screen. On an app screen it is the object
    the tool is known by (ledger, timeline, queue). A number drawn as marks, a greeting over four stat cards or a gradient garnish is not a signature.'
  values:
    signatures: 1
    where: first screen
  why: The first screen is where the visitor decides whether this is for them; a decorative stand-in gives them nothing to remember.
  fix: Lead with the client's own photograph, product, work or data at full size; remove the garnish.
  sources:
  - CON-118 (HM §13, HU §7)
  - CON-119 (HM §13, HU §158)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: CON-006
  title: Spend boldness in one place
  domain: D02
  tier: Finish
  check: J
  remedy: fix-quieter
  tests:
  - T-BOLD-MOVE
  rule: Put one detail at 120% and keep the rest at 80%. Take one accessory off before shipping.
  values:
    bold_moves: 1
  why: Several loud moves cancel each other; none leaves the page forgettable.
  fix: Keep the move that carries the idea; quiet or remove the others. If there is none, enlarge the signature.
