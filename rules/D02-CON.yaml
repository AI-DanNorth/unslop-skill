- id: CON-007
  title: The motif grows out of the subject
  domain: D02
  tier: Reflex
  check: J
  remedy: explore-directions
  tests:
  - T-COVER-TEXT
  rule: The visual motif must be something only this subject has; the form should grow out of the content, and a reviewer should be able to say
    in one line where.
  why: A motif borrowed from the category or the look of the month could sit on any client's page.
  fix: Name the subject's own material (its objects, places, records, people) and derive the motif from it.
  sources:
  - CON-123 (HU §6, HU §52)
  priority: P1
  kind: ban
  waivable_by: brief
