- id: CON-008
  title: Refuse the default plan
  domain: D02
  tier: Reflex
  kind: cap
  check: J
  remedy: fix-layout
  tests:
  - T-DEFAULT-PLAN
  rule: 'Do not build from the default plan: split hero (head left, picture right), three numbered steps, label and value rows between hairlines,
    closing band with a form, dark footer under a huge wordmark, small grey labels, pale ground with one careful accent.'
  values:
    budget: 1
    template_at: 2
  why: Two of these in one plan means the plan is the template, however good the parts are.
  fix: Keep the one move that serves the job; replace the others with a shape the client's material suggests.
  sources:
  - CON-135 (HM §15)
  priority: P1
  waivable_by: brief
  status: active
- id: CON-009
  title: No look picked for the category or by default
  domain: D02
  tier: Reflex
  check: J
  remedy: fix-colorize
  tests:
  - T-MIRROR
  rule: Do not choose the spent looks (cream paper with a high-contrast serif and clay accent; near-black with one neon; pale ground with one
    timid accent; purple to blue) or a hue picked because of the category (blue software, green health) without a reason from the client.
  why: These looks are what any brief in the category gets; they signal that nobody chose.
  fix: 'Move one axis at a time: accent first, then paper, then display face, each from the client''s own material.'
