- id: A11-001
  title: Text contrast on real pixels
  domain: D10
  tier: Floor
  detector: contrast
  remedy: fix-a11y
  waivable_by: never
  tests:
  - T-GRADIENT-STOPS
  rule: Body text at least 4.5:1 and large text at least 3:1 against the worst sampled background pixel (WCAG 2.2 1.4.3). APCA reported as advisory.
  why: Low contrast excludes low-vision readers and everyone in sunlight.
  fix: Darken text or lighten ground; never thin weights on tinted ground.
  sources:
  - web-interface-guidelines
  - hallmark §411 §454
  - WCAG 2.2 1.4.3
  priority: P0
  kind: ban
  check: M
  status: active
  values:
    body: 4.5
    large: 3.0
    large_px: 24
    large_bold_px: 18.66
    apca_body_lc: 60
    apca_large_lc: 45
    scaled_ratio: 0.85
    mock_hint: (?:^|[-_]|(?<=[a-z0-9])(?=[A-Z]))(?i:graphic|mock(?:up)?|illustration|screenshot|preview|demo|frame)s?(?![a-z])
- id: A11-002
  title: Text size floors
  domain: D10
  tier: Floor
  detector: text_floor
  remedy: fix-typeset
  waivable_by: never
  rule: Running text (28+ characters) is at least the medium's body floor (web 16px, dense UI 14px); labels at least 12px.
  why: Small text fails readers before any other check.
  fix: Raise to the floor; cut words rather than shrink.
  sources:
  - huashu §66
  - hallmark §52
  - ui-ux-pro-max §43
  priority: P0
  kind: ban
  check: M
  status: active
  values:
    hard_px: 12
    body_px: 16
    dense_ui_px: 14
    label_px: 12
    min_run_chars: 28
    max_label_runs: 2
    scaled_ratio: 0.85
    mock_hint: (?:^|[-_]|(?<=[a-z0-9])(?=[A-Z]))(?i:graphic|mock(?:up)?|illustration|screenshot|preview|demo|frame)s?(?![a-z])
- id: A11-003
  title: Visible focus everywhere
  domain: D10
  tier: Floor
  detector: focus_ring
  remedy: fix-a11y
  waivable_by: never
  tests:
  - T-TAB-THROUGH
  rule: Every focusable element shows a focus indicator at 3:1 or better, never hidden under a sticky header, never removed without replacement.
  why: Keyboard users cannot see where they are.
  fix: Use :focus-visible with a 2px ring offset 2px in a contrasting colour.
  sources:
  - web-interface-guidelines
  - hallmark §455
  - WCAG 2.2 2.4.7 2.4.11
  priority: P0
  kind: ban
  check: M
  status: active
  values:
    min_contrast: 3.0
    fail_below: 2.95
- id: A11-004
  title: Target size
  domain: D10
  tier: Floor
  detector: targets
  remedy: fix-a11y
  rule: Interactive targets are at least 24x24px (Floor, WCAG 2.5.8); on touch, at least 44x44px (Reflex).
  why: Small targets cause mis-taps and exclude motor-impaired users.
  fix: Enlarge the hit area with padding or a pseudo-element.
  sources:
  - WCAG 2.2 2.5.8
  - hallmark §87
  - ui-ux-pro-max §22
  priority: P0
  kind: ban
  check: M
  waivable_by: never
  status: active
  values:
    floor_px: 24
    touch_px: 44
    touch_tier: Reflex
    footer_tier: Reflex
