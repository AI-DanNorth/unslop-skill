- id: WEB-001
  title: Performance budget
  domain: D15
  tier: Reflex
  detector: performance
  remedy: fix-harden
  rule: Lab LCP warns at 2.5s and fails at 4.5s; no image over 400KB or more than 2x its rendered width.
  why: Slow pages lose visitors before design matters.
  fix: Compress, size and lazy-load images; preload the LCP asset.
  sources:
  - taste-skill §622
  - agent-skills
  - web-interface-guidelines
  priority: P1
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    lcp_warn_ms: 2500
    lcp_fail_ms: 4500
    image_max_kb: 400
    image_max_ratio: 2.0
