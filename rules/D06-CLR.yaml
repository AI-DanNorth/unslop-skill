- id: CLR-005
  title: Colour follows one posture
  domain: D06
  tier: Reflex
  kind: context
  check: H
  remedy: fix-colorize
  waivable_by: brand-system
  tests:
  - T-ACCENT-DOSAGE
  rule: 'Hold one colour posture across the artifact: restrained (neutral page, accent as signal), committed (one colour fills 30 to 60% through
    a field or paper), full palette (3 to 4 named roles) or drenched (the surface is the colour). Under a restrained posture, do not paint a page-scale
    surface in the accent: the body, a section, header, footer, hero or band, anything 320px or 40% of the viewport tall, or a full overlay. Tints
    under 0.3 alpha are not a surface.'
  values:
    committed_share_pct:
    - 30
    - 60
    full_palette_roles:
    - 3
    - 4
    page_scale_min_px: 320
    page_scale_min_vh: 0.4
    max_tint_alpha: 0.3
  why: A restrained page that suddenly floods one band with its accent reads as two templates joined, and the accent stops pointing at anything.
  fix: Name the posture. Under restrained, move the band to a stepped neutral ground and keep the accent on the action inside it.
  sources:
  - CLR-124 (HM §68)
  - CLR-127 (HM §410)
