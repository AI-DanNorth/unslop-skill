    - 0.96
    accent_chroma_shift:
    - -0.04
    - -0.02
    accent_l_shift:
    - 0.05
    - 0.1
  why: Light-theme values flipped to dark glare, vibrate and lose their depth cues.
  fix: Give dark its own paper, ink, accent and elevation tokens; remove invert filters.
