- id: CLR-016
  title: Dark mode is derived
  not inverted: null
  domain: D06
  tier: Reflex
  kind: context
  check: H
  remedy: fix-colorize
  tests:
  - T-DARK-MODE
  rule: 'When the artifact is dark or ships a dark theme, derive it by recipe: paper at oklch L 0.12 to 0.18 tinted toward the anchor (not #000
    unless true OLED), ink at L 0.92 to 0.96 (not #fff), the accent re-derived (chroma down 0.02 to 0.04, lightness up 0.05 to 0.10, hue unchanged),
    drop shadows replaced by lightness steps or an inset hairline, and color-scheme declared. Never use filter: invert() or flipped light greys,
    and never invert raster images.'
  values:
