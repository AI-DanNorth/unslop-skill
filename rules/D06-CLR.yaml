- id: CLR-017
  title: Elevation gets lighter on dark
  domain: D06
  tier: Reflex
  kind: context
  check: H
  remedy: fix-colorize
  tests:
  - T-DARK-MODE
  - T-SURFACE-LADDER
  rule: On a dark ground, raised surfaces (cards, popovers, dialogs, menus) are lighter than the canvas, about 0.03 oklch lightness per level.
    An elevated surface is never darker than the canvas it sits on.
  values:
    step_l: 0.03
  why: On dark, light is what reads as nearer; a card darker than its page reads as a hole.
  fix: Step elevated surfaces up in lightness from the canvas.
