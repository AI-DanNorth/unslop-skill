  remedy: fix-colorize
  waivable_by: brand-system
  tests:
  - T-COLOUR-SOURCE
  rule: 'Take every primary colour from the brand or its design system, the content''s own imagery, or the culture of the subject, and be able
    to say why in one sentence. A framework default, a model favourite (#0066FF tech blue, #D97757 terracotta, #0D1117 with neon, violet at oklch
    hue 275 to 330) or a look family''s palette is not a source. A brand''s own colour is a source even when it resembles one of these.'
