- id: CLR-018
  title: Glass only on navigation and controls
  domain: D06
  tier: Reflex
  kind: context
  check: H
  remedy: fix-quieter
  waivable_by: brand-system
  tests:
  - T-SURFACE-LADDER
  rule: Do not use glass panels (backdrop blur over translucent near-white or near-black) by default. Where a system style asks for glass, keep
    it to navigation and controls with a restrained recipe (blur 10 to 20px) and an opaque fallback under prefers-reduced-transparency (conflict
