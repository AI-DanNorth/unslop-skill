- id: CMP-016
  title: Every data region draws its empty, loading and error states
  domain: D08
  tier: Reflex
  check: J
  remedy: fix-harden
  tests:
  - T-EMPTY-FIRST
  rule: 'A list, table, feed, inbox, search or dashboard panel is designed in four states: loading (a skeleton in the content''s shape, space
    reserved so nothing shifts), empty (one line naming what is empty, one on why it matters, one action), error (what failed and a retry) and
    full. A search with no results suggests what to try. A product shown only full, a blank panel or a bare ''No results'', or a spinner standing
    in for every state is a finding. What the empty and error text say is CPY-019''s and CPY-018''s; whether the states exist and hold their place
    is this card''s.'
  why: New users meet the empty state first and everyone meets the error state eventually; drawing only the full state designs a quarter of the
    screen.
  fix: Draw each data region's loading, empty and error states with the same frame as its full state, each with its one next action.
