- id: CMP-008
  title: Errors appear at the field, at the right time
  domain: D08
  tier: Reflex
  check: H
  remedy: fix-harden
  tests:
  - T-ERROR-PATH
  rule: Validate on blur once a field has been touched, then on every input, with a full check on submit; never on the first keystroke (conflict
    C06). The error appears under its field, replaces the helper in the same reserved line so nothing jumps, uses the error colour on the border
    plus text and an icon, and is tied to the field (aria-describedby, aria-invalid). After a failed submit, focus moves to the first invalid
    field or a linked summary, and everything typed is kept. What the error says is CPY-018's; where and when it appears is this card's.
  why: An error far from its field, one that appears while the user is still typing, or a submit that clears the form makes people redo work.
  fix: Show each error under its field on blur and on submit, in a reserved line, linked to the field, and keep the user's input after a failed
