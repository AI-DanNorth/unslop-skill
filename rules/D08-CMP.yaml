- id: CMP-003
  title: Waiting, failure and success belong to the action
  domain: D08
  tier: Reflex
  check: H
  remedy: fix-harden
  tests:
  - T-STATE-MATRIX
  - T-ERROR-PATH
  rule: 'While an action runs it shows progress in place: the label stays readable, the button keeps its width (the slot fits the longest label),
    a spinner or ''Sending'' appears after 150 to 300 ms and stays at least 300 ms, text joins it past 2 s, and the control refuses a second submit
    only while the request is in flight. When the request fails the user sees what failed and a way to retry, beside the action, with what they
    typed kept. Success shows the result itself (''The date goes to ana@studio.com''), not only a word. Whether the action responds at all is
    CMP-001''s measurement and a false success is INT-008''s: this card judges how the waiting, failing and succeeding states are designed.'
  values:
    spinner_after_ms:
    - 150
    - 300
    min_shown_ms: 300
    text_after_s: 2
  why: The moments after a click are when people decide whether to click again, wait or give up; an undesigned wait or a silent failure loses
    the task.
  fix: Design the pending, failed and done states of each primary action on the same button and in the same place, with a retry on failure and
    the real result on success.
  sources:
  - CMP-108 (HM §311, UX §328)
  - CMP-124 (HM §92 §314, UX §36 §232)
  - CMP-208 (HM §95 §321, UX §113 §133 §233)
  - CMP-211 (UX §238 §233)
  - CMP-269 (stageshow §49)
  - CMP-143 (HM §251, TS §67)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: CMP-004
  title: One primary action per view
  domain: D08
  tier: Reflex
  check: H
  remedy: fix-layout
  tests:
  - T-PRIMARY-COUNT
  rule: 'Each screen and each dialog has one filled primary: the action most visitors take first. Secondaries are outlined or typographic and
    never louder than the primary; a pair is a filled primary and a quieter action that goes elsewhere. Two filled buttons side by side, three
    hero actions, a third button style, or a destructive action styled as the primary (unless deleting is the view''s one job) is a finding. A
    nav call to action repeating the hero''s primary is the same action, not a second one.'
  values:
