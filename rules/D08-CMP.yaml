- id: CMP-013
  title: Overlays are the last answer and behave as overlays
  domain: D08
  tier: Reflex
  check: H
  remedy: fix-harden
  tests:
  - T-OVERLAY-CHECK
  rule: Use a dialog only after inline editing and disclosure have been ruled out, never for a primary flow, an error, a success or a warning,
    and rarely on phones. An open dialog dims the page behind it, holds focus and returns it to its trigger, locks the page scroll, closes on
    Escape, on a visible close control and (when nothing would be lost) on the backdrop, stays pinned within the viewport (max-height about 80dvh)
    and puts Cancel before Confirm, with a destructive confirm stating the consequence. A menu or popover flips near the edge and is never clipped
    by an overflow-hidden parent. Keyboard traps are lens-a11y's (Floor).
  why: A dialog takes the whole screen from the user; one that opens for little reason, or that does not close the way overlays close, feels like
    being trapped.
  fix: Replace the dialog with inline content where it can be, and give the remaining ones a scrim, a close control, Escape, scroll lock and focus
    return.
