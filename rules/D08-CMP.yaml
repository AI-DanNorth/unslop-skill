  remedy: fix-harden
  tests:
  - T-FIELD-READ
  rule: Every field has a visible label outside the box, above it (or beside it in a dense app row), that stays while typing. The placeholder
    shows a format ('01 Jan 2026'), never an instruction or the label. Required or optional is marked in words or an asterisk explained once,
    never by colour alone. Complex inputs keep a helper line under the field, and related fields are grouped under a legend. A programmatic label
