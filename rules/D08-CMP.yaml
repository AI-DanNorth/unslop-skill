- id: CMP-014
  title: Nothing interrupts the visitor uninvited
  domain: D08
  tier: Reflex
  check: J
  remedy: fix-quieter
  tests:
  - T-INTERRUPT
  rule: 'On a page the visitor came to read or buy from, nothing opens or floats over the content before they ask: no newsletter modal, entry
    gate, preloader, chat bubble, help pill, back-to-top square or award strip that covers content, and no system permission (notifications, location,
    camera) requested at launch: ask when the visitor reaches the feature, and never disguise a page element as a system dialog. A cookie banner
    the law requires is not a finding when it is plain and its decline is equal (INT-020 judges the decline).'
  why: An uninvited overlay stands between the visitor and the reason they came, and a permission asked too early is refused for good.
  fix: Remove the interruption or move it into the page flow; request permissions at the feature that needs them.
