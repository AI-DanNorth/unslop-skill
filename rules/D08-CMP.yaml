- id: CMP-001
  title: Async actions show that they are working
  domain: D08
  tier: Reflex
  detector: async_state
  remedy: fix-harden
  rule: While a request runs the clicked action visibly changes within 0.5 to 2 s (busy label, spinner, aria-busy, progress), and every progress
    state ends when the request ends. False success is cited as INT-008.
  why: With no feedback people click again and send twice; a spinner that never stops reads as a crash.
  fix: Keep the label and add an inline spinner and aria-busy="true" after ~150 ms; clear both when the answer arrives, success or failure.
  sources:
  - CMP-108 (HM §311, UX §328)
  - MOT-200 (hallmark §311)
  - A11-160 (uupm §95 §328)
  priority: P1
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    checks_ms:
    - 500
    - 2000
    min_changed_px: 100
    pixel_level: 24
    max_success_chars: 120
    false_success_rule: INT-008
    success_pattern: \b(created|saved|added|sent|published|updated|submitted|uploaded|exported|imported|subscribed|confirmed|booked|reserved|registered|invited|deleted|removed|success(ful(ly)?)?|thanks|thank
      you|all set|you're (in|on the list|all set)|done)\b
    honest_pattern: \b(not|nothing|no longer|failed|fail|error|couldn't|could not|can't|cannot|unable|try again|invalid|required|sending|saving|loading|pending|will
      be)\b
- id: CMP-002
  title: Every state a control can reach is designed
  domain: D08
