- id: CMP-015
  title: Feedback sits where the change happened; undo beats confirm
  domain: D08
  tier: Reflex
  check: J
  remedy: fix-harden
  tests:
  - T-ERROR-PATH
  rule: 'Show the result of an action where it happened (the row updates, the button says ''Copied'' for about 2.5 s); no toast when the effect
    is already visible, and never a celebratory one. Toasts are for failures and invisible effects: from one corner, aria-live polite, never stealing
    focus, pausing on hover; an error toast carries one retry and does not leave on its own. Reversible actions run at once with Undo for 5 to
    10 s; only irreversible ones confirm, and those name what is destroyed (conflict C27). A changed count or status is announced as a complete
    phrase without moving focus.'
  values:
    undo_s:
    - 5
    - 10
    copied_label_s: 2.5
  why: A toast far from the change makes people look in two places, an 'Are you sure?' on every action trains them to click through, and a vanishing
    error is never read.
  fix: Show the change in place, keep toasts for failures with a retry, and replace routine confirmations with Undo.
