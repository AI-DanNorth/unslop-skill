  rule: 'Each control family (buttons, links, fields, choices, tabs, menu items) shows default, hover (inside @media (hover: hover), one signal:
    a colour step, a 1px lift or a border step), focus-visible, active and, where it can happen, disabled, loading, error and success. Disabled
    uses more than opacity (cursor, the native disabled or aria-disabled attribute, and 3:1 kept), and a disabled control near the user''s attention
