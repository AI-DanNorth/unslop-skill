- id: CMP-005
  title: Controls belong to one family
  domain: D08
  tier: Finish
  check: H
  remedy: fix-polish
  tests:
  - T-ONE-FAMILY
  rule: 'Buttons, fields and links share one system: an input matches the height of the button beside it, border width stays constant across states
    (the focus ring is an outline, not a thicker border), one radius per control size, one link look site-wide, and a filled button keeps its
    own colour under the pointer (one step of it, never a grey swap). A control hugs its content with an inset on every side; it is never stretched
    with its label pinned to one end, and its text never touches its edge.'
  why: Controls that differ by a few pixels and a shade read as assembled from parts, and a border that thickens on focus shifts the layout.
  fix: Set control heights, radii, borders and hover steps once as tokens and apply them to every control.
