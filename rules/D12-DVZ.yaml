- id: DVZ-003
  title: No decorative charts or dashboards
  domain: D12
  tier: Reflex
  check: J
  remedy: explore-directions
  tests:
  - T-FILLER
  - T-ONE-QUESTION
  rule: 'A chart, gauge, donut or KPI tile is there because a reader needs its numbers, never to make the page look technical: no donut walls,
    gauge rows or KPI confetti, no decorative line squiggles or ''live'' graphs behind a hero, no icon, number and word metric cards with nothing
    behind them, and no hand-drawn map or contour or dot pattern dressed as one (real geodata, or no map). A dashboard leads with one hero figure,
    one supporting chart and one table, in one currency and unit system over one meaningful default range, with totals that reconcile. Whether
    the numbers are real is lens-integrity''s (INT-001, INT-007, and INT-013 for a staged dashboard of round growth figures): cite it as evidence;
    this card judges whether the chart is there to inform.'
  values:
    dashboard_hero_figures: 1
    dashboard_charts: 1
    dashboard_tables: 1
  why: Charts drawn as decoration teach the reader to skip every chart on the page, including the one that matters.
  fix: Cut the decorative charts and tiles, keep the one figure, chart and table the reader acts on, and draw maps from real geodata.
