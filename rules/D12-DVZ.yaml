- id: DVZ-011
  title: Label directly and keep the legend for when it is needed
  domain: D12
  tier: Finish
  check: H
  remedy: fix-layout
  tests:
  - T-DIRECT-LABEL
  rule: 'Name series where they are: end-of-line labels or labels on the bars, 12px or more apart and clear of each other. A legend appears only
    for more than one series that cannot be labelled directly (always for a direction-coded chart), sits in a strip below the plot rather than
    floating inside it, and shows only the encodings the chart uses. A single series has no legend. The charts table counts `legend` entries (svg
