- id: DVZ-006
  title: No 3D, effects or motion in data marks
  domain: D12
  tier: Reflex
  check: H
  remedy: fix-quieter
  tests:
  - T-DATA-INK
  rule: 'Data marks are flat: no 3D bars or pies (a third axis only where the data has one, with a 2D fallback), no drop shadows, glows, bevels
    or gradients in bars and slices (a sparkline''s fade fill is the one sanctioned gradient), no halftone, grain, sheen or moving traces in a
    chart area, and no animation still running after the data has drawn. Dark mode re-derives the series colours (less chroma, more lightness),
