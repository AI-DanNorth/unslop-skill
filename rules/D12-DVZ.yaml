- id: DVZ-015
  title: Connectors have one grammar
  domain: D12
  tier: Reflex
  check: H
  remedy: fix-polish
  tests:
  - T-CONNECTORS
  rule: 'Connectors route orthogonally behind nodes, never through a node, across a label or along a module''s top edge; curves only for loops
    and back arcs. Each arrow lands on a node edge (within about 4px, never floating 5 to 10px short), branches from one node leave from separate
    points, and arrowheads are open chevrons drawn in their direction. Line style means one thing: solid for the main path, dashed only for exceptional,
    auxiliary, return or not-yet paths (sequence returns dashed), never as decoration. Each architecture relationship carries a short verb or
    protocol on a masking plate that covers no node or other label, and no text runs vertically along an arrow. A line the reader cannot parse
    is deleted rather than explained, and minor relations move to the caption. The charts table counts straight segments, crossings, segments
    through nodes and ends floating 4 to 14px from a node; curves, diagonals, dashes and arrowhead direction are read on the crop.'
  values:
    endpoint_standoff_px: 4
    float_band_px:
    - 5
    - 10
  why: When arrows mean several things, cross, or stop short of their boxes, the reader cannot follow the flow the diagram exists to show.
  fix: Reroute connectors orthogonally behind the nodes, land each on an edge, keep dashes for one meaning and label each relationship with a
    verb.
  sources:
  - DVZ-191 (kami §363 §391 §404)
  - DVZ-192 (kami §365 §391 §450)
  - DVZ-193 (kami §363)
  - DVZ-194 (kami §364 §642)
