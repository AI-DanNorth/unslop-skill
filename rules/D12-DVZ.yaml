- id: DVZ-009
  title: Meaning survives without colour
  domain: D12
  tier: Reflex
  check: H
  remedy: fix-a11y
  tests:
  - T-GRAYSCALE
  - T-SECOND-ENCODING
  rule: 'No series, status or direction is told by hue alone: lines differ by style or carry a direct label, bars by position or label, deltas
    by sign or arrow, map classes by pattern or value. Red and green together need a second encoding (conflict C05); scientific figures use a
    colour-blind-safe pair such as blue and orange. A swatch close to the background gets an outline. A chart whose figures the text does not
    repeat has a text alternative (a summary sentence or a data table beside it, an svg title and desc, an aria-label), and hover values are reachable
    by keyboard. The charts table''s `colour_checks` flags red with green and colour pairs that fall within 10 Delta E under protanopia or deuteranopia.
    Label contrast is A11-001''s and an image chart''s alt text A11-005''s (Floor): cite them.'
  values:
    cvd_min_delta_e: 10
  why: About one man in twelve cannot tell red from green; a chart that relies on hue tells him nothing, and a screen reader gets nothing from
    a picture of a chart.
  fix: Add a second encoding (direct labels, line styles, signs or arrows), choose a colour-blind-safe pair, and give the chart a summary or a
    table.
  sources:
