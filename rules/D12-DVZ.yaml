- id: DVZ-012
  title: Charts read at their size and on a phone
  domain: D12
  tier: Reflex
  check: H
  remedy: fix-layout
  tests:
  - T-CHART-375
  rule: 'A chart sits at its column''s full width and scales with it (viewBox scaling, width 100% and height auto); it is never capped in height
    or shrunk to fit, and crowding is fixed by cutting, banding or splitting, never by smaller type. At 375 a chart still reads (fewer ticks,
    labels about 11px or more as rendered, nothing cut off) or turns into a table or a list; it never overflows the page or shrinks its labels
    to a few pixels inside a scaled SVG. A slide holds one diagram that fills most of it; a long document one figure per page. The charts table
    gives each region''s width at 375, whether it overflows or scrolls, and the rendered size of the smallest SVG label. Text below the size floor
    is A11-002''s (the sweep''s text_floor): cite it.'
  values:
    min_label_px_rendered: 11
    slide_fill: 0.65
  why: 'Most readers see the phone rendering: a chart that shrinks its labels to 5px or runs off the screen shows them nothing.'
  fix: Let the chart take the column width, cut ticks or labels at small widths, and swap it for a table or list on phones when it cannot read.
  sources:
