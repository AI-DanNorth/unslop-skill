    scatter_min_points: 20
    funnel_stages:
    - 3
    - 8
    radar_axes:
    - 5
    - 8
  why: 'The wrong form hides the comparison the chart exists for: a pie of nine slices or a line through three points makes the reader work out
    what a bar chart would have shown at a glance.'
  fix: 'Name the relationship, then redraw in its form: sorted bars for ranking, a line for time, a stacked bar for shares, a table past a dozen
    rows.'
