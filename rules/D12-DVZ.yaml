- id: DVZ-004
  title: Scales are honest
  domain: D12
  tier: Reflex
  check: H
  remedy: fix-layout
  tests:
  - T-HONEST-SCALE
  rule: 'Bars and areas start at zero. A line may start near its data only when the axis says so (''axis starts at 94%''). Ticks run at even intervals
    on one linear scale (a log scale is labelled as one), rounded outward to 4 to 8 ticks in steps of 1, 2, 2.5 or 5, with the precision of the
    step (''0 to 20 by 5'', not ''0.0 to 20.0''). No dual y-axes: two units are two charts or small multiples, and small multiples share one axis
    range. Candlesticks and range charts need not start at zero, and each high and low contains its open and close. The charts table reads tick
    values, whether a value axis includes zero, the value at a bar baseline and the step pattern; a canvas or image chart is read on its crop.
    A truncated axis that turns a small change into a large one, used as a claim, is also lens-integrity''s (INT-001, INT-012): cite it.'
  values:
    ticks:
    - 4
    - 8
    tick_steps:
    - 1
    - 2
    - 2.5
    - 5
  why: 'A bar''s length is its value: cut the axis and a 3% difference looks like a doubling, which readers take as the page''s claim.'
  fix: Start bars and areas at zero, label any line axis that does not, set even rounded ticks, and split dual axes into two charts.
  sources:
  - DVZ-127 (hallmark §306 §308, kami §425)
  - DVZ-128 (hallmark §308, kami §425)
  - DVZ-129 (hallmark §306)
  - DVZ-130 (huashu §272)
  - DVZ-135 (kami §425)
  - DVZ-118 (kami §418 §438, uupm §184)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: DVZ-005
  title: The chart agrees with itself and its words
  domain: D12
  tier: Reflex
  check: J
  remedy: fix-copy
  tests:
  - T-CHART-TEXT-MATCH
  rule: 'What the words say is what the marks show: a caption that says ''accelerated'' sits over a line that bends upward, the focal colour lands
    on the series the caption names, a labelled value matches the bar it labels, a waterfall''s closing bar equals its running sum, donut and
    stacked shares add to exactly 100% at the precision shown (largest remainder), and every mark sits where its value puts it, never placed by
    hand. A series made up to fill a chart is lens-integrity''s (INT-012); this card judges the agreement a reader can check on the page.'
  why: A reader who catches one chart contradicting its caption or its own totals stops trusting every number on the page.
  fix: Recompute the marks from the data, reconcile totals and shares, and rewrite the caption to say what the chart shows.
