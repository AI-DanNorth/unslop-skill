- id: DVZ-010
  title: The takeaway, unit, base and source are on the figure
  domain: D12
  tier: Reflex
  check: J
  remedy: fix-copy
  tests:
  - T-TAKEAWAY-TITLE
  rule: 'Each chart states its point once in words: a title or caption that says the finding (''Revenue grew faster after the Q2 price change''),
    not the topic (''Revenue by quarter''). Where the takeaway sits is by scope (conflict C53): an insight title on web and slide charts, a caption
    under a print or editorial figure, never both repeating each other. The unit sits in an axis caption or on the value labels; any index base,
    definition or shared scale sits in the subtitle (''Jan 2019 = 100''); a data chart credits its source in a line under it; a statistical figure
    states n, the error measure and the test. Whether the cited source is real is lens-integrity''s (INT-011).'
  why: A topic title makes every reader work out the point alone, and a chart with no unit or source cannot be read or checked.
  fix: Rewrite the title as the finding, add the unit and any base to the axis or subtitle, and add a source line.
  sources:
