- id: DVZ-001
  title: Each chart or diagram earns its place
  domain: D12
  tier: Reflex
  check: J
  remedy: fix-distill
  tests:
  - T-DIAGRAM-EARNS
  - T-ONE-QUESTION
  rule: Every chart answers one question a reader has (how did this change, which is biggest, what share, how do these parts connect) and adds
    a comparison, trend, distribution or connection the text does not already give. A chart that restates a figure already on screen or a sentence
    goes. Two things compared are a sentence or a table, and one labelled box is a sentence. When the point is how things connect, draw a diagram;
    when the point is what a user sees, show a capture or a UI fragment, never a diagram of a screen. When the data can carry the page, it becomes
    the picture itself (objects scaled to proportion, a route on a real map) rather than three big number cards.
  why: A chart that answers nothing costs the reader time and tells them the page was decorated, not informed.
  fix: Name the question each chart answers and cut the ones the text already answers; turn a two-value chart into a sentence and a diagram of
    a screen into a capture.
  sources:
  - DVZ-101 (kami §338 §344)
  - DVZ-102 (kami §141 §262 §301)
  - DVZ-104 (taste §372)
  - DVZ-108 (huashu §82 §168)
  - DVZ-201 (kami §391 §372)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: DVZ-002
  title: The chart form fits the comparison
  domain: D12
  tier: Reflex
  check: H
  remedy: fix-layout
  tests:
  - T-CHART-FORM
  rule: 'Choose the form from the data relationship (change over time, ranking, part-to-whole, correlation, distribution, deviation, flow, magnitude,
    place), then the look. Time is a line, or bars when absolute counts per period matter most; four points or fewer is a stat tile, not a line.
    A category comparison is bars sorted by value, horizontal when the labels are long or there are seven or more; about 8 categories by 3 series
    at most, and a table past about 12. Part-to-whole is a stacked bar; a pie or donut only for 2 to 5 labelled parts (conflict C04: flag 6 or
    more), never for slices within 5% of each other. One value is a stat tile, never a one-bar chart. Correlation is a scatter of 20 points or
    more; distribution a box plot or histogram of 20 or more per group. Funnels only for sequential stages (3 to 8), radar only for 2 or 3 series
    over 5 to 8 axes, treemaps and sunbursts to 3 levels, heatmaps of 20 cells or more with a numeric legend, and no word cloud where values matter.
    When several forms fit, pick the one that shows the difference most clearly.'
  values:
    line_min_points: 4
    max_categories: 8
    max_series: 3
    table_past: 12
    pie_parts:
