- id: DVZ-014
  title: A diagram has one focal point and a node budget
  domain: D12
  tier: Reflex
  check: H
  remedy: fix-distill
  tests:
  - T-DIAGRAM-EARNS
  - T-DIAGRAM-FOCAL
  - T-30S-BOARD
  rule: 'A figure holds about 9 nodes (12 on a web diagram card, conflict C54); more is two diagrams or a list. It marks one or two focal elements
    in the accent, on the element the caption names, with the accent under about 5% of the figure. Nodes vary in size by tier (two or three sizes,
    never every node its own), and carry an optional icon, a title in the product''s own terms and two or three short lines, never a paragraph
    or a jargon node (''orchestration layer'', ''AI engine''). Diagrams introduce no new colours or fonts and look like one system with each other:
    no glows, gradients, shadows, radii over 10px or neon on dark as ''technical''. Plan furniture (dates, owners, phases) stays out of architecture
    diagrams, and future or uncertain parts are drawn at lower weight (dashed, faded), never focal. A reader can state the main path in 30 seconds.'
  values:
    max_nodes: 9
    max_nodes_web_card: 12
    focal_max: 2
    accent_area_max: 0.05
    node_size_tiers:
    - 2
    - 3
    max_radius_px: 10
  why: A diagram with every box equally loud and twenty nodes has no main path, so the reader leaves with nothing.
  fix: Cut or merge nodes to the budget, put the accent on the one element the caption names, and size nodes by tier.
  sources:
