- id: DVZ-013
  title: Stat tiles and sparklines show a figure honestly
  domain: D12
  tier: Reflex
  check: H
  remedy: fix-copy
  tests:
  - T-STAT-TILE
  rule: 'One value is a stat tile: the figure, a worded qualifier that says what it counts and over what period, and, when it changed, a signed
    delta against a named baseline. A sparkline beside it shows the real trend of that same figure (no axes, no grid, one colour) or is left out;
    a squiggle that does not follow the data, a ring or bar with no target, a trend of three points, or a delta whose colour is its only sign
    of direction is a finding. Tiles in one row share one unit system and one period. Whether the figure is sourced is INT-007''s and INT-011''s
    (the sweep''s stat_band): cite them; this card judges how the figure is shown.'
  why: A big number with no qualifier, period or baseline cannot be read, and a decorative trend line beside it implies a history nobody measured.
  fix: Give each tile its qualifier, period and baseline, keep a sparkline only when it plots that figure, and sign every delta.
  sources:
