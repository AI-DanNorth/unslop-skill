- id: MOT-017
  title: A demo animation builds to one payoff
  domain: D09
  tier: Finish
  kind: context
  check: J
  remedy: fix-motion
  tests:
  - T-POSTER
  rule: In a product illustration or demo animation, tell three to five beats that build to one payoff, show the payoff full at the shown size
    and hold it (about 2s) before the exit, and choose a poster frame (the still for thumbnails and reduced motion) with the result on screen.
