- id: MOT-001
  title: Motion CSS hygiene
  domain: D09
  tier: Reflex
  detector: motion_css
  remedy: fix-motion
  rule: 'No transition: all; animate transform and opacity, not layout properties; no overshoot past 1.05 in UI; exits 60 to 75% of enters.'
  why: These produce jank, layout thrash and toy-like motion.
  fix: List properties; use transform; one non-overshoot curve.
  sources:
  - hallmark §323 §327
  - transitions-dev
  - agent-skills §1
  priority: P1
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    max_overshoot: 1.05
    exit_ratio:
    - 0.6
    - 0.75
    banned:
    - 'transition: all'
    - 'transition-property: all'
    layout_props:
    - width
    - height
    - top
    - left
    - right
    - bottom
    - margin
    - padding
- id: MOT-002
  title: Transitions measured from frames stay short and direct
  domain: D09
  tier: Reflex
  detector: motion
  remedy: fix-motion
  rule: Each triggered transition (dialog, menu, tab, disclosure) ends within its kind's limit, enters from at least 0.90 scale and at most 16px
    away, never passes its end state by more than 1.05, does not use the default ease, and does not push other content while it runs. With reduced
    motion nothing moves (cited as A11-011).
  why: 'Measured in the browser, these are what make motion read as off-the-shelf: slow, popping from far, drifting, bouncing or dragging the
    page with it.'
  fix: Use one tuned curve such as cubic-bezier(0.22, 1, 0.36, 1); start overlays at 0.96-0.97 scale and 6-8px; keep menus near 200ms and dialogs
    near 250ms; animate transform and opacity only; drop movement under prefers-reduced-motion.
  sources:
  - transitions-dev tokens and generic demo (example.html)
  - hallmark §82 §95 §323 §327 §329 §330
  - uupm §14 §156 §168 §237
  - huashu §337 §349
  - agent §28 §78
  priority: P1
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    max_ms:
      menu: 300
      tab: 300
      button: 300
      disclosure: 450
      dialog: 450
    min_enter_scale: 0.9
    max_travel_px: 16
    max_overshoot: 1.05
    min_overshoot_px: 1
    banned_easing:
    - ease
    linear_movement: true
    layout_px: 2
    settle_px: 1
    settle_opacity: 0.02
    min_root_px: 32
    reduced_move_px: 2
    reduced_scale: 0.02
    reduced_min_px: 24
    reduced_rule: A11-011
- id: MOT-003
  title: Movement lands where it ends
  domain: D09
  tier: Finish
  detector: motion_snap
  remedy: fix-motion
  rule: Recorded in real time after a click, no element glides and then jumps more than 3 px in one frame to its end state, and no content is
    shoved in one frame while another element is still animating. Instant changes are not judged.
  why: 'A movement that stops short and snaps, or a neighbour that jumps while a panel glides, reads as broken motion: the eye follows the glide
    and sees the cut.'
  fix: Tween or spring to the true final layout; when content around an animating element must move, animate its container with the same transition
    or reserve the space first.
  sources:
  - Stageshow references/motion.md (Things that appear, travel and leave) and scripts/jumps-core.mjs (benjitaylor/skills, MIT)
  - Stageshow references/teaching.md (Landing jumps at handoff; New row shoves its neighbors)
  priority: P3
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    min_px: 3
    max_hits: 6
- id: MOT-004
  title: Every motion has a job
  domain: D09
  tier: Reflex
  check: J
  remedy: fix-motion
  tests:
  - T-PURPOSE
  rule: 'Name the job of each animation: feedback (the input was received), orientation (where something came from or went), continuity (the same
    thing in a new state) or a deliberate showpiece the visitor chose to watch. Motion whose loss would go unnoticed if the change were instant
    has no job; static is the default answer.'
  why: Motion with no job costs the visitor time on every use and says the page was assembled from a kit that animates everything.
  fix: Cut the motion that has no job, or make the change instant; keep the motion that explains a change.
  sources:
  - MOT-101 (agent §1, hallmark §323, taste §408, huashu §324)
  - MOT-102 (hallmark §323 §84)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: MOT-005
  title: Duration follows how often the motion is seen
  domain: D09
  tier: Reflex
  kind: context
  check: H
  remedy: fix-motion
  tests:
  - T-FREQUENCY
  rule: 'Time each motion by how often a visitor sees it and what triggered it. Feedback on a control used many times (a tab, a menu, a toggle,
    a disclosure, a copy button) stays on the product''s short scale: press and toggle 100 to 200ms, menus near 200ms, overlays up to about 420ms,
    and never linear on movement. A long arrival is allowed only for a showpiece the visitor started or sees once (a hero reveal, a shuffle the
    visitor asks for, a demo), and never on a control''s own feedback. A sweep `duration`, `easing`, `travel` or `overshoot` hit on a showpiece
    is fitting; on repeated feedback it stands (conflict C52).'
  values:
    toggle_ms:
    - 100
    - 200
    menu_ms: 200
    overlay_max_ms: 420
    showpiece_ms:
    - 800
    - 1000
  why: A 750ms tab switch is pleasant once and a tax on the twentieth click; the same length on a one-time reveal is a choice.
  fix: Put repeated feedback on the short scale; keep the long timing only on the moment the visitor sees once.
  sources:
  - MOT-126 (uupm §8 §237)
  - MOT-127 (agent §78, huashu §337)
  - MOT-128 (uupm §143)
  - MOT-125 (hallmark §83 §324 §438)
  - MOT-250 (stageshow §48)
  priority: P1
