- id: MOT-014
  title: Loops show a state or real data
  domain: D09
  tier: Reflex
  check: H
  remedy: fix-motion
  tests:
  - T-LOOPS
  rule: 'Run an infinite loop only for a loader, one small loop or one declared ambient loop. Ban decorative attention loops: pulsing dots, twinkling,
    flicker, hue cycling, scrambled text, typing dots, a blinking caret after a headline, and marquees of logos or claims with nothing to show.
    A loop past 5s with no pause control is WCAG 2.2.2 and stays with lens-a11y.'
  values:
    small_loop_max_s: 4
