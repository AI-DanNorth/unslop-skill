- id: MOT-016
  title: Solid surfaces arrive whole and hold their anchor
  domain: D09
  tier: Finish
  check: H
  remedy: fix-motion
  tests:
  - T-CONTINUITY
  rule: Windows, cards, sheets and toasts arrive by moving, opaque or nearly, never as a half-transparent ghost and never uncovered by a hard
    moving edge that slices text. A popover or menu fits before its first frame and holds the edge it opened from while its content changes; a
    resizing surface moves size, position and content as one transition without stretching its text.
  why: Ghosted solids and sliced text break the illusion that the surface is one object, which is the whole point of animating it.
  fix: Animate the surface with transform from just off its resting place, keep it opaque, and size it before it opens.
  sources:
  - MOT-259 (stageshow §50)
  - MOT-260 (stageshow §50 §56)
  - MOT-261 (stageshow §50)
  - MOT-262 (stageshow §50 §56)
