- id: MOT-015
  title: A change moves only what changed
  domain: D09
  tier: Finish
  check: H
  remedy: fix-motion
  tests:
  - T-CONTINUITY
  rule: 'Where a surface animates, its content changes with it: no label, menu or number swapped in one frame while the surface glides; the changed
    span moves and what follows makes room continuously. In product UI a one-time reflow is fine (conflict C51); content shoved in one frame while
    another element is mid-animation is MOT-003''s and stays with the sweep.'
  why: A glide with a hard cut inside it draws the eye to the cut; motion that half-explains a change is worse than none.
  fix: Animate the changed span with its container, or make the whole change instant.
  sources:
  - MOT-253 (stageshow §49 §56)
