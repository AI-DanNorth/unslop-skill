- id: MOT-010
  title: The kind of transition matches what changed
  domain: D09
  tier: Reflex
  check: J
  remedy: fix-motion
  tests:
  - T-SPATIAL-MEANING
  rule: A shared-element morph means the same thing, deeper; a directional slide means an ordered sequence or a step in a hierarchy; a cross-fade
    means a lateral swap; an overlay grows from its trigger. Do not slide tabs or unordered views sideways, and keep next from the right and previous
    from the left (mirrored for right-to-left).
  why: Motion tells the visitor where things live. A slide between peers invents a hierarchy that is not there.
  fix: Cross-fade lateral swaps, slide only ordered steps, and open overlays from the control that opened them.
  sources:
  - MOT-165 (agent §3 §7-§14)
  - MOT-166 (agent §8 §49)
  - MOT-167 (agent §49, uupm §237 §364)
  - MOT-141 (uupm §237, hallmark §329)
  priority: P1
  kind: ban
