- id: MOT-008
  title: The curve fits the direction and the scope
  domain: D09
  tier: Finish
  check: H
  remedy: fix-motion
  tests:
  - T-MOTION-SYSTEM
  rule: Ease out on arrival, ease in on exit, ease in and out on travel and toggles, and linear only for progress, spinners, loops and scroll
    scrubbing. Overshoot and springs belong to showpieces, demo films and declared playful moments, never to UI state (conflict C15).
  why: An arrival that starts slowly feels late, an exit that lingers blocks the next action, and a bounce on a menu reads as a toy.
  fix: Use a decelerating curve such as cubic-bezier(0.16, 1, 0.3, 1) for arrivals and a short ease-in for exits.
  sources:
  - MOT-129 (hallmark §82 §342, uupm §14 §237, agent §80, huashu §335)
  - MOT-130 (hallmark §438, huashu §332)
  - MOT-131 (hallmark §82 §324 §438, taste §410 §443, uupm §160)
  priority: P3
  kind: ban
  waivable_by: brief
  status: active
- id: MOT-009
  title: Exits are quicker than entrances and leave no gap
  domain: D09
  tier: Finish
  check: H
  remedy: fix-motion
  tests:
  - T-ENTER-EXIT
  rule: Pair every enter with an exit (or an explicit none), make the exit 60 to 75% of the enter, and never leave a blank frame of more than
    0.3s between outgoing and incoming content.
  values:
    exit_ratio:
