- id: MOT-007
  title: One curve family and one duration scale
  domain: D09
  tier: Finish
  check: H
  remedy: fix-motion
  tests:
  - T-MOTION-SYSTEM
  rule: 'Route durations and easings through one declared set: one non-overshoot curve family for UI (conflict C38) and one three-step duration
    scale (conflict C39). Raw framework defaults on every element (the browser''s `ease`, Tailwind''s 150ms cubic-bezier(0.4, 0, 0.2, 1)) and
    several unrelated curves for the same kind of change show that nobody set the motion.'
  values:
    scale_steps: 3
