- id: PRC-001
  title: Capture must be trustworthy
  domain: D17
  tier: Floor
  detector: near_blank
  remedy: none
  waivable_by: never
  tests:
  - T-VERIFY-VERIFIER
  rule: Stop the run if the control render fails or a screenshot is empty (under 0.15% of pixels differ by more than 24 levels from the dominant
    colour).
  why: A blank or wrong render produces confident nonsense.
  fix: Fix the capture (wait for fonts, network, lazy content) and recapture.
  sources:
  - huashu §49 §106
  priority: P0
  kind: ban
  check: M
  status: active
  values:
    max_diff_share: 0.0015
    level: 24
- id: PRC-002
  title: Redesigns keep content and behaviour
  domain: D17
  tier: Floor
  detector: redesign_loss
  remedy: none
  waivable_by: brief
  rule: A redesign keeps every link, field, handler and id, and does not drop more than 40% of words without the brief saying so.
  why: Silent loss breaks the product.
  fix: Restore the missing items or get them cut in the brief.
  sources:
  - hallmark §521
  priority: P0
  kind: ban
  check: M
  status: active
  values:
    max_word_drop: 0.4
