- id: SLP-001
  title: No eyebrow labels above headings
  domain: D03
  tier: Reflex
  kind: cap
  detector: eyebrow
  remedy: fix-typeset
  tests:
  - T-EYEBROW
  rule: Do not set a small tracked label directly above a heading unless it carries a fact, destination or identifier.
  why: Eyebrows are the most common machine default; they repeat the heading's job and flatten the hierarchy into a template.
  fix: Promote any fact into the heading or the line below it; delete the rest.
  sources:
  - hallmark §111 §369
  - impeccable §519 §520
  - kami §4
  - huashu §59
  priority: P1
  check: M
  waivable_by: brief
  status: active
  values:
    max_size_px: 14
    max_ratio_to_heading: 0.45
    min_tracking_em: 0.06
    min_heading_px: 20
    max_gap_px: 48
    budget: 0
- id: SLP-002
  title: No decorative section numbering
  domain: D03
  tier: Reflex
  kind: cap
  detector: numbered_labels
  remedy: fix-typeset
  rule: Do not number sections 01, 02, 03 unless the reader needs to refer to them by number.
  why: Numbered labels imply a sequence the content does not have and are a strong template tell.
  fix: Remove the numbers or make them real steps.
  sources:
  - impeccable §521
  - huashu §59 §60
  - hallmark §366
  priority: P1
  check: M
  waivable_by: brief
  status: active
  values:
    max_size_px: 13
    min_heading_ratio: 1.3
    min_count: 2
    budget: 0
