- id: SLP-005
  title: No uniform card kit
  domain: D03
  tier: Reflex
  kind: cap
  detector: card_kit
  remedy: fix-layout
  rule: Do not apply the same radius and shadow recipe to every container, or hairline plus wide shadow to every card in a row.
  why: One box recipe everywhere erases hierarchy; the surface ladder (whitespace, hairline, tinted well, card) exists for a reason.
  fix: Remove boxes where whitespace groups; keep one card style for things that are objects.
  sources:
  - huashu §68
  - impeccable §561
  - hallmark §79
  priority: P1
  check: M
  waivable_by: brief
  status: active
  values:
    min_same_recipe: 4
    wide_shadow_px: 32
    min_row: 3
