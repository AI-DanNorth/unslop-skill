- id: ROB-018
  title: Weight fits the page's job
  domain: D15
  tier: Reflex
  kind: context
  check: H
  remedy: fix-harden
  tests:
  - T-WEIGHT-FOR-JOB
  rule: 'Judge the measured weight against budgets (WARN then FAIL): transfer 1500 then 3000 KiB, images 1200 then 2400, the largest image 350
    then 700, JavaScript 450 then 900, CSS 120 then 250, 60 then 110 requests, 4 then 6 font files and 160 then 320 KiB of fonts; lab LCP warns
    at 2.5s and fails at 4.5s (conflict C41). Over a budget is a finding when the weight buys nothing for the page''s job: a 2MB logo, a 6MB hero
    on a landing page, a full-resolution photo shown at thumbnail size, a WebGL scene behind body text. A photo portfolio may spend its budget
    on photographs and a product page on its demo video, provided the LCP element is never lazy-loaded (fetchpriority high), images below the
    fold are lazy, files are served at 2x their shown width or less in AVIF or WebP (a hero at 400KB or less, other photos at 250KB or less),
    below-fold photos are img not CSS backgrounds, scripts are deferred, WebGL is capped (4 live contexts, paused off-screen) and effect modules
    that never mount are not loaded. Report observed numbers only; the sweep measures image bytes and LCP (WEB-001): cite it.'
  values:
    transfer_kib:
    - 1500
    - 3000
    image_kib:
    - 1200
    - 2400
    largest_image_kib:
    - 350
    - 700
    js_kib:
    - 450
