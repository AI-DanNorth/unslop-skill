  tests:
  - T-SCRIPT-COVERAGE
  rule: 'The html lang names the language the page is written in (its presence is A11-008''s, Floor), a document keeps one locale with no bilingual
    stacking, and locale variants keep the same facts, colours and spacing tokens (only font stacks differ). Mixed-script font stacks are ordered
    so each script gets the face chosen for it, every glyph the copy uses exists in the chosen faces (no tofu, no system face drawing an arrow,
