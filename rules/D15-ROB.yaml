  - T-HOSTILE-CONTENT
  rule: 'Text wraps before it is cut. Where it must be cut (a dense table cell, a card excerpt), it ends in an ellipsis, a clamp keeps 2 to 3
    lines, and the full text is one operable step away (a link, an expander, the detail page), never hover-only. Headings, actions, error and
    safety text, prices and the names that tell items apart are never truncated. Text clipped by overflow: hidden with no ellipsis, a single-line
