- id: ROB-016
  title: The page degrades on slow and failed networks, not breaks
  domain: D15
  tier: Reflex
  check: H
  remedy: fix-harden
  tests:
  - T-FAILURE-PATH
  - T-SLOW-LINE
  rule: 'When the network is slow or a request fails, the page answers: a timed-out request shows what happened with a retry and keeps everything
    typed; slow connections get a degraded mode (lower-resolution images, fewer effects) and offline gets a message; a feature that depends on
    an outside provider (maps, payments, chat, video, fonts) has a fallback. A broken or missing image shows a styled frame in the ground colour,
    never the browser''s broken-image icon or an empty hole, and images sit on a loading fill until they arrive; every WebGL or canvas piece shows
    a poster first and falls back to a still on missing WebGL2, a lost context or an empty first frame. How a clicked action shows it is working
    is CMP-001''s and CMP-003''s: cite them. A request the capture blocked is ''not verified'', never a finding.'
  why: Most visitors meet the slow or failed case some of the time, and a page that only works on a fast, perfect connection looks broken to them.
  fix: Add timeouts with retry, a loading fill and a styled broken state for images, a poster for every canvas, and fallbacks for outside providers.
  sources:
  - ROB-194 (uupm §238, taste §67)
  - ROB-195 (uupm §233)
  - ROB-201 (agent §324)
  - ROB-170 (hallmark §463, huashu §66, adp §256)
  - ROB-171 (taste §622 §623)
  - ROB-174 (taste §630)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: ROB-017
  title: Loading never moves what the visitor is reading
  domain: D15
  tier: Reflex
  check: H
  remedy: fix-harden
  tests:
  - T-LAYOUT-SHIFT
  rule: 'Everything that arrives late has its space reserved: images declare width and height or an aspect-ratio, data regions load into a skeleton
    in their own shape, ads, embeds, chat and cookie banners reserve space or render out of flow (a consent banner is never rendered synchronously
    in the head), web fonts use font-display swap or optional with metric-matched fallbacks (size-adjust, ascent-override) so the swap does not
    reflow, and a stored theme is read by a tiny inline script before first paint so the page never flashes the wrong mode. Layout shift is not
    measured by the capture: judge it from what arrives late and whether its space is held.'
  why: Text that jumps as images, fonts and banners arrive makes visitors lose their place and click the wrong thing.
  fix: Give every late element its size up front, load data into shaped skeletons, and match fallback font metrics.
