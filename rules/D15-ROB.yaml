  domain: D15
  tier: Floor
  priority: P0
  check: M
  rule: 'Required content counts only when visibly rendered. Hidden = `display:none`, `visibility:hidden/collapse`, `opacity:0`, `font-size:0`,
    `color:transparent`, `hidden`, `aria-hidden`, zero scale/matrix, translate beyond ~-2000, `content-visibility:hidden`, `filter:opacity(0)`,
    offsets/text-indent ≥100%/100em or ≥2000 units, `clip:rect(0,0,0,0)`, `clip-path: inset(50%)/inset(100%)/circle(0)`, zero-size replaced or
    overflow-clipped boxes, SVG `fill="none"`/`fill-opacity:0` or outside viewBox.'
  values: Detector list
  area: Hidden-content detection
  sources:
  - kami §675-§679
  mined_from: D-motion-a11y-robustness.md#ROB-173
  status: draft
