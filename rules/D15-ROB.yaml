- id: ROB-008
  title: Boxes grow with their content
  domain: D15
  tier: Reflex
  check: H
  remedy: fix-layout
  tests:
  - T-HOSTILE-CONTENT
  - T-STRESS
  rule: 'A box that holds text takes its height from the text: no fixed height on a card, panel or banner whose text can change, and cards in
    a row line up by stretching to the tallest, not by a set height that the longest text overruns. Cards that keep one height when stacked one
    per row on a phone while their text lengths differ have a fixed or minimum height. Grid column counts come from the data or auto-flow, never
    a fixed number paired with a data constant; metric labels are planned against their column (stack the value over the label whenever a label
    can wrap); a missing image or an empty field leaves the card whole. Fixed boxes are kept only for text that animates or swaps (a rolling count
    reserves its widest width, tab panels share one height).'
  why: A design tuned to equal-length sample copy breaks the day a real title runs a line longer or a field is empty.
  fix: Remove fixed heights from text boxes, let rows stretch, and reserve space only where text animates.
