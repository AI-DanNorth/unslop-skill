- id: ROB-001
  title: Content never depends on animation to appear
  domain: D15
  tier: Floor
  detector: hidden_content
  remedy: fix-harden
  waivable_by: never
  tests:
  - T-HIDDEN-CONTENT
  rule: All content is visible with reduced motion, with an observer that never fires, and with scripts off; under 30% of text hidden after load.
  why: Reveal-on-scroll pages are blank for crawlers, print, reduced motion and slow devices.
  fix: Start visible; animate from visible.
  sources:
  - taste-skill §437
  - hallmark §445
  priority: P0
  kind: ban
  check: M
  status: active
  values:
    max_hidden_share: 0.3
    observer_wait_ms: 4000
- id: ROB-002
  title: Phone parity
  domain: D15
  tier: Reflex
  detector: phone_parity
  remedy: fix-layout
  tests:
  - T-PHONE-PARITY
