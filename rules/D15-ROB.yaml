- id: ROB-015
  title: Content and navigation do not depend on script
  domain: D15
  tier: Reflex
  kind: context
  check: H
  remedy: fix-harden
  tests:
  - T-NO-SCRIPT
  - T-HIDDEN-CONTENT
  rule: 'A page meant to be read (a landing page, an article, docs, a shop''s product page) shows its text, navigation and primary action with
    scripts off and when an observer never fires: nothing is hidden at rest until script runs (hide only under a script-added class, or animate
    from visible), hero words hide only until script or a safety mark of about 700ms, required facts are not in SVG text or behind conditional
    visibility, key screens have their own URL, and the page throws no script error on load. The share of text hidden is ROB-001''s (Floor, hidden_content):
    cite it; this card judges what the visitor loses. An application''s working surface may need script, and says so; a client-rendered marketing
    page that is blank without it is a finding.'
