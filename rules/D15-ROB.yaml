- id: ROB-013
  title: Ready for right-to-left
  domain: D15
  tier: Finish
  kind: context
  check: H
  remedy: fix-harden
  tests:
  - T-RTL-READY
  rule: 'Spacing, borders, insets and alignment use logical properties (margin-inline-start, padding-inline, inset-inline-end, text-align: start)
    or are mirrored under [dir=rtl], so the layout can flip. Directional marks mirror in right-to-left: arrows and chevrons that mean next or
    back, carousels, progress, sliders, charts with a time axis, marquees, parallax and directional motion. Logos, media controls, clocks and
    numbers do not. On a page that serves or links to a right-to-left language, a failure is reported at Reflex, citing draft ROB-127; elsewhere
    it is a Finish note about readiness, never a finding against a page that has no such audience.'
  why: A layout built on left and right has to be rebuilt to ship in Arabic or Hebrew, and an arrow that still points right sends readers backwards.
  fix: Replace physical spacing and alignment with logical properties and mirror directional icons and motion under dir=rtl.
