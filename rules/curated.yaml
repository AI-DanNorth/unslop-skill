# Active, hand-written cards for phase 1. Ids 001-099 per prefix are reserved for curated cards;
# mined drafts are imported from research/mining as 101+ (see scripts/build/build_rules.py).
# `values` is filled at build time from data/thresholds.yaml (detector entry), so numbers live in one place.
# Fields omitted here take defaults: priority from tier (Floor P0, Reflex P1, Finish P3), kind ban, check M, status active.

# ---------------- D03 slop detection ----------------
- {id: SLP-001, title: No eyebrow labels above headings, domain: D03, tier: Reflex, kind: cap, detector: eyebrow, remedy: fix-typeset, tests: [T-EYEBROW],
   rule: "Do not set a small tracked label directly above a heading unless it carries a fact, destination or identifier.",
   why: "Eyebrows are the most common machine default; they repeat the heading's job and flatten the hierarchy into a template.",
   fix: "Promote any fact into the heading or the line below it; delete the rest.", sources: ["hallmark §111 §369", "impeccable §519 §520", "kami §4", "huashu §59"]}
- {id: SLP-002, title: No decorative section numbering, domain: D03, tier: Reflex, kind: cap, detector: numbered_labels, remedy: fix-typeset,
   rule: "Do not number sections 01, 02, 03 unless the reader needs to refer to them by number.",
   why: "Numbered labels imply a sequence the content does not have and are a strong template tell.", fix: "Remove the numbers or make them real steps.",
   sources: ["impeccable §521", "huashu §59 §60", "hallmark §366"]}
- {id: SLP-003, title: No icon tiles above every card heading, domain: D03, tier: Reflex, kind: cap, detector: icon_tile, remedy: fix-quieter,
   rule: "Do not put a tinted square icon tile above each card heading as a repeated pattern.",
   why: "Generic icons in tiles add no information and make every card read the same.", fix: "Remove the tiles, or use a real image or figure that differs per card.",
   sources: ["impeccable §560", "ux-ui-agent-skills §28"]}
- {id: SLP-004, title: No side-tab accent borders on cards, domain: D03, tier: Reflex, detector: side_tab_border, remedy: fix-quieter,
   rule: "Do not mark cards with a thick coloured border on one side only.", why: "A stock emphasis device that signals generated UI.",
   fix: "Use grouping, a heading or one surface change instead.", sources: ["impeccable §552"]}
- {id: SLP-005, title: No uniform card kit, domain: D03, tier: Reflex, kind: cap, detector: card_kit, remedy: fix-layout,
   rule: "Do not apply the same radius and shadow recipe to every container, or hairline plus wide shadow to every card in a row.",
   why: "One box recipe everywhere erases hierarchy; the surface ladder (whitespace, hairline, tinted well, card) exists for a reason.",
   fix: "Remove boxes where whitespace groups; keep one card style for things that are objects.", sources: ["huashu §68", "impeccable §561", "hallmark §79"]}
- {id: SLP-006, title: Vary container recipes, domain: D03, tier: Reflex, kind: cap, detector: container_monotony, remedy: fix-layout,
   rule: "Do not reuse one container recipe across six or more distinct components.", why: "Container monotony is a template tell.",
   fix: "Differentiate by role: section, object, callout, well.", sources: ["hallmark §79"]}
- {id: SLP-007, title: No stock gradient pairs, domain: D03, tier: Reflex, detector: gradient, remedy: fix-colorize,
   rule: "Do not use purple-to-blue, purple-to-pink or cyan-to-violet gradients, more than 3 stops, or a hue span over 40 degrees.",
   why: "These pairs are the default 'AI' gradient and read as generated.", fix: "Use a flat fill or a single-hue ramp.", sources: ["hallmark §384 §408", "impeccable §527", "design-taste §5"]}
- {id: SLP-008, title: No glow halos or radial spotlights, domain: D03, tier: Reflex, detector: glow, remedy: fix-quieter,
   rule: "Do not add zero-offset coloured glows or radial spotlights behind content.", why: "Decorative glow is a dark-SaaS tell and lowers contrast.",
   fix: "Remove; use type size and spacing for emphasis.", sources: ["impeccable §533 §536", "hallmark §385"]}
- {id: SLP-009, title: No neon violet or cyan on headings, domain: D03, tier: Reflex, detector: neon_violet, remedy: fix-colorize,
   rule: "Do not colour headings or large text in saturated violet (oklch hue 265-330, chroma 0.12+) or neon cyan on dark (hue 170-230).", why: "The two most common model accent hues.",
   fix: "Derive the accent from brand, imagery or culture (Sample, Converge, Justify).", sources: ["impeccable §527 §529", "taste-skill §31", "huashu §211"]}
- {id: SLP-010, title: No template chrome glyphs, domain: D03, tier: Reflex, kind: cap, detector: chrome_glyphs, remedy: fix-copy,
   rule: "Do not decorate with middot chains, arrows glued to links, fake version strings, scroll cues or emoji bullets.",
   why: "Each is a template signature; together they make the page read as a theme demo.", fix: "Delete, or replace with real content.",
   sources: ["hallmark §125 §365 §366", "huashu §59 §60 §67", "taste-skill §22"]}
- {id: SLP-011, title: Do not repeat your own last looks, domain: D03, tier: Reflex, detector: distinctness, remedy: explore-directions, tests: [T-LOOK-LEDGER, T-FINGERPRINT],
   rule: "A new delivery must differ from the last 8 in the ledger: palette oklab distance at least 0.06, skeleton edge-map correlation at most 0.55.",
   why: "Slop is often only visible across outputs: each page fine, every page the same.", fix: "Change the accent, then the paper, then the face (escape order).",
   sources: ["huashu §69 §111", "hallmark §234 §519"]}
- {id: SLP-012, title: Look-family cluster, domain: D03, tier: Reflex, check: H, detector: look_family, remedy: fix-quieter,
   rule: "Flag a surface when enough tells of one AI-default look family cluster on it (data/look-families.yaml, profile cluster minimum).",
   why: "One tell is a choice; a cluster is a default nobody chose.", fix: "Break the family on its strongest tell first; name the replacement decision.",
   sources: ["huashu §58 §68", "hallmark §16 §386", "impeccable §200"]}

- {id: SLP-013, title: No emoji as icons, domain: D03, tier: Reflex, kind: cap, detector: emoji_icons, remedy: fix-quieter,
   rule: "Do not use emoji as feature icons, heading prefixes or button glyphs.", why: "Emoji icons are the fastest tell of a generated page and render differently on every platform.",
   fix: "Use a consistent icon set with labels, or no icon.", sources: ["hallmark slopped.html gate 30", "ui-ux-pro-max §46", "ux-ui-agent-skills emoji fixture"]}
- {id: SLP-015, title: No sparkle or wand as the sign for AI, domain: D03, tier: Reflex, detector: ai_sparkle, remedy: fix-quieter,
   rule: "Do not mark an AI feature with a sparkle, wand or stars glyph (lucide-sparkles, wand-sparkles, auto_awesome and the like). The product's own mark is fine even when it is a sparkle; waive with that reason.",
   why: "The sparkle is the generic shorthand for any AI feature, so it says nothing about this one and reads as a template.",
   fix: "Say what happens in a plain label (Summarize, Draft reply), or use the product's own mark.",
   sources: ["stageshow craft.md Icons and logos; teaching.md Style (AI shorthand)", "mined SLP-251"]}
- {id: SLP-016, title: No invented letter-tile logos, domain: D03, tier: Reflex, detector: invented_mark, remedy: fix-quieter,
   rule: "A real company named on the page is shown by its real mark or its plain name, never by a letter or glyph in a coloured square.",
   why: "A letter tile in a brand colour is the stock stand-in for a logo; beside a real company's name it reads as fake.",
   fix: "Use the company's real mark in its original proportions and colours, or a plain text wordmark.",
   sources: ["stageshow craft.md Icons and logos; scripts/film-checks.mjs detectInventedMark (MIT)", "mined SLP-252"]}
- {id: SLP-017, title: One icon construction per group, domain: D03, tier: Finish, detector: mixed_icons, remedy: fix-quieter,
   rule: "Within one nav, list or toolbar, icons share one set, one style and one stroke width: not two or more filled glyphs beside two or more outline glyphs. Filling one glyph to mark the selected state is fine.",
   why: "Glyphs of different constructions side by side are the first sign the icons were drawn or picked one at a time.",
   fix: "Take every glyph in the group from one set at one size and stroke; use fill only for state.",
   sources: ["stageshow craft.md Icons and logos (mixed icons)", "mined SLP-253"]}
- {id: SLP-014, title: No cards inside cards, domain: D03, tier: Reflex, detector: nested_cards, remedy: fix-layout,
   rule: "Do not put a bordered or shadowed card inside another card.", why: "Nested boxes add depth with no meaning and crowd the content.",
   fix: "Keep one container level; group inside it with spacing or a rule.", sources: ["hallmark slopped.html gate 4", "impeccable §561"]}

# ---------------- D02 concept (lens-concept; judgment cards, no detector) ----------------
# Promoted from the mined drafts in rules/D02-CON.yaml; each source cites the draft id and its original sections.
- {id: CON-001, title: The client's own system is the concept, domain: D02, tier: Reflex, kind: context, check: J, remedy: none, tests: [T-OWN-SYSTEM],
   rule: "When the artifact applies the client's own brand or design system consistently, judge it as a concept: score how well it uses that system for its job, and do not report its conventions as template. A direction the reviewer would not have chosen is not a finding.",
   why: "A locked system overrides every other choice; calling an intentional, conventional identity 'generic' punishes the client for being consistent.",
   fix: "None when the system holds. Where a section drops the system for a framework default, bring that section back into the system.",
   sources: ["CON-112 (HM §5, HU §5)", "CON-145 (HM §139-140)", "CON-163 (HM §157, HM §155)"]}
- {id: CON-002, title: Every large decision belongs to this client, domain: D02, tier: Reflex, check: J, remedy: explore-directions, tests: [T-RIVAL-NAME, T-MIRROR],
   rule: "Make the subject, place, materials, numbers and voice of every large decision belong to this client. Under a rival's name, no heading stays true; a neighbouring brief in the same category would not get this hero, nav, footer and first section.",
   why: "A page that would work for any competitor tells the visitor nothing about this one.",
   fix: "Replace each line that survives the swap with a noun only this client has; change the one shared decision the mirror test names.",
   sources: ["CON-133 (HM §14)", "CON-117 (HM §11)"]}
- {id: CON-003, title: The idea fits in one sentence, domain: D02, tier: Reflex, check: J, remedy: explore-directions, tests: [T-ONE-SENTENCE],
   rule: "State the design's idea in one sentence and its look as ground, ink, accent and faces, each with a source. If no sentence can be written, there is no concept.",
   values: {idea_sentences: 1},
   why: "Without a statable idea, every later choice is a default.",
   fix: "Write the sentence from the client's real material, then make the hero and first section say it.",
   sources: ["CON-122 (HM §15, HU §97)"]}
- {id: CON-004, title: One idea runs the whole artifact, domain: D02, tier: Reflex, check: J, remedy: explore-directions, tests: [T-IDEA-CARRIES],
   rule: "Let the one idea shape every screen, slide or page, top to bottom. An idea that stops at the hero is a template with a good hero.",
   why: "Visitors judge the page past the first screen; a strong hero over stock sections reads as a theme with a cover.",
   fix: "Carry the idea's material or device into the first two sections below the hero, or simplify the hero to match the rest.",
   sources: ["CON-121 (HM §15, HM §158)"]}
- {id: CON-005, title: One real signature on the first screen, domain: D02, tier: Reflex, check: J, remedy: explore-directions, tests: [T-SIGNATURE, T-DELETE-PICTURE],
   rule: "Give every artifact one signature: the brief's strongest real thing at its best, on the first screen. On an app screen it is the object the tool is known by (ledger, timeline, queue). A number drawn as marks, a greeting over four stat cards or a gradient garnish is not a signature.",
   values: {signatures: 1, where: first screen},
   why: "The first screen is where the visitor decides whether this is for them; a decorative stand-in gives them nothing to remember.",
   fix: "Lead with the client's own photograph, product, work or data at full size; remove the garnish.",
   sources: ["CON-118 (HM §13, HU §7)", "CON-119 (HM §13, HU §158)"]}
- {id: CON-006, title: Spend boldness in one place, domain: D02, tier: Finish, check: J, remedy: fix-quieter, tests: [T-BOLD-MOVE],
   rule: "Put one detail at 120% and keep the rest at 80%. Take one accessory off before shipping.",
   values: {bold_moves: 1},
   why: "Several loud moves cancel each other; none leaves the page forgettable.",
   fix: "Keep the move that carries the idea; quiet or remove the others. If there is none, enlarge the signature.",
   sources: ["CON-120 (HU §7, HU §181, TS §99)"]}
- {id: CON-007, title: The motif grows out of the subject, domain: D02, tier: Reflex, check: J, remedy: explore-directions, tests: [T-COVER-TEXT],
   rule: "The visual motif must be something only this subject has; the form should grow out of the content, and a reviewer should be able to say in one line where.",
   why: "A motif borrowed from the category or the look of the month could sit on any client's page.",
   fix: "Name the subject's own material (its objects, places, records, people) and derive the motif from it.",
   sources: ["CON-123 (HU §6, HU §52)"]}
- {id: CON-008, title: Refuse the default plan, domain: D02, tier: Reflex, kind: cap, check: J, remedy: fix-layout, tests: [T-DEFAULT-PLAN],
   rule: "Do not build from the default plan: split hero (head left, picture right), three numbered steps, label and value rows between hairlines, closing band with a form, dark footer under a huge wordmark, small grey labels, pale ground with one careful accent.",
   values: {budget: 1, template_at: 2},
   why: "Two of these in one plan means the plan is the template, however good the parts are.",
   fix: "Keep the one move that serves the job; replace the others with a shape the client's material suggests.",
   sources: ["CON-135 (HM §15)"]}
- {id: CON-009, title: No look picked for the category or by default, domain: D02, tier: Reflex, check: J, remedy: fix-colorize, tests: [T-MIRROR],
   rule: "Do not choose the spent looks (cream paper with a high-contrast serif and clay accent; near-black with one neon; pale ground with one timid accent; purple to blue) or a hue picked because of the category (blue software, green health) without a reason from the client.",
   why: "These looks are what any brief in the category gets; they signal that nobody chose.",
   fix: "Move one axis at a time: accent first, then paper, then display face, each from the client's own material.",
   sources: ["CON-136 (HM §16, HU §2, HU §58, HU §68)", "CON-137 (HM §16)"]}
- {id: CON-010, title: "The subject is known, not painted on", domain: D02, tier: Reflex, check: J, remedy: fix-quieter, tests: [T-REMOVE-DEVICE],
   rule: "Do not dress the page as its subject: paper and grain surfaces, stamps, dials and knobs as ornament, bevels, engravings or drawings of the thing in place of the thing.",
   why: "Costume shows the reviewer guessed at the subject instead of showing it.",
   fix: "Replace the ornament with the real object, place or record, photographed or shown as data.",
   sources: ["CON-141 (HM §16, HM §127)"]}
- {id: CON-011, title: No AI tech clichés, domain: D02, tier: Reflex, check: J, remedy: fix-quieter,
   rule: "Do not illustrate technology with gradient spheres, digital rain, circuit boards, robot faces, or the dark-code look (#0D1117 with a cyan or purple glow).",
   why: "These images say 'tech' about every tech company and nothing about this one.",
   fix: "Show the product working on a real task, or use an abstract form derived from what the product does.",
   sources: ["CON-142 (HU §60, HU §104, HU §215)"]}
- {id: CON-012, title: No forced big-idea metaphor, domain: D02, tier: Reflex, check: J, remedy: fix-distill, tests: [T-REMOVE-DEVICE],
   rule: "Do not force the content into a prop or universal metaphor (filing cabinet, library card, subway map, prescription slip, terminal, newspaper). Remove the device: if the information gets clearer, it was too much.",
   why: "A device that costs clarity serves the designer, not the reader.",
   fix: "Remove the device and keep only the parts of it that carry information.",
   sources: ["CON-144 (HU §42, HU §54)", "CON-126 (HU §54, HU §208, HU §69)"]}
- {id: CON-013, title: Material fits the business kind, domain: D02, tier: Reflex, kind: context, check: J, remedy: explore-directions, tests: [T-KIND-FIT],
   rule: "Classify the business kind and the visitor's job first. Reserve effects, scenes, loops, counters, shader grounds, dark pages and dark heroes for tech (software, gaming, hardware); build other kinds from photographs, flat colour, type and real icons.",
   why: "Tech effects on a bakery or a law firm borrow another kind's look and hide the real thing the visitor came to see.",
   fix: "Replace the effect with the client's own photographs or work; keep type and flat colour for the rest.",
   sources: ["CON-146 (TS §5, TS §7, TS §25)", "CON-101 (TS §5, UX §229, UX §454)", "CON-102 (HM §17, HM §203)"]}
- {id: CON-014, title: Software shows its own UI at work, domain: D02, tier: Reflex, kind: context, check: J, applies_when: [web, slides, social], remedy: explore-directions, tests: [T-KIND-FIT],
   rule: "For software, the lead picture is the client's own interface working on what it works on (a code review tool shows a diff with Accept), as a full app window in the hero or sections 2 to 3. Never a generic dashboard, fragments only, or product UI the firm does not run.",
   values: {where: "hero or sections 2-3", frame: full app window},
   why: "The product is the proof; a generic dashboard could be anyone's.",
   fix: "Capture the real product on a real task; [DATA NEEDED: product screenshot] if none was supplied.",
   sources: ["CON-147 (TS §19-20, TS §122, TS §588)"]}
- {id: CON-015, title: A product is shown big, domain: D02, tier: Reflex, kind: context, check: J, remedy: fix-layout, tests: [T-KIND-FIT, T-DELETE-PICTURE],
   rule: "On a product page, the product's long side fills 80 to 100% of its frame in the hero and at least one more section. Under 60% fails; 60 to 80% warns. Never mid-size in a grey rounded panel on grey.",
   values: {target_long_side_pct: 80, warn_below_pct: 80, fail_below_pct: 60, min_sections: 2},
   why: "People buy what they can see; a small product in a panel reads as a placeholder.",
   fix: "Crop the product photograph so its long side fills the frame; drop the panel.",
   sources: ["CON-149 (TS §16-17)"]}
- {id: CON-016, title: "Places lead with photographs, services show the work", domain: D02, tier: Reflex, kind: context, check: J, remedy: explore-directions, tests: [T-KIND-FIT],
   rule: "A place leads with a photograph whenever any frame fits, with the visit block on screen 2. A service shows the work, the team at work and the rooms; never stock handshakes, product UI the firm does not run, or invented client logos.",
   values: {place_visit_block_screen: 2},
   why: "Visitors to a place or a service decide on the real room and the real people; stand-ins remove the reason to choose this one.",
   fix: "Use the client's own photographs; where none exist, a labelled [DATA NEEDED: photograph of ...] slot, never stock.",
   sources: ["CON-150 (TS §10-11)", "CON-151 (TS §18)"]}
- {id: CON-017, title: Every headline promise is pictured, domain: D02, tier: Finish, check: J, remedy: fix-copy, tests: [T-PROMISE-PICTURED],
   rule: "Picture every concrete headline promise ('takes four crates' shows four crates). Otherwise add the picture or cut the promise.",
   why: "An unshown promise reads as a claim; a shown one reads as a fact.",
   fix: "Add the picture that proves the line, or rewrite the line to what the page can show.",
   sources: ["CON-153 (TS §16-17)"]}
- {id: CON-018, title: App screens disappear into the task, domain: D02, tier: Reflex, kind: context, check: J, applies_when: [app, web], remedy: fix-layout,
   rule: "On a screen someone works in, marketing rules step aside: no hero, fold, word budget, section rhythm or reveal on load. The direction lends palette, faces, radius and surfaces, never layout or navigation, and the concept is the object the tool is known by.",
   why: "Marketing devices on a work screen slow the task they are meant to sell.",
   fix: "Remove the marketing device and give its space to the working object.",
   sources: ["CON-157 (HM §143, HM §159)", "CON-106 (HM §9, HM §142)"]}
- {id: CON-019, title: Concept veto, domain: D02, tier: Reflex, kind: context, check: J, remedy: explore-directions, tests: [T-RIVAL-NAME, T-ONE-SENTENCE],
   rule: "Score Concept first. Specificity 5 of 5 means it could belong to no other product; 3 means it fits the category. If Concept is 5 or below out of 10, cap the overall score at 6 and fix the concept before execution details.",
   values: {concept_veto_at: 5, overall_cap: 6},
   why: "Polish on a template still ships a template; execution findings come after the concept holds.",
   fix: "Rework the idea (explore-directions) before the remedy queue spends effort on details.",
   sources: ["CON-158 (HU §97, HU §105)", "CON-160 (HM §151)"]}

# ---------------- D06 colour ----------------
- {id: CLR-001, title: Accent footprint within budget, domain: D06, tier: Reflex, kind: cap, detector: accent_footprint, remedy: fix-colorize,
   rule: "At the 1280x800 fold, solid accent area must stay under 5% (warn) and never exceed 8%.", why: "An accent sprayed everywhere stops pointing at anything.",
   fix: "Keep accent on the primary action, current state and one focal element.", sources: ["hallmark §67 §410", "kami §14", "taste-skill §31"]}
- {id: CLR-002, title: No stock framework swatches as brand tokens, domain: D06, tier: Reflex, detector: stock_swatches, remedy: fix-colorize,
   rule: "Do not use Tailwind or Bootstrap default colours, or #6366F1, as the artifact's own tokens.", why: "A framework default is not a brand.",
   fix: "Derive tokens from the brand source; tint neutrals toward the brand hue.", sources: ["hallmark §371 §408", "kami §688", "huashu §213"]}

# ---------------- D06 colour (lens-color; judgment and hybrid cards, no detector) ----------------
# Promoted from the mined drafts in rules/D06-CLR.yaml; each source cites the draft id and its original sections
# (HM hallmark, HS huashu, KM kami, TS taste-skill, UU ui-ux-pro-max).
# Colour findings are Reflex or Finish. CLR-016 and CLR-017 are Reflex although their drafts (CLR-150, CLR-153, CLR-180) say
# Floor: a muddy dark theme or a dark card reads worse but stays usable. Contrast floors stay with A11-001 (contrast) and
# A11-003 (focus_ring); gradients, glows and violet headings stay with SLP-007 to SLP-009; nested cards with SLP-014.
- {id: CLR-003, title: Colour has a source, domain: D06, tier: Reflex, check: J, remedy: fix-colorize, waivable_by: brand-system, tests: [T-COLOUR-SOURCE],
   rule: "Take every primary colour from the brand or its design system, the content's own imagery, or the culture of the subject, and be able to say why in one sentence. A framework default, a model favourite (#0066FF tech blue, #D97757 terracotta, #0D1117 with neon, violet at oklch hue 275 to 330) or a look family's palette is not a source. A brand's own colour is a source even when it resembles one of these.",
   why: "Colour is the fastest signal of who made a page; a default palette says the generator chose it, not the client.",
   fix: "Use the brand's colours. With none, sample from the client's photographs or product, converge to a few, and write the one-sentence reason next to the tokens.",
   sources: ["CLR-102 (HS §62 §211, HM §134)", "CLR-116 (HM §137)", "CLR-113 (HS §60 §213 §58)", "CLR-114 (TS §31 §250)"]}
- {id: CLR-004, title: The palette converges to a few roles, domain: D06, tier: Reflex, kind: cap, check: H, remedy: fix-colorize, tests: [T-PALETTE-ROLES],
   rule: "Use 2 to 3 chromatic colours plus one neutral set, each in one role (ground, surface, ink, text level, accent, state, data). Chromatic colours sit at least 60 degrees of hue or 0.3 of lightness apart. Use one accent across the artifact; a second accent needs a declared full-palette posture. Each accent comes with its paired ink for text on it.",
   values: {max_chromatic: 3, min_hue_sep_deg: 60, min_lightness_sep: 0.3, accents: 1},
   why: "A colour in several roles, or two accents that compete, leaves the reader no way to learn what colour means on this page.",
   fix: "List each colour's role, merge near neighbours, and drop or demote the second accent.",
   sources: ["CLR-103 (HS §211)", "CLR-110 (TS §31, HM §68, HS §331, KM §10)", "CLR-109 (HM §65, KM §22, TS §61)"]}
- {id: CLR-005, title: Colour follows one posture, domain: D06, tier: Reflex, kind: context, check: H, remedy: fix-colorize, waivable_by: brand-system, tests: [T-ACCENT-DOSAGE],
   rule: "Hold one colour posture across the artifact: restrained (neutral page, accent as signal), committed (one colour fills 30 to 60% through a field or paper), full palette (3 to 4 named roles) or drenched (the surface is the colour). Under a restrained posture, do not paint a page-scale surface in the accent: the body, a section, header, footer, hero or band, anything 320px or 40% of the viewport tall, or a full overlay. Tints under 0.3 alpha are not a surface.",
   values: {committed_share_pct: [30, 60], full_palette_roles: [3, 4], page_scale_min_px: 320, page_scale_min_vh: 0.4, max_tint_alpha: 0.3},
   why: "A restrained page that suddenly floods one band with its accent reads as two templates joined, and the accent stops pointing at anything.",
   fix: "Name the posture. Under restrained, move the band to a stepped neutral ground and keep the accent on the action inside it.",
   sources: ["CLR-124 (HM §68)", "CLR-127 (HM §410)"]}
- {id: CLR-006, title: The accent marks action and state, domain: D06, tier: Reflex, kind: cap, check: H, remedy: fix-colorize, tests: [T-ACCENT-DOSAGE],
   rule: "Under a restrained posture, keep the interface 90 to 95% neutral and put the accent only on the primary action, the active nav item, the focus ring, link hover, the current state and one argued focal element or chart series. Colour beyond that comes from photographs, the product and real logos. The sweep measures the fold footprint (CLR-001); this card judges where the accent sits.",
   values: {neutral_share_pct: [90, 95]},
   why: "An accent on icons, labels, borders and headings at once stops marking the one thing to do.",
   fix: "Remove the accent from decoration and labels; keep it on the action and the current state.",
   sources: ["CLR-126 (HM §67 §144)", "CLR-125 (HM §67 §410, KM §11 §181, TS §61)", "CLR-118 (TS §61)"]}
- {id: CLR-007, title: Display type is set in ink, domain: D06, tier: Reflex, check: H, remedy: fix-colorize, waivable_by: brand-system, tests: [T-ACCENT-DOSAGE],
   rule: "Set text of 48px and up in the ink colour, not the accent. A heading coloured by a brand system that does so everywhere is the brand's choice; one accent heading among ink headings is the finding.",
   values: {min_px: 48},
   why: "A large accent headline spends the whole accent budget on words the reader would read anyway, and the action loses its colour.",
   fix: "Set display type in ink and keep the accent for the action under it.",
   sources: ["CLR-128 (HM §410)"]}
- {id: CLR-008, title: Neutrals hold one temperature, domain: D06, tier: Finish, check: H, remedy: fix-colorize, tests: [T-NEUTRALS],
   rule: "Keep every neutral (paper, surfaces, text greys, hairlines) at one temperature that agrees with the ground, and lean it toward the anchor hue at oklch chroma 0.005 to 0.018. A cool accent does not license cool surfaces on a warm page; stock cool greys on a warm system fail. Untinted greys on an untinted, modern-minimal system are not a finding.",
   values: {neutral_chroma: [0.005, 0.018]},
   why: "Warm paper with cool stock greys looks assembled from two kits; the greys go dirty against the ground.",
   fix: "Re-derive the greys from the ground's hue; replace stock greys with tinted steps.",
   sources: ["CLR-106 (HM §65 §409 §486, HS §329)", "CLR-107 (KM §14, UU §296)", "CLR-108 (KM §23)", "CLR-148 (KM §12)"]}
- {id: CLR-009, title: Pure black and white are documented choices, domain: D06, tier: Finish, kind: context, check: H, remedy: fix-colorize, waivable_by: brand-system, tests: [T-NEUTRALS],
   rule: "Do not use #000 or #fff as the page ground or the main ink unless the system documents it (an OLED dark theme, a modern-minimal white paper, a brand that specifies them). Otherwise tint them toward the anchor hue (chroma at least 0.005). Conflict C09: flag only when undocumented.",
   values: {min_chroma: 0.005},
   why: "Untinted extremes give the harshest contrast step on screen and read as nobody chose a paper.",
   fix: "Replace with a near-white paper and a near-black ink tinted toward the brand hue.",
   sources: ["CLR-147 (HM §66 §408, HS §329, TS §61, KM §12, UU §296)"]}
- {id: CLR-010, title: Text greys are a fixed set, domain: D06, tier: Finish, kind: cap, check: H, remedy: fix-colorize, tests: [T-PALETTE-ROLES],
   rule: "Keep text to a declared set of levels (ink, secondary, muted, disabled): at most 4 greys on one ground. Do not create a fifth for one component, and never set copy lighter than the last text step.",
   values: {max_text_levels: 4},
   why: "Greys that differ by a few points look like mistakes, and the reader cannot tell which text matters less.",
   fix: "Map every text grey to the nearest declared level and delete the rest.",
   sources: ["CLR-149 (KM §13)"]}
- {id: CLR-011, title: Text on colour uses that colour's ink, domain: D06, tier: Reflex, check: H, remedy: fix-colorize, tests: [T-PALETTE-ROLES],
   rule: "Text on a coloured fill uses the fill's paired on-colour, chosen by luminance (ink or paper), never the page's grey. Swap the text colour in the same rule that paints a dark or coloured surface. Contrast failures are A11-001's; this card covers grey text that passes contrast and still looks dirty.",
   why: "A neutral grey on a saturated fill reads as a mistake even when it passes contrast, and it fails the moment the fill changes.",
   fix: "Give each fill token an on-colour token and use it for all text on that fill.",
   sources: ["CLR-138 (HM §69 §412)", "CLR-135 (HM §69 §412, UU §313 §667, KM §22, TS §61)"]}
- {id: CLR-012, title: Grounds are few and stepped, domain: D06, tier: Reflex, kind: cap, check: H, remedy: fix-colorize, tests: [T-PALETTE-ROLES, T-SURFACE-LADDER],
   rule: "Use at most 3 ground tokens per page (main, alternate, dark); a deck uses at most 2. Wells and bands step the paper by about 3 to 4% lightness, not by a new hue.",
   values: {max_grounds: 3, max_grounds_deck: 2, step_lightness: [0.03, 0.04]},
   why: "Each new ground restarts the page; five section colours make it read as five pages stacked.",
   fix: "Collapse grounds to main, alternate and dark; make wells a lightness step of the main paper.",
   sources: ["CLR-131 (TS §61, HS §73 §144)", "CLR-185 (HM §495 §300)"]}
- {id: CLR-013, title: Depth comes from lightness and one shadow, domain: D06, tier: Reflex, kind: cap, check: H, remedy: fix-quieter, tests: [T-SURFACE-LADDER],
   rule: "Get depth from lightness steps and neutral shadows with real offset, tinted from the ink. Use one resting shadow recipe and one for things that float (popovers, dialogs, real screenshots); never a heavy black shadow (rgba(0,0,0) at 0.25 alpha or more). Do not use a shadow to make an ordinary card important. Whether cards carry a shadow at all is the system's choice (conflict C43).",
   values: {resting_recipes: 1, floating_recipes: 1, heavy_black_alpha: 0.25},
   why: "Many shadow recipes, or a black blur under every card, make the page look like a kit of stacked tiles with no light source.",
   fix: "Collapse shadows to one resting and one floating token tinted from the ink; remove shadows from cards that do not float.",
   sources: ["CLR-173 (HM §70 §373)", "CLR-175 (HM §76 §488, KM §75)", "CLR-176 (HM §498, KM §75)", "CLR-179 (KM §75, TS §216 §1485)"]}
- {id: CLR-014, title: A card has a border or a shadow, domain: D06, tier: Finish, check: H, remedy: fix-quieter, tests: [T-SURFACE-LADDER],
   rule: "Edge a card with a border or with a shadow, not both. Never stack fill, border, radius and shadow on one component. A hairline plus a wide soft shadow on every card in a row is SLP-005's; this card covers single components (conflict C43).",
   why: "Two edge treatments on one box double its weight and blur where it ends.",
   fix: "Keep the border on flat surfaces and the shadow on floating ones; drop the other.",
   sources: ["CLR-178 (HM §74, KM §74 §75)", "CLR-177 (HM §76 §378)"]}
- {id: CLR-015, title: Regions use the lowest rung of the surface ladder, domain: D06, tier: Reflex, check: H, remedy: fix-layout, tests: [T-SURFACE-LADDER, T-LINE-DELETION],
   rule: "Separate regions with the lowest rung that works: whitespace, then a 1px hairline, then a tinted well with no border, then a card. Do not put white cards on a tinted page or a bordered box in a well. Use one divider language, and do not rule the top and bottom of every row in a long list. A line exists only to separate regions, encode state or carry data. Cards inside cards are SLP-014's.",
   why: "Boxes and rules where space would do make every region shout at the same level and bury the content in chrome.",
   fix: "Delete the rule or box and restore the pause with spacing; where a group needs more, use a tinted well.",
   sources: ["CLR-184 (HM §74 §385)", "CLR-186 (HM §74 §375, TS §32 §53 §94)", "CLR-187 (KM §73)", "CLR-189 (HM §74, TS §29)"]}
- {id: CLR-016, title: "Dark mode is derived, not inverted", domain: D06, tier: Reflex, kind: context, check: H, remedy: fix-colorize, tests: [T-DARK-MODE],
   rule: "When the artifact is dark or ships a dark theme, derive it by recipe: paper at oklch L 0.12 to 0.18 tinted toward the anchor (not #000 unless true OLED), ink at L 0.92 to 0.96 (not #fff), the accent re-derived (chroma down 0.02 to 0.04, lightness up 0.05 to 0.10, hue unchanged), drop shadows replaced by lightness steps or an inset hairline, and color-scheme declared. Never use filter: invert() or flipped light greys, and never invert raster images.",
   values: {paper_l: [0.12, 0.18], ink_l: [0.92, 0.96], accent_chroma_shift: [-0.04, -0.02], accent_l_shift: [0.05, 0.10]},
   why: "Light-theme values flipped to dark glare, vibrate and lose their depth cues.",
   fix: "Give dark its own paper, ink, accent and elevation tokens; remove invert filters.",
   sources: ["CLR-150 (HM §71 §299, HS §62, UU §149 §236 §242)", "CLR-152 (HM §300 §303, UU §360)", "CLR-154 (HM §300 §299)", "CLR-158 (HM §302)", "CLR-160 (HM §302)", "CLR-163 (HM §301, UU §371)"]}
- {id: CLR-017, title: Elevation gets lighter on dark, domain: D06, tier: Reflex, kind: context, check: H, remedy: fix-colorize, tests: [T-DARK-MODE, T-SURFACE-LADDER],
   rule: "On a dark ground, raised surfaces (cards, popovers, dialogs, menus) are lighter than the canvas, about 0.03 oklch lightness per level. An elevated surface is never darker than the canvas it sits on.",
   values: {step_l: 0.03},
   why: "On dark, light is what reads as nearer; a card darker than its page reads as a hole.",
   fix: "Step elevated surfaces up in lightness from the canvas.",
   sources: ["CLR-153 (HM §300 §302 §76)", "CLR-180 (HM §76 §302)"]}
- {id: CLR-018, title: Glass only on navigation and controls, domain: D06, tier: Reflex, kind: context, check: H, remedy: fix-quieter, waivable_by: brand-system, tests: [T-SURFACE-LADDER],
   rule: "Do not use glass panels (backdrop blur over translucent near-white or near-black) by default. Where a system style asks for glass, keep it to navigation and controls with a restrained recipe (blur 10 to 20px) and an opaque fallback under prefers-reduced-transparency (conflict C25). Text contrast on glass is A11-001's.",
   values: {blur_px: [10, 20]},
   why: "Frosted cards over decorative blobs are a generator default, and the text on them changes contrast with whatever scrolls behind.",
   fix: "Make content panels opaque; keep glass, if the system wants it, on the nav bar.",
   sources: ["CLR-172 (HM §373, UU §359 §367 §448, HS §79, TS §32)"]}
- {id: CLR-019, title: "No gradient text, orbs or washes", domain: D06, tier: Reflex, check: H, remedy: fix-quieter, waivable_by: brand-system, tests: [T-COLOUR-SOURCE],
   rule: "Do not clip a gradient to text unless it is a single-hue token ramp (stops within 40 degrees) that still passes contrast. Do not put aurora or mesh blobs behind text, floating blurred orbs (a positioned pseudo-element blurred past 40px), or chromatic halos. Check the renders: orbs drawn by pseudo-elements and images are invisible to the sweep's gradient and glow detectors (SLP-007, SLP-008), whose hits are cited, not repeated.",
   values: {max_text_gradient_hue_deg: 40, orb_blur_px: 40},
   why: "Gradient headlines and blurred colour blobs are the stock 'AI product' garnish; they decorate instead of saying anything.",
   fix: "Set the headline in ink; replace washes with a flat ground or the client's own image.",
   sources: ["CLR-170 (HM §70 §372)", "CLR-171 (HM §70 §373, HS §60)"]}
- {id: CLR-020, title: State colours keep their meaning, domain: D06, tier: Reflex, check: H, remedy: fix-colorize, tests: [T-PALETTE-ROLES],
   rule: "Keep the destructive and error colour for delete and error, and the success and warning colours for their states; never reuse one as the brand accent or decoration. Status shown in red and green needs a second encoding (conflict C05); colour as the only signal is an accessibility finding.",
   why: "When the brand red is also the error red, the reader cannot tell an alert from a button.",
   fix: "Separate the accent hue from the state hues, or re-derive the state colours away from the accent.",
   sources: ["CLR-130 (UU §666)"]}
- {id: CLR-021, title: The browser's own parts use the palette, domain: D06, tier: Finish, check: H, remedy: fix-colorize, tests: [T-PALETTE-ROLES],
   rule: "Theme the parts the page did not draw from the palette: ::selection, caret-color, scrollbar-color, accent-color on native controls, link underlines and the focus ring colour.",
   why: "A default blue selection or checkbox on a warm, chosen palette shows where the system stopped.",
   fix: "Set selection, caret, scrollbar and accent-color from the palette tokens.",
   sources: ["CLR-206 (HM §72 §414)"]}

# ---------------- D05 typography ----------------
- {id: TYP-001, title: Clear type hierarchy, domain: D05, tier: Reflex, detector: flat_hierarchy, remedy: fix-typeset,
   rule: "Adjacent type roles must differ by at least 1.25x in size (or a clear weight step) when three or more roles are in use.",
   why: "Sizes that are nearly equal make everything read at one level.", fix: "Adopt a scale (1.25 to 1.5) and assign roles to steps.", sources: ["impeccable §513", "huashu §104"]}
- {id: TYP-002, title: "Sizes on a declared ladder, families limited", domain: D05, tier: Reflex, detector: type_ladder, remedy: fix-typeset,
   rule: "Every font size is a declared step; use at most 3 families (warn) and never 4.", why: "Drifting sizes and extra families are craft errors that read as unplanned.",
   fix: "Collapse sizes to the scale; drop the extra family.", sources: ["kami §35", "hallmark §56", "huashu §104"]}
- {id: TYP-003, title: No UI text faces as display type, domain: D05, tier: Reflex, detector: banned_fonts, remedy: fix-typeset,
   rule: "Do not set display type (32px and up, or h1-h2) in a UI text face (Inter, Roboto, system-ui and similar). Saturated faces need an argument in the contract.",
   why: "UI faces at display size are the model's default headline.", fix: "Pick a display face for the brief; see substitutes in data/lexicons/fonts.yaml.",
   sources: ["hallmark §291 §390", "huashu §61 §125", "taste-skill §30"]}
- {id: TYP-004, title: The intended font actually renders, domain: D05, tier: Floor, detector: fallback_face, remedy: fix-typeset, waivable_by: never,
   rule: "The face that draws the text must be the declared face, not a fallback.", why: "A silent fallback changes metrics, layout and voice.",
   fix: "Fix the font load (path, format, font-display) and wait for fonts before capture.", sources: ["kami §189 §624 §629", "hallmark §462"]}

# ---------------- D05 typography (lens-typography; judgment and hybrid cards, no detector) ----------------
# Promoted from the mined drafts in rules/D05-TYP.yaml; each source cites the draft id and its original sections
# (HM hallmark, HS huashu, KM kami, TS taste-skill, UU ui-ux-pro-max, AS agent-skills).
# TYP-012 and TYP-014 are Reflex although their drafts (TYP-156, TYP-168, TYP-169) say Floor: tight leading and long lines
# slow reading but do not stop it (WCAG's 80-character line is AAA, 1.4.8). Only collisions and clipping (TYP-022) are Floor.
# Size floors stay with A11-002 (text_floor) and widows with ROB-004; these cards do not repeat them.
- {id: TYP-005, title: Type is chosen for this brief, domain: D05, tier: Reflex, check: J, remedy: fix-typeset, waivable_by: brand-system, tests: [T-TYPE-SOURCE],
   rule: "Choose type from the content, the language mix and the voice, and pick names last. The brand's or client's own faces come first and override every pairing rule. A default stack (one UI sans for every role, a framework default, the pairing any neighbouring brief would get) is a finding unless the brief or the brand chose it.",
   why: "Type is the first place a brand's voice shows; a default stack makes the artifact sound like every other one.",
   fix: "Use the brand's faces. With none, choose a display face for the content and the voice, and set the real headline in two or three candidates before deciding.",
   sources: ["TYP-110 (HS §117)", "TYP-120 (HS §117, HM §137)", "TYP-104 (HS §125 §138, HM §291)", "TYP-111 (HM §290)"]}
- {id: TYP-006, title: Each face has one job, domain: D05, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-FACE-ROLES],
   rule: "Use a display face and a body face (one family may do both). A third face is an outlier with exactly one role: the wordmark, a headline figure, or code. A face that appears in several unrelated roles, or two faces that share one role, is drift. One family at several weights counts as one face.",
   values: {faces: 2, outliers: 1},
   why: "When faces swap roles between sections, the reader cannot learn what each face signals.",
   fix: "Give each face one role and move stray elements onto it; drop a face that has no role of its own.",
   sources: ["TYP-101 (HM §52 §290 §391, TS §57, HS §126)", "TYP-102 (HM §52, TS §57)", "TYP-114 (HM §64 §296)"]}
- {id: TYP-007, title: Saturated faces need an argument, domain: D05, tier: Reflex, kind: context, check: H, remedy: fix-typeset, waivable_by: brand-system, tests: [T-TYPE-SOURCE],
   rule: "A saturated face (the saturated group in data/lexicons/fonts.yaml, such as Playfair Display, Fraunces, Instrument Serif, Space Grotesk or Geist) needs an argument from the contract, the brand system or the content. Without one, it is a finding when it sets the whole display system or joins a look-family cluster. The face alone is not a finding (conflict C33).",
   why: "These are the faces generators reach for when asked for taste; without a reason they read as the generator's choice, not the client's.",
   fix: "Keep the face if the brand chose it; otherwise try a same-build substitute from data/lexicons/fonts.yaml.",
   sources: ["TYP-106 (HM §292, HS §124 §125)", "TYP-105 (HM §291, TS §30, HS §61)", "TYP-107 (HS §125)"]}
- {id: TYP-008, title: Monospace only for code and figures, domain: D05, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-FACE-ROLES, T-LABEL-TRANSFORM],
   rule: "Set monospace only for code, figures, measurements, times, prices and versions, or where mono is the declared material of a technical brand. Never set a body paragraph in mono. Mono on labels, captions, meta and table heads is costume when 4 or more small labels use it.",
   values: {min_mono_labels: 4, label_max_px: 14},
   why: "Mono lines run about 30% longer and read slower; as label dressing it signals 'technical' with nothing technical behind it.",
   fix: "Set body and labels in the body face; keep mono for code and for figures that align.",
   sources: ["TYP-116 (HS §124, HM §61)", "TYP-117 (HM §61 §396 §298, HS §59 §60, TS §30)"]}
- {id: TYP-009, title: The scale fits the medium, domain: D05, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-LADDER],
   rule: "Derive sizes from one ratio taken from the body size and fitted to the medium: about 1.2 for dense UI and docs, 1.25 for general web, 1.333 for editorial, 1.5 for posters and slides. App screens use a fixed scale of 1.125 to 1.2 with no fluid headings. From 1024px wide, adjacent heading levels differ by at least 1.3x (1.2x below).",
   values: {ratio_dense: 1.2, ratio_web: 1.25, ratio_editorial: 1.333, ratio_poster: 1.5, app_ratio: [1.125, 1.2], min_heading_step: 1.3, min_heading_step_narrow: 1.2},
   why: "A marketing scale on a tool shouts over the work; a tool's scale on a landing page gives the eye no place to start.",
   fix: "Pick the medium's ratio, give each role a step, and collapse the sizes between steps.",
   sources: ["TYP-121 (HS §118, HM §54, UU §90 §297)", "TYP-122 (HM §54 §348)", "TYP-125 (TS §59, HM §170)"]}
- {id: TYP-010, title: One size per kind of element, domain: D05, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-LADDER],
   rule: "Give each kind of element one size and weight across the artifact: every card title, price, caption and figure the same. Every size is a declared step; neighbours such as 12.5, 13.5 and 14.5px are drift.",
   why: "When one kind of element changes size between sections, the reader looks for a meaning that is not there.",
   fix: "List the sizes per kind of element and collapse each kind to one step.",
   sources: ["TYP-132 (TS §59)", "TYP-123 (KM §35, UU §90)"]}
- {id: TYP-011, title: Headlines fit their length, domain: D05, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-HEADLINE-FIT],
   rule: "Size a headline to its length: up to 20 characters may take full display size, 21 to 50 display, 51 to 90 small display or a split, and over 90 needs rewriting. Headings hold to two lines and the hero h1 to three, at every width. A figure never outgrows the h1 or h2 it serves, and a heading is never smaller than the text under it.",
   values: {full_display_chars: 20, display_chars: 50, small_display_chars: 90, max_heading_lines: 2, max_h1_lines: 3, max_figure_to_h2: 1.08},
   why: "A long line at display size becomes a wall of large type; a figure bigger than its heading takes the heading's place.",
   fix: "Shorten the line or step the size down; move the detail into the line under it.",
   sources: ["TYP-129 (HM §56)", "TYP-130 (TS §30 §59)", "TYP-131 (TS §59)"]}
- {id: TYP-012, title: Running text is led for reading, domain: D05, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-LEADING],
   rule: "Lead running text from its computed line-height: 1.5 to 1.65 on UI and web text, 1.65 to 1.75 on long prose, 1.5 to 1.55 in print (never 1.6 or more on print body). Lines under 30 characters may sit at 1.4 to 1.5. Multi-line prose is never under 1.3.",
   values: {ui: [1.5, 1.65], prose: [1.65, 1.75], print: [1.5, 1.55], short_lines: [1.4, 1.5], floor: 1.3},
   why: "Tight leading makes the eye lose the next line; loose leading breaks a paragraph into separate strips.",
   fix: "Set a unitless line-height per role on the type tokens.",
   sources: ["TYP-155 (HM §59, UU §88 §236 §298, HS §77, TS §60)", "TYP-156 (HM §59 §398)", "TYP-159 (HS §121, KM §40)", "TYP-160 (KM §39 §40 §179)"]}
- {id: TYP-013, title: Display type is set tight, domain: D05, tier: Finish, check: H, remedy: fix-typeset, tests: [T-LEADING],
   rule: "Lead display type (32px and up) at 1.0 to 1.15, tighter as it grows; 1.2 or 'normal' on a large heading reads as inherited. Track regular-width Latin display at -0.02 to -0.04em (condensed or heavy faces 0 to -0.015em). Never add positive tracking to a Latin heading, and letters never touch. Carry display with size and tight setting, not with bold-and-big.",
   values: {display_min_px: 32, leading: [1.0, 1.15], tracking_em: [-0.04, -0.02], tracking_condensed_em: [-0.015, 0]},
   why: "Body settings scaled up to display size leave loose gaps between lines and letters that the eye reads as unset type.",
   fix: "Give display roles their own line-height and letter-spacing tokens.",
   sources: ["TYP-157 (HM §55 §496, HS §121)", "TYP-163 (HM §55 §496, TS §58 §210, HS §133 §138)", "TYP-152 (TS §58 §210)"]}
- {id: TYP-014, title: Prose has a readable measure, domain: D05, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-MEASURE],
   rule: "Cap running prose at 45 to 75 characters per line (65ch by default) on the text element. Lines averaging 88 or more characters over 3 or more lines fail. Never squeeze a block under 16 characters a line over 4 or more lines; short ledes and captions under 200 characters may sit from 28 characters.",
   values: {range: [45, 75], fail_cpl: 88, fail_min_lines: 3, sliver_cpl: 16, sliver_min_lines: 4},
   why: "On long lines the eye loses its place on the way back; in slivers every phrase breaks.",
   fix: "Set max-width in ch on the paragraph, not on the wrapper.",
   sources: ["TYP-168 (HM §59 §397, UU §89 §298, HS §120, KM §45, TS §59)", "TYP-169 (HM §397)", "TYP-170 (HM §397)"]}
- {id: TYP-015, title: Small labels earn their caps, domain: D05, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-LABEL-TRANSFORM],
   rule: "Text at 15px and under in uppercase, small caps or tracked past 0.03em (labels, captions, table heads, nav, tags, meta, bylines) must pass the label transform-delete test: without the caps and tracking it reads worse. When caps stay, track them lightly (conflict C19). Wordmarks, tickers and 2 to 5 letter acronyms are exempt. Running text is never set in caps.",
   values: {max_px: 15, max_tracking_em: 0.03},
   why: "Tracked caps on every small label is the generator's sign for 'designed'; it slows reading and says nothing the body face a step smaller would not.",
   fix: "Set labels in the body face a step smaller, in sentence case, untracked.",
   sources: ["TYP-165 (HM §60 §395 §298, TS §30, HS §59)", "TYP-188 (HM §60 §395)", "TYP-179 (HM §59, UU §298)"]}
- {id: TYP-016, title: Headings are set in one voice, domain: D05, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-HEAD-TREATMENT],
   rule: "Do not set one word of a heading apart by colour, italic, weight, underline, stroke or highlight. Get stress from a line break or a second line at a second size. The one exception is a declared theme signature, used once, in the hero only, in a true italic.",
   why: "The accent word is the most common generated headline treatment; it shouts one word and turns the rest into filler.",
   fix: "Set the heading in one weight, one style and one colour; move the stress to a line break.",
   sources: ["TYP-182 (HM §57 §370 §393, HS §59 §60)", "TYP-183 (HM §57 §298)", "TYP-153 (HM §57 §370)", "TYP-184 (HM §57 §393)"]}
- {id: TYP-017, title: Figures that compare are tabular, domain: D05, tier: Finish, check: H, remedy: fix-typeset, tests: [T-FIGURES],
   rule: "Where numbers compare (tables, prices, stats, axes, counts, display figures 24px and up), use tabular lining figures (font-variant-numeric: tabular-nums lining-nums). When the display face has only oldstyle figures, set the figures in the body face.",
   why: "Proportional or oldstyle digits make columns wobble and totals hard to compare.",
   fix: "Add tabular-nums to the number roles, or move figures to a face that has tabular lining digits.",
   sources: ["TYP-189 (HM §63 §298 §402 §307, HS §129 §138, KM §58 §190)", "TYP-190 (KM §58 §190)", "TYP-192 (HM §294)"]}
- {id: TYP-018, title: Punctuation is typeset and consistent, domain: D05, tier: Finish, check: H, remedy: fix-copy, tests: [T-PUNCTUATION],
   rule: "Use one quote and apostrophe style throughout; a page that mixes straight and curly marks is the finding (conflict C32). Use a true ellipsis, not three dots. Keep a number with its unit on one line with a non-breaking space.",
   why: "Mixed quotes and split units read as text pasted together from several places.",
   fix: "Normalise quotes at the content source; join numbers and units with a non-breaking space.",
   sources: ["TYP-193 (HM §63 §403, AS §155, TS §60)", "TYP-194 (HM §63, TS §60, AS §150 §151)"]}
- {id: TYP-019, title: Lines break where the sense breaks, domain: D05, tier: Finish, check: H, remedy: fix-typeset, tests: [T-HEADLINE-FIT],
   rule: "Balance headings (text-wrap: balance on h1, h2 and display lines of up to 4 lines) and let Latin body wrap pretty; not on CJK body (conflict C26). Manual line breaks fall between phrases and are checked at 375. A button label or primary nav link never wraps.",
   why: "A heading split mid-phrase or a two-line button shows a layout nobody checked at this width.",
   fix: "Add text-wrap: balance to heading roles, move or remove the manual break, and shorten the label rather than let it wrap.",
   sources: ["TYP-172 (HM §58 §400, HS §79 §122, UU §94)", "TYP-174 (HM §56 §401, UU §94)", "TYP-176 (HM §407)"]}
- {id: TYP-020, title: Weight steps are clear, domain: D05, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-LADDER],
   rule: "Build hierarchy from size, weight and space. Where weight alone separates two roles, take a clear step (400 to 700, or 300 to 800), not 500 to 600; when a step is unclear, widen the gap or skip a weight rather than add an in-between size. There is no weight-count rule (conflict C08). No weight under 400 below 20px.",
   values: {light_max_px: 20, min_weight_small: 400},
   why: "Neighbouring weights look like a rendering accident; light weights at small sizes break up on screen.",
   fix: "Move the two roles to weights far enough apart to see, or separate them by size.",
   sources: ["TYP-133 (KM §47, UU §93)", "TYP-149 (HM §53 §392)", "TYP-148 (TS §58, UU §298)"]}
- {id: TYP-021, title: Display-only faces stay at display size, domain: D05, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-FACE-ROLES],
   rule: "Use display-only faces (single-weight, hairline or high-contrast cuts such as Instrument Serif or Cormorant) only at display sizes; their thin strokes break up under 24px. Never set whole paragraphs in a display face (in CJK, readers tire after about 200 characters).",
   values: {min_px: 24},
   why: "A display cut at text size loses its strokes and turns a paragraph into texture.",
   fix: "Set text sizes in the body face; keep the display cut for headings.",
   sources: ["TYP-118 (HS §124 §134)", "TYP-215 (HS §126 §138)"]}
- {id: TYP-022, title: Lines never collide or clip, domain: D05, tier: Floor, check: H, remedy: fix-typeset, waivable_by: never, tests: [T-LEADING],
   rule: "Lines of text never overlap and glyphs are never clipped, at any captured width. Wrapping uppercase display is never led under 1.0. Menus, buttons and inputs that hold descenders are not set at line-height 1 inside a fixed height. Confirm every case on the screenshot, not from the CSS alone.",
   values: {caps_min_leading: 1.0, control_leading: 1.35},
   why: "Letters that overlap or are cut off cannot be read.",
   fix: "Raise the line-height (1.02 to 1.08 on caps display, about 1.35 on controls) and let the box grow with its text.",
   sources: ["TYP-158 (HM §55 §394 §298)", "TYP-162 (KM §60)", "TYP-180 (UU §57)"]}
- {id: TYP-023, title: CJK text is set for CJK, domain: D05, tier: Reflex, kind: context, check: H, remedy: fix-typeset, tests: [T-FACE-ROLES, T-LEADING, T-MEASURE],
   rule: "When the artifact sets Chinese, Japanese or Korean text, give it a named CJK face, never the bare system default. Lead CJK body about 0.2 looser than Latin (Chinese body near 1.8), keep its measure at 22 to 38 characters (best 28 to 32), keep tracking near zero with no Latin negative display tracking, and never italicise hanzi.",
   values: {leading_body: 1.8, measure: [22, 38], measure_best: [28, 32], tracking_em: [0, 0.05]},
   why: "Latin settings applied to CJK make dense blocks with cramped lines and slanted characters that have no italic form.",
   fix: "Add a CJK face to the stack and give CJK text its own leading, measure and tracking.",
   sources: ["TYP-200 (HS §127 §138)", "TYP-206 (HS §121 §77, KM §54)", "TYP-207 (HS §120)", "TYP-209 (HS §133, KM §41 §49 §54)", "TYP-210 (HS §131)"]}

# ---------------- D07 layout ----------------
- {id: TYP-024, title: A figure and its unit stay on one line, domain: D05, tier: Finish, detector: unit_wrapped, remedy: fix-typeset,
   rule: "A short figure with a unit (128 ms, 4.2 GB, $45/mo) never breaks so the unit sits on its own line.",
   why: "A stranded unit breaks the figure into two things and reads as a layout that was never checked at this width.",
   fix: "Keep the pair together (white-space: nowrap), size the figure to its box, or move the unit into the label.",
   sources: ["stageshow rehearse.md (unit wrapped); verify.md"]}
- {id: LAY-001, title: Spacing has rhythm, domain: D07, tier: Reflex, detector: spacing_monotony, remedy: fix-layout,
   rule: "Do not use one spacing value for more than 60% of gaps; use at least 4 distinct steps across a page.", why: "Uniform gaps make every group look equally related.",
   fix: "Tighten within groups, open between groups.", sources: ["impeccable §540", "hallmark §76"]}
- {id: LAY-002, title: Spacing on the scale, domain: D07, tier: Finish, detector: off_scale_spacing, remedy: fix-layout,
   rule: "Spacing values sit on the 4px scale; no more than 3 off-scale values.", why: "Off-scale values are drift.", fix: "Snap to the nearest step.", sources: ["hallmark §76", "huashu §104"]}
- {id: LAY-003, title: Headings sit with their content, domain: D07, tier: Reflex, detector: heading_rhythm, remedy: fix-layout,
   rule: "A heading must be closer to its own content than to the block above it.", why: "Otherwise headings visually belong to the wrong section.",
   fix: "Increase space above headings; reduce space below.", sources: ["impeccable §541"]}
- {id: LAY-004, title: No dead bands, domain: D07, tier: Reflex, detector: dead_band, remedy: fix-layout,
   rule: "No empty vertical band taller than 160px at any fold width.", why: "Dead bands read as broken layout and push content below the fold.",
   fix: "Remove the empty band or fill it with content that earns the space.", sources: ["hallmark §453"]}

# ---------------- D07 structure (lens-structure; judgment cards, no detector) ----------------
# Promoted from the mined drafts in rules/D07-LAY.yaml; each source cites the draft id and its original sections.
# LAY-007 is Reflex although its drafts (LAY-216, LAY-231) say Floor: an action below the fold costs a scroll, it does not block use.
- {id: LAY-005, title: Every screen has a reason, domain: D07, tier: Reflex, check: J, remedy: fix-layout, tests: [T-SCREEN-BY-SCREEN, T-JUDGE-TILE],
   rule: "Scroll the artifact one screen at a time (1440x900 tiles). Every screen holds one thing big enough to be its reason, and the first screen has a focal point. This outranks every detail finding.",
   why: "A screen with nothing to look at is where visitors stop scrolling; detail fixes on it change nothing.",
   fix: "Give the screen a lead element (the section's visual, a statement at section size, a table) or merge it into its neighbour.",
   sources: ["LAY-110 (HM §157, HM §210)", "LAY-101 (TS §99)"]}
- {id: LAY-006, title: Hierarchy survives the squint, domain: D07, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-SQUINT],
   rule: "With the render blurred, the primary element, the secondary elements and the groups read in that order, each section keeps a shape, and the page has a rhythm of heavy and light. Build the order from size, weight and space, never from colour or ornament alone.",
   why: "If the order disappears when the words blur, the reader has to read everything to find what matters.",
   fix: "Enlarge the primary element, quiet the competitors, and open the space between groups.",
   sources: ["LAY-102 (HM §210, HM §151, HU §99)", "LAY-106 (UX §235, KM §177-178)"]}
- {id: LAY-007, title: "The first screen answers what, for whom and what next", domain: D07, tier: Reflex, check: H, remedy: fix-layout, tests: [T-FIVE-SECOND],
   rule: "Keep the headline, the line under it, the primary action and the lead visual's focal point inside the first screen at 1280x800 and at 390 wide. On a page that persuades, the primary action is never below the first screen.",
   values: {fold: [1280, 800], phone_width: 390},
   why: "Visitors decide in the first screen whether to stay; an answer they must scroll to find is an answer most never see.",
   fix: "Shorten or shrink what pushes the action down (an oversized visual, a second paragraph), never the action itself.",
   sources: ["LAY-216 (HM §4, HM §45, HM §422)", "LAY-231 (TS §171, TS §633)"]}
- {id: LAY-008, title: Headings and hero tell the story, domain: D07, tier: Finish, check: J, remedy: fix-copy, tests: [T-HEADINGS-READ],
   rule: "Read only the hero and the section headings in order: they tell the page's story. A heading that only names a category ('Features', 'Why us') breaks it.",
   why: "Most visitors read headings only; category labels give them nothing to take away.",
   fix: "Rewrite each category heading as the section's claim, in the section's own nouns.",
   sources: ["LAY-111 (HM §30)"]}
- {id: LAY-009, title: Group with space before boxes, domain: D07, tier: Reflex, check: J, remedy: fix-layout, tests: [T-DELETION],
   rule: "Group related items with whitespace first, and climb the surface ladder only as far as needed: whitespace, then a 1px hairline, then a tinted well, then a card (border or shadow, never both). Reserve cards for things that are independently interactive or of a different kind. Repeated rows carry no ornament.",
   why: "Boxes around everything erase the groups they are meant to show; space that is tight within a group and open between groups shows them for free.",
   fix: "Remove boxes where space already groups; keep one card style for real objects.",
   sources: ["LAY-122 (UX §236, KM §67)", "LAY-143 (HM §74)", "LAY-142 (HM §4, HM §74, TS §94, TS §192)"]}
- {id: LAY-010, title: One idea per section, domain: D07, tier: Reflex, check: J, remedy: fix-layout, tests: [T-SKELETON],
   rule: "Give each section one idea: one h2, and at most one action besides the main one. A section whose content names itself (menu, timetable, product screen) may go without a head block.",
   values: {h2_per_section: 1, extra_actions: 1},
   why: "A section with two ideas makes the reader decide what it is about; usually they pick neither.",
   fix: "Split the section, or cut the second idea to a line in the first.",
   sources: ["LAY-150 (TS §89, HM §30)", "LAY-162 (HM §174)"]}
- {id: LAY-011, title: Every section has mass, domain: D07, tier: Reflex, check: H, remedy: fix-layout, tests: [T-JUDGE-TILE, T-SCREEN-BY-SCREEN],
   rule: "A heading and a paragraph are a head block, not a section. Give every section mass: a visual at least 300px tall, three items across spanning at least 70% of the container, a list or table of 3 or more rows, 2 or more form fields, or a statement at section size. Empty area over 35% of a section inside its container warns and over 50% fails. Never centre a short block in a tall screen to hide that it is short.",
   values: {min_visual_px: 300, min_span_share: 0.7, warn_empty_share: 0.35, fail_empty_share: 0.5},
   why: "Thin sections make the page read as a list of announcements with nothing behind them.",
   fix: "Add mass (a bigger visual, a body across about 10 columns, a statement) or merge the section into its neighbour. Never add words or shrink the gap.",
   sources: ["LAY-151 (HM §34, HM §176, HM §429)", "LAY-153 (HM §34, HM §172, KM §258)", "LAY-156 (TS §78)", "LAY-157 (TS §74, TS §78)"]}
- {id: LAY-012, title: Vary compositions, domain: D07, tier: Reflex, kind: cap, check: J, remedy: fix-layout, tests: [T-COMPOSITION-RUN],
   rule: "Use 3 to 6 different compositions on a page. Never more than two neighbours with the same skeleton, and any card layout at most twice. Head-then-block repeated down the page is a template.",
   values: {min_compositions: 3, max_compositions: 6, max_same_neighbours: 2, max_card_layouts: 2},
   why: "When every section has the same shape, the reader cannot tell where one idea ends and the next begins.",
   fix: "Change the composition of the middle section in each run of three; pick the shape the content suggests (a table for specifications, a showcase for one picture).",
   sources: ["LAY-167 (HM §195, HM §205, TS §92, TS §99)", "LAY-168 (HM §174, HM §41)"]}
- {id: LAY-013, title: Dense sections are followed by quiet ones, domain: D07, tier: Finish, check: J, remedy: fix-layout, tests: [T-SQUINT],
   rule: "Follow a dense section (grid, table, bento, index) with a quiet one (statement, showcase). After at most two visual sections, place a calm one. Earn space by mass: a large gap frames a tall section and is a hole under a short one.",
   why: "Unbroken density tires the reader; unbroken calm reads as empty.",
   fix: "Reorder so dense and quiet sections alternate, or scale the gap to the section it frames.",
   sources: ["LAY-169 (HM §206, TS §92)", "LAY-165 (HM §172)"]}
- {id: LAY-014, title: No zigzag splits, domain: D07, tier: Reflex, kind: cap, check: H, remedy: fix-layout, tests: [T-COMPOSITION-RUN],
   rule: "Do not alternate text-and-picture splits left and right down the page. Mirror a split at most once (conflict C24), change the ratio between two splits (5/7, 4/8, 6/6), and vary weight with a larger lead row instead of A-B-A-B.",
   values: {max_mirrors: 1},
   why: "Zigzag alternation is the stock feature-page rhythm; it makes each feature look the same size and the same importance.",
   fix: "Turn the run into one lead split plus a grid, rows or a table, in the order of importance.",
   sources: ["LAY-175 (HM §178, HM §205, TS §82, KM §161, KM §270)"]}
- {id: LAY-015, title: Section order follows the argument, domain: D07, tier: Reflex, check: J, remedy: fix-layout, tests: [T-STOCK-ORDER, T-ANATOMY],
   rule: "Order sections by the argument the page makes, not by the default run (hero, three features, steps, figures, CTA band, footer). Lead with the strongest real thing after the hero: what it does, show it, prove it, then act. Steps only for a process the visitor really goes through; a figures row only for numbers stated outright.",
   why: "A default sequence tells the visitor nothing about this business and puts the strongest material wherever the template put it.",
   fix: "Move the strongest real section to second place; cut stock sections that have no material.",
   sources: ["LAY-186 (HM §17, HM §41, HM §204, HU §63, HU §158)", "LAY-187 (HM §204, TS §100, HU §159)", "LAY-188 (HM §185, HM §204, TS §123)"]}
- {id: LAY-016, title: Anatomy fits the visitor's job, domain: D07, tier: Reflex, kind: context, check: J, applies_when: [web], remedy: fix-layout, tests: [T-ANATOMY],
   rule: "Name the visitor's job, then check its action sits where category sites put it and its own sections are present. Subscribe: the email field in or as the hero, a sample issue, a dated archive. Book: the picker or next free times from nav and hero, never only at the foot. Visit: today's hours and address in nav or hero, what's on, getting there. Attend: tickets in the nav, date and place as the headline, lineup, schedule, priced tiers. Buy: product, price and options as an offer, delivery and guarantee. Try: one store button per named platform under the head. Sign up: 'Start free' in nav and hero, the product at work, pricing, questions; never ends on a newsletter. Hire: the work is the page, contact in nav and after the work. Join: first visit in the hero, schedule, priced memberships. Listen: the new release with listen and order side by side, dates as rows.",
   why: "Visitors arrive with one job; an anatomy built for another job hides the action they came for.",
   fix: "Move the job's action into the nav and hero, and add the missing job section the client has material for; [DATA NEEDED: what] where they do not.",
   sources: ["LAY-189 (HM §19, UX §217)", "LAY-190 (HM §20)", "LAY-191 (HM §21, TS §155)", "LAY-192 (HM §22, UX §212)", "LAY-193 (HM §23, HM §194, TS §17)",
             "LAY-194 (HM §24)", "LAY-195 (HM §25, TS §20)", "LAY-196 (HM §26)", "LAY-197 (HM §27)", "LAY-198 (HM §28)"]}
- {id: LAY-017, title: Proof in the category's own form, domain: D07, tier: Reflex, check: J, remedy: fix-layout, tests: [T-ANATOMY],
   rule: "Show proof in the form the category uses (a menu, a lineup, back issues, a record of work, a changelog), never a generic band of numbers or a wall of logos standing in for it.",
   why: "Category-shaped proof is checkable and specific; a stat band could sit on any page.",
   fix: "Replace the band with the category's own record, built from supplied material only.",
   sources: ["LAY-202 (HM §17, HM §518)"]}
- {id: LAY-018, title: Edges line up on one grid, domain: D07, tier: Reflex, check: H, remedy: fix-layout, tests: [T-LEFT-EDGES],
   rule: "Lay sections on one column grid so left edges line up from nav to footer. Text starts on at most two lines (the container's left line and one split line); blocks start on column starts.",
   values: {max_text_start_lines: 2},
   why: "Edges that drift by a few pixels per section read as unplanned, and the eye has to find each block's start again.",
   fix: "Snap every block to the container line or the split column; remove one-off insets.",
   sources: ["LAY-126 (HM §168, TS §70)", "LAY-127 (TS §81)", "LAY-130 (TS §81)"]}
- {id: LAY-019, title: One alignment axis, domain: D07, tier: Reflex, check: H, remedy: fix-layout, tests: [T-LEFT-EDGES, T-SQUINT],
   rule: "Choose one primary axis for the page and hold it: never more centred heading groups than left-aligned ones, body and lists left-aligned, and no hero with title, line, action and mark all stacked on one centred axis.",
   values: {centred_groups: "<= left-aligned groups", max_centred_hero_elements: 2},
   why: "Everything centred is the default, not a choice; it gives the eye no edge to follow and makes long text hard to read.",
   fix: "Left-align the heading groups and body; keep centring for one short display line.",
   sources: ["LAY-107 (HM §33)", "LAY-108 (HM §32, HM §434, TS §81)", "LAY-109 (HU §104, KM §179)", "LAY-225 (HM §48, HM §421, HM §516)"]}
- {id: LAY-020, title: Density fits the job, domain: D07, tier: Finish, kind: context, check: J, remedy: fix-layout, tests: [T-DENSITY-FIT],
   rule: "Set spacing by density: low (marketing) 24 to 96px, mid (documents) 16 to 64px, high (dashboards and tools) 8 to 32px. On an app screen density is even across the screen.",
   values: {low_px: [24, 96], mid_px: [16, 64], high_px: [8, 32]},
   why: "A tool padded like a landing page hides the work; a landing page packed like a tool hides the message.",
   fix: "Move the spacing scale to the job's step and apply it evenly.",
   sources: ["LAY-123 (UX §246)", "PRC-167 (HM §159)"]}
- {id: LAY-021, title: Phone stacks in reading order, domain: D07, tier: Reflex, check: J, remedy: fix-layout, tests: [T-PHONE-ORDER],
   rule: "Every composition stacks in reading order on a phone: head block, then body; a split's visual after its text; the bento lead tile first; a schedule becomes one column per day.",
   why: "A phone reader meets the stack top to bottom; a visual or action before its explanation reads out of order.",
   fix: "Fix the source order or the stacking rule so the phone order matches the desktop reading order.",
   sources: ["LAY-251 (HM §196, TS §74, TS §82)"]}
- {id: LAY-022, title: No orphans in grids, domain: D07, tier: Reflex, check: J, remedy: fix-layout, tests: [T-JUDGE-TILE],
   rule: "No empty cell and no orphan on a grid's last row; logo rows split evenly (3 and 3, never 5 and 1). Change the count or the columns.",
   why: "An orphaned last item looks forgotten and breaks the grid the rest of the section set up.",
   fix: "Change the column count, cut or add one real item, or let the last item span the row.",
   sources: ["LAY-137 (HM §38, HM §432, KM §168)", "LAY-160 (KM §168)"]}

# ---------------- D11 copy ----------------
- {id: LAY-023, title: Edges meet or part clearly, domain: D07, tier: Finish, detector: near_tangent, remedy: fix-layout,
   rule: "A painted box does not sit 2 to 3 px from its painted container's edge or from the painted box beside it: line the edges up exactly, or part them by at least the layout's gap.",
   why: "Edges a hair apart read as an accident: the eye sees a near-miss, not a decision.",
   fix: "Share the edge (0 px or one border), or part the boxes by the container's padding, at least 8 px.",
   sources: ["stageshow craft.md Spacing and alignment (no near-tangents); film-checks near-tangent (MIT)"]}
- {id: LAY-024, title: Nested corners share a centre, domain: D07, tier: Finish, detector: nested_radius, remedy: fix-layout,
   rule: "A rounded box evenly inset in a rounded container uses an outer radius of about the inner radius plus the inset; never an inner box rounder than its container.",
   why: "With equal radii the gap between the curves pinches at the corners and the nesting looks off.",
   fix: "Outer radius = inner radius + padding; or reduce the inner radius to the outer minus the padding.",
   sources: ["stageshow craft.md Spacing and alignment (nested shapes pad evenly)"]}
- {id: CPY-001, title: Words per screen within budget, domain: D11, tier: Reflex, kind: cap, detector: words_per_screen, remedy: fix-distill,
   rule: "Keep visible words per 900px screen under the profile budget (strict: warn 80, fail 95).", why: "Dense marketing screens are skimmed, not read.",
   fix: "Cut qualifiers and repeated claims; move detail to a page that is for reading.", sources: ["hallmark §20 §30"]}
- {id: CPY-002, title: Page length within budget, domain: D11, tier: Reflex, kind: cap, detector: page_words, remedy: fix-distill,
   rule: "Persuade pages stay under the profile's word total (strict 450).", why: "Length is not depth.", fix: "Read only hero and headings: if they tell the story, cut the rest.",
   sources: ["hallmark §30", "taste-skill §6"]}
- {id: CPY-003, title: Short headline, domain: D11, tier: Reflex, kind: cap, detector: h1_words, remedy: fix-copy,
   rule: "The h1 is at most 7 words and 50 characters (strict).", why: "Long headlines become paragraphs at display size.", fix: "Say one thing; move the rest to the sub-line.",
   sources: ["hallmark §101"]}
- {id: CPY-004, title: Dash budget, domain: D11, tier: Reflex, kind: cap, detector: em_dash, remedy: fix-copy,
   rule: "Use em dashes within the profile budget (strict 0); never 8 or more at 1 per 500 characters.", why: "Em-dash saturation is the most recognisable AI prose tell.",
   fix: "Use a full stop, comma, colon or parentheses.", sources: ["hallmark §358", "kami §652", "impeccable §508", "writing-guidelines"]}
- {id: CPY-005, title: No slop diction, domain: D11, tier: Reflex, check: M, detector: lexicon_copy, remedy: fix-copy, tests: [T-THREE-LINE, T-OVER-CORRECTION],
   rule: "Do not use words and phrases in the buzzword, stock-phrase, button-label, self-label and chrome lexicons beyond their policy.",
   why: "These are the strings a model reaches for when it has nothing specific to say.", fix: "Replace with a specific claim only this business can make, or delete.",
   sources: ["taste-skill §37-45", "hallmark §106 §356 §357", "kami §224 §238 §298", "agent-skills §119-129"]}
- {id: CPY-006, title: No repeated labels inside a card, domain: D11, tier: Reflex, detector: repeated_label, remedy: fix-copy,
   rule: "The same literal text must not appear three or more times inside one card.", why: "Repetition signals filled template slots.", fix: "Say it once.", sources: ["impeccable §510"]}

# ---------------- D11 copy (lens-copy; judgment and hybrid cards, no detector) ----------------
# Promoted from the mined drafts in rules/D11-CPY.yaml; each source cites the draft id and its original sections
# (HM hallmark, TS taste-skill, KM kami, AS agent-skills, UU ui-ux-pro-max, AD awesome-design-patterns).
# Copy findings are Reflex or Finish. CPY-018 is Reflex although its draft (CPY-225) says Floor: an error that does not say
# what to type slows the user but does not block them; announcing errors and labelling fields stay Floor with A11-010
# (form_labels) and lens-a11y. Invented numbers, quotes and people stay with INT-001 to INT-007; slop words, stock phrases
# and stock labels with CPY-005 (lexicon_copy); dashes with CPY-004; quotes and ellipses with TYP-018; category-only
# headings with LAY-008. CPY-024 to CPY-029 are long-form cards (articles, docs, emails, reports): the review in
# research/notes/unslop-writing-skill-review.md found that these tells do not separate slop from good on landing pages.
- {id: CPY-007, title: Copy is written for this client, domain: D11, tier: Reflex, check: J, remedy: fix-copy, tests: [T-RIVAL-NAME, T-FRESH-READER],
   rule: "Write with the brief's own nouns, real places, the client's numbers and the customer's verb. Put a rival's name into the h1, the sub-line and every heading: no line stays true. A line that would sit unchanged on a competitor's page is a finding; quote it.",
   why: "Copy that fits any competitor tells the reader nothing about this one, and they leave without a reason to choose it.",
   fix: "Replace each line that survives the swap with a fact only this client has: a product part, a place, a price, a customer's own words. Where the fact is missing, use a [DATA NEEDED] slot.",
   sources: ["CPY-165 (HM §100, TS §334)", "CPY-183 (HM §101)"]}
- {id: CPY-008, title: Claims carry a number or a mechanism, domain: D11, tier: Reflex, check: J, remedy: fix-copy, tests: [T-THREE-LINE, T-SO-WHAT],
   rule: "Replace an adjective claim ('fast', 'powerful', 'significant growth') with the number or the mechanism behind it, in the same sentence, with its unit. Each claim passes three tests: the reader can picture it, it could be proven false, and only this business could say it. The number must be real (INT-001); never invent one to pass this card.",
   values: {tests_per_claim: 3},
   why: "An adjective asks the reader to trust the writer; a number or a mechanism lets them check.",
   fix: "Name how it works or what it measures ('syncs every 30 seconds', 'Revenue grew 34% to $12M'), using supplied facts only; otherwise cut the claim or leave a [DATA NEEDED] slot.",
   sources: ["CPY-121 (KM §222 §298, TS §334)", "CPY-118 (TS §325 §359, HM §362)"]}
- {id: CPY-009, title: No model-default voice, domain: D11, tier: Reflex, kind: context, check: J, remedy: fix-copy, waivable_by: brand-system, tests: [T-READ-ALOUD, T-FRESH-READER],
   rule: "Do not write in the model's default register: warm, wry, modest, slightly literary, deadpan-twist endings, a business that calls itself honest, calm or quiet. Pick one register for the client from the buyer, the price and its real character, and borrow at most one move from another. The client's own voice overrides this card, and a plain or conventional brand voice is not a finding.",
   why: "The default register is the same on every generated page, so readers learn to recognise it and discount what it says.",
   fix: "Write a short voice card from the brief (register, three traits, words the client uses and avoids), then rewrite the hero and headings in it. Run the nine-trades test: the voice should fit none of nine other businesses.",
   sources: ["CPY-166 (TS §332 §335 §43 §49)", "CPY-167 (TS §332 §335)", "CPY-179 (TS §332)"]}
- {id: CPY-010, title: Voice holds and tone moves by moment, domain: D11, tier: Reflex, check: J, remedy: fix-copy, tests: [T-READ-ALOUD, T-STATE-COPY],
   rule: "Keep one voice across the artifact and move its tone to the moment: plain facts in prices, FAQ, booking and forms; calm and solution-first in errors; brief in success; formal in legal. Write all microcopy in the page's register: a stock error or thank-you line under a hand-tuned hero is a tell. In docs, the tone follows the content type (tutorial warm, how-to terse, reference neutral).",
   why: "When the voice drops out in forms and errors, the reader meets the template at the moment they most need help.",
   fix: "Rewrite the stock microcopy in the page's register; strip the voice back to facts where the reader is deciding or paying.",
   sources: ["CPY-170 (TS §332 §355, UU §293)", "CPY-224 (TS §43 §357)", "CPY-171 (AS §114)"]}
- {id: CPY-011, title: Cadence devices within budget, domain: D11, tier: Reflex, kind: cap, check: H, remedy: fix-copy, tests: [T-CADENCE, T-OVER-CORRECTION],
   rule: "Count these together per page and keep each within budget: contrast frames ('X, not Y', 'isn't', 'not just', 'rather than', 'instead of', 'without the') 2; negation runs ('No X, no Y') 1, each item a checkable refusal; -ing riders (', ensuring...', ', allowing...') 1; dry closing quips at paragraph ends 2, never consecutive. The sweep's stock-phrases not-x-but-y hits count toward the first budget; cite them, do not recount them.",
   values: {contrast_frames: 2, negation_runs: 1, ing_riders: 1, closing_quips: 2},
   why: "One device is a choice; the same device in every paragraph is the rhythm of generated prose, and readers hear it.",
   fix: "Keep the strongest instance of each device and rewrite the rest as plain statements that end on information.",
   sources: ["CPY-155 (TS §40, HM §359)", "CPY-156 (TS §40)", "CPY-158 (TS §40)", "CPY-159 (TS §40 §51)", "CPY-162 (TS §40 §50)"]}
- {id: CPY-012, title: No rhetorical questions or exclamation marks in body copy, domain: D11, tier: Reflex, check: H, remedy: fix-copy, tests: [T-CADENCE],
   rule: "Do not pose rhetorical questions, and do not use questions as headlines outside a FAQ. Use no exclamation marks in body copy. A real question the reader asks (FAQ, support, a search prompt) is not a finding.",
   values: {rhetorical_questions: 0, exclamations: 0},
   why: "A rhetorical question delays the answer the reader came for; exclamation marks shout enthusiasm the facts should carry.",
   fix: "Answer the question in its place as a statement; end the sentence with a full stop.",
   sources: ["CPY-176 (AS §113, TS §322 §48)", "CPY-241 (TS §40 §41 §48)"]}
- {id: CPY-013, title: Lists of three only when there are three things, domain: D11, tier: Reflex, check: H, remedy: fix-copy, tests: [T-CADENCE],
   rule: "Use a list of three only when there are exactly three real things. Never write adjective triads ('fast, simple, powerful') or fragment triads ('Fast. Simple. Secure.'), and never put triads in consecutive sentences.",
   why: "The reflex triad pads two facts into three, or three moods into a slogan, and it is one of the most recognisable generated rhythms.",
   fix: "Count the real items: keep two if there are two, and turn adjectives into the facts behind them (CPY-008).",
   sources: ["CPY-161 (HM §104, TS §40)"]}
- {id: CPY-014, title: Headings are not formulas, domain: D11, tier: Reflex, check: H, remedy: fix-copy, tests: [T-HEADING-FORM],
   rule: "Do not write heading formulas: 'Meet <Name>'; triads ('Fast. Simple. Secure.'); colon titles ('Focus: the app for...'); more than one two-fragment head ('X. Y.'); more than one number pair ('Four X, one Y'); a bare command ('Get started') as a heading. Give every heading a naming noun: a product, part, place, section noun (prices, rooms, menu, hours, questions) or a digit. Headings that only name a category are LAY-008's.",
   values: {two_fragment_heads: 1, number_pair_heads: 1},
   why: "Formula headings are the generator's scaffolding; they could top any section on any page.",
   fix: "Rewrite the heading as the section's claim in its own nouns: 'Rooms from £95, all with a garden view', not 'Meet our rooms'.",
   sources: ["CPY-187 (HM §106 §360, TS §40 §322)", "CPY-184 (TS §317)", "CPY-186 (HM §103, TS §322)"]}
- {id: CPY-015, title: "The first screen says what, for whom and the difference", domain: D11, tier: Reflex, check: H, remedy: fix-copy, tests: [T-FIVE-SECOND],
   rule: "Make the h1 name the category, plus the buyer or the place for a brand the reader does not know; never a riddle, a mood or a brand line. The sub-line says what it is, for whom and the one difference. Put one hard fact on the first screen: a number, place, price or date. The sub-line length follows the profile (conflict C44); the h1 length is CPY-003's.",
   values: {sub_line_words_strict: 12, sub_line_words_balanced: 30, hard_facts_first_screen: 1},
   why: "A visitor decides in seconds whether the page is for them; a mood line makes them read on to find out what is being sold.",
   fix: "Rewrite the h1 as category plus buyer or place, and the sub-line as what, for whom and the one difference, with one supplied fact.",
   sources: ["CPY-180 (TS §315 §349, KM §704)", "CPY-189 (HM §103 §367, TS §321)", "CPY-182 (TS §316)"]}
- {id: CPY-016, title: Say each thing once, domain: D11, tier: Reflex, check: J, remedy: fix-distill, tests: [T-DELETION],
   rule: "Never restate a section's heading in its body opener or its last line. Say each fact once, where it does work, with one value and one wording; a fact repeated in 4 or more sections is filler (ledgers and summaries are exempt).",
   values: {max_sections_per_fact: 3},
   why: "Restating the heading spends the reader's attention on words they have already read.",
   fix: "Delete the restating sentence and open the body with the first new fact; keep a repeated fact only where it decides something.",
   sources: ["CPY-191 (HM §104 §363, KM §298)", "CPY-128 (HM §109 §363, TS §613 §616)"]}
- {id: CPY-017, title: "Labels say the action, one wording per action", domain: D11, tier: Reflex, check: H, remedy: fix-copy, tests: [T-LABEL-READ],
   rule: "Write button text as a verb and an object, 1 to 5 words, literal even in a playful register ('Book a fitting'). A bare noun only when it opens that thing; 'Continue' only as a flow's second step. Word the main action the same everywhere: the closing action repeats the hero's word for word. Link text names its destination; one target never carries two labels. A modal's confirm button matches its title. Stock labels ('Learn more', 'Get started') are CPY-005's: cite the sweep hit.",
   values: {max_words: 5},
   why: "Readers scan labels alone; a label that does not say what happens, or changes its wording, makes them stop and work it out.",
   fix: "Name the action and its object; pick one wording for the main action and use it at every placement.",
   sources: ["CPY-215 (HM §107, TS §318 §356)", "CPY-219 (TS §319 §356)", "CPY-220 (AS §164-165, TS §329, HM §361)", "CPY-222 (AD §70)"]}
- {id: CPY-018, title: Errors name the field and the fix, domain: D11, tier: Reflex, check: H, remedy: fix-copy, tests: [T-STATE-COPY],
   rule: "Make each error name the field and what to type, next to the field, with a recovery path ('Write the day you want to come'). A summary banner may add to it but never replaces it. 'Invalid input', 'Something went wrong' or an error with no next step is a finding.",
   why: "A vague error leaves the user guessing what to change, and many give up.",
   fix: "Rewrite each error as the field plus the format or value it needs, and say what to do next.",
   sources: ["CPY-225 (TS §327 §357, UU §37 §97)"]}
- {id: CPY-019, title: States say what happened and what is next, domain: D11, tier: Reflex, check: J, remedy: fix-copy, tests: [T-STATE-COPY],
   rule: "A confirmation names what was sent and the real next step ('Your table request is in. We reply within a day.', with a real time only). An empty state says what it is, what to do next and offers one action. A 404 points at the nearest useful content. A success shown when nothing was sent is INT-004's.",
   why: "State copy is read at the moment of doubt; a generic 'Success!' or a blank panel leaves the user unsure what happened.",
   fix: "Write each state from what the system actually did and what the user can do now.",
   sources: ["CPY-227 (TS §327 §357, UU §100)", "CPY-228 (AD §52, UU §96, TS §357)", "CPY-229 (TS §357)"]}
- {id: CPY-020, title: One spelling per term, domain: D11, tier: Finish, check: H, remedy: fix-copy, tests: [T-TERMS],
   rule: "Keep one spelling and capitalisation for each product or domain term used 3 or more times ('Flowly AI', not also 'flowly ai' and 'FlowlyAI'; 'LLM', not also 'llm').",
   values: {min_uses: 3},
   why: "Drifting spellings read as unreviewed copy and make readers wonder whether two names mean two things.",
   fix: "Pick the brand's spelling and apply it everywhere.",
   sources: ["CPY-174 (KM §251, UU §306)"]}
- {id: CPY-021, title: "Length follows the facts, not a rule", domain: D11, tier: Finish, check: H, remedy: fix-copy, tests: [T-CADENCE],
   rule: "Vary sentence length by meaning, and spend words where the facts are richest. Over 15 or more sentences, a length spread (standard deviation) under 4 words, or more than 30% of sentences at 4 words or fewer, is a finding. Cards in one set that are all the same length are a tell.",
   values: {min_sentences: 15, min_stdev_words: 4, max_short_share: 0.30},
   why: "Even lengths show the copy was written to fill slots, not to say what each item needs.",
   fix: "Let the item with the most to say run longer and cut the ones with nothing to add.",
   sources: ["CPY-206 (TS §47 §334, HM §104)", "CPY-207 (TS §43 §323)"]}
- {id: CPY-022, title: "Say what it does, not corporate speak", domain: D11, tier: Reflex, check: J, remedy: fix-copy, tests: [T-READ-ALOUD],
   rule: "Say what the product literally does: 'use the platform to share data between teams', not 'leverage our platform to unlock synergies'. Give software literal actions ('the server checks the cache'), not human or metaphor verbs ('the request lands'). The sweep's buzzword hits are CPY-005's; this card covers the phrasing the lexicon cannot match.",
   why: "Corporate phrasing hides the mechanism, so the reader cannot tell what they would get.",
   fix: "Rewrite the sentence with the product as the subject and a literal verb.",
   sources: ["CPY-154 (KM §243 §303)", "CPY-177 (AS §123 §128)"]}
- {id: CPY-023, title: No substitute tics after a fix, domain: D11, tier: Reflex, check: J, remedy: fix-copy, tests: [T-OVER-CORRECTION],
   rule: "When copy has been cleaned of one tell, check that a substitute has not multiplied in its place: no em dash replaced by full stops everywhere, no 'not X but Y' replaced by 'rather than', no hype replaced by 'quietly' or 'steady', no triads replaced by pairs everywhere. Do not flag non-tells: correct grammar, plain 'is' and 'has', one true 'no card needed', a provable narrow superlative, an intentional refrain, the client's own words, selling on a sales page.",
   why: "Rewriting to beat a word list breeds the next tell; the copy stays generated with different words.",
   fix: "Rewrite the passage for the reader with this client's facts, not against the list.",
   sources: ["CPY-164 (TS §51)", "CPY-163 (TS §52)"]}
- {id: CPY-024, title: "Long-form: active voice, actor named", domain: D11, tier: Finish, kind: context, check: H, applies_when: [web, email, print], remedy: fix-copy, tests: [T-SECOND-READ, T-LONG-FORM],
   rule: "In long-form content only (articles, docs, emails, reports), write in the active voice with the actor named; in docs, address the reader as 'you' in the present tense with imperative steps. A run of two or more passive sentences in one paragraph is a finding. A single passive that keeps the topic in subject position is not.",
   values: {max_passive_run: 1},
   why: "Passive stacks hide who does what and make the reader parse each sentence twice.",
   fix: "Name the actor as the subject: 'The chair assigns actions', not 'Actions are assigned'.",
   sources: ["research/notes/unslop-writing-skill-review.md (passive voice, plain speech)", "CPY-175 (AS §107-112)"]}
- {id: CPY-025, title: "Long-form: one hedge is enough", domain: D11, tier: Finish, kind: context, check: H, applies_when: [web, email, print], remedy: fix-copy, tests: [T-LONG-FORM],
   rule: "In long-form content only, hedge a claim once or not at all: 'may' is enough. Stacked hedges ('may perhaps', 'arguably it could be said', 'might typically vary somewhat') and weasel words (generally, typically, often, many, significantly) with no figure behind them are findings.",
   why: "Stacked hedges say the writer does not know and will not say so; the reader cannot tell what is true.",
   fix: "State the claim at the strength the evidence supports, with the figure or the source, and keep at most one qualifier.",
   sources: ["research/notes/unslop-writing-skill-review.md (hedging)", "CPY-149 (AS §119-122)"]}
- {id: CPY-026, title: "Long-form: claims name their source", domain: D11, tier: Reflex, kind: context, check: H, applies_when: [web, email, print], remedy: fix-copy, tests: [T-LONG-FORM],
   rule: "In long-form content only, do not attribute a claim to an unnamed crowd ('experts say', 'studies show', 'research suggests', 'many believe', 'it has been suggested'). Name the study, the person or the data, or state the claim as the writer's own. An invented citation is integrity, not copy.",
   why: "A vague attribution borrows authority it does not have; the reader cannot check it.",
   fix: "Cite the named source with a link or date, or cut the attribution and own the claim.",
   sources: ["research/notes/unslop-writing-skill-review.md (vague attributions)"]}
- {id: CPY-027, title: "Long-form: one name per thing", domain: D11, tier: Finish, kind: context, check: J, applies_when: [web, email, print], remedy: fix-copy, tests: [T-TERMS, T-LONG-FORM],
   rule: "In long-form content only, call one thing by one name. Cycling synonyms for one referent ('the meeting, the gathering, the session, the sync') is a finding.",
   why: "Readers assume a new word means a new thing; synonym cycling makes them check whether it does.",
   fix: "Pick the reader's word for the thing and repeat it.",
   sources: ["research/notes/unslop-writing-skill-review.md (synonym cycling)", "CPY-174 (KM §251, UU §306)"]}
- {id: CPY-028, title: "Long-form: no template framing or generic conclusions", domain: D11, tier: Finish, kind: context, check: H, applies_when: [web, email, print], remedy: fix-copy, tests: [T-LONG-FORM, T-SO-WHAT],
   rule: "In long-form content only, do not frame sections with summary transitions ('With this setup complete...', 'The question most teams face is...') or end with a generic conclusion ('In conclusion', 'Ultimately', 'the future looks bright', 'only time will tell'). The last paragraph ends on the last useful fact or the reader's next step.",
   why: "Framing and closing formulas fill the places where a real writer would put the point.",
   fix: "Cut the framing sentence; end with the final fact, the decision or the next step.",
   sources: ["research/notes/unslop-writing-skill-review.md (generic conclusions)", "CPY-153 (AS §124 §129)"]}
- {id: CPY-029, title: "Long-form: plain, whole sentences", domain: D11, tier: Finish, kind: context, check: J, applies_when: [web, email, print], remedy: fix-copy, tests: [T-LONG-FORM, T-SECOND-READ],
   rule: "In long-form content only, write plain, whole sentences: no mannered prose (metaphor nouns and verbs where a literal one exists), no over-compression (dropped articles and verbs, arrows for 'leads to'), no false ranges ('from startups to enterprises' with nothing between the ends), and -ly adverbs only where they change the meaning. Each paragraph's first sentence stands alone as its claim.",
   why: "Mannered or compressed prose makes the reader decode the sentence before they can judge the claim.",
   fix: "Rewrite with a literal subject and verb, keep the articles, and name the actual range or the actual cases.",
   sources: ["research/notes/unslop-writing-skill-review.md (mannered prose, over-compression, false ranges, adverbs)", "CPY-210 (KM §238)"]}

# ---------------- D18 integrity ----------------
- {id: INT-001, title: No invented metrics, domain: D18, tier: Floor, detector: invented_metrics, remedy: fix-copy, waivable_by: never,
   rule: "Never show a metric, count, uptime, multiple or percentage the user did not supply with a unit and source.", why: "Invented proof is a false claim made on the client's behalf.",
   fix: "Use the real number, a visible [DATA NEEDED] slot, or nothing.", sources: ["hallmark §362", "kami §299", "taste-skill §40 §43", "huashu §60"]}
- {id: INT-002, title: No default cast or fake brands, domain: D18, tier: Reflex, detector: default_names, remedy: fix-copy,
   rule: "Do not use placeholder people, the model's default first names or fake brand names as real testimonials, team members or customers.",
   why: "They are invented people presented as real.", fix: "Use supplied names, or remove the testimonial.", sources: ["hallmark §110 §354 §355", "taste-skill §35 §43"]}
- {id: INT-003, title: No fake people or hotlinked stock, domain: D18, tier: Floor, detector: fake_people, remedy: fix-harden, waivable_by: never,
   rule: "Do not load avatars from face generators or placeholder services, or hotlink stock photos.", why: "Fake faces imply real customers; hotlinks break and may violate licences.",
   fix: "Use supplied photos, self-hosted licensed assets, or no image.", sources: ["hallmark §389 §465 §467"]}
- {id: INT-004, title: Honest form states, domain: D18, tier: Floor, check: H, detector: fake_send, remedy: fix-harden, waivable_by: never, tests: [T-FAKE-SEND],
   rule: "A form that sends nothing must not show a success message.", why: "Fake success loses the user's message and their trust.",
   fix: "Show 'Nothing was sent: this form is not connected yet.' until an endpoint exists.", sources: ["hallmark §93 §364 §510"]}
- {id: INT-005, title: No placeholder residue at ship, domain: D18, tier: Floor, detector: placeholder_residue, remedy: fix-copy, waivable_by: never,
   rule: "No lorem ipsum, TODO, template brackets or 'placeholder' text in an artifact marked ship.", why: "Residue is broken content.",
   fix: "Fill with real content or a visible [DATA NEEDED] slot.", sources: ["taste-skill §39", "huashu §71", "kami §452"]}
- {id: INT-007, title: Stat bands need sources, domain: D18, tier: Reflex, kind: cap, detector: stat_band, remedy: fix-copy,
   rule: "A row of three or more big numbers (99.9%, 10K+, 2.3M, 4.9 stars) needs a source or must come from the brief's supplied facts.", why: "Unsourced stat bands are the most common invented proof on generated pages.",
   fix: "Cite each figure, use supplied facts only, or remove the band.", sources: ["lens review test set 1 (B02, B07, S09)", "hallmark §362", "taste-skill §40"]}
- {id: INT-006, title: At most two missing-fact slots, domain: D18, tier: Reflex, kind: cap, detector: data_slots, remedy: fix-copy,
   rule: "No more than 2 [DATA NEEDED] slots per page.", why: "More means the page was built before its content existed.", fix: "Get the content, or cut the sections that need it.",
   sources: ["hallmark §110"]}

# ---------------- D18 integrity (lens-integrity; judgment and hybrid cards, no detector) ----------------
# Promoted from the mined drafts in rules/D18-INT.yaml; each source cites the draft id and its original sections.
# The lens judges what a detector cannot: whether proof is real and sourced for this brand, whether a product picture
# stages its numbers, leakage the lexicons do not list, and deceptive patterns. Invented-metric patterns (INT-001), default
# names (INT-002), fake-people services (INT-003), the fake-send test (INT-004), residue (INT-005), slots (INT-006),
# stat bands (INT-007) and false success after an action (INT-008, async_state) stay with the sweep. Floor here only where
# the drafts and core/severity.md treat the failure as a false statement to the visitor ("truth"): invented proof,
# leakage, fake urgency, preselected consent and hidden prices. A real brand's own claims, customers and numbers are
# strengths, not findings; regions a page shows on purpose as examples follow data/thresholds.yaml `exhibits`.
- {id: INT-009, title: Testimonials and reviews are real and attributable, domain: D18, tier: Floor, check: J, remedy: fix-copy, waivable_by: never, tests: [T-PROOF-SOURCE, T-PROOF-SWAP],
   rule: "Show a testimonial, review, rating, review count, award or press line only when it is real: quoted word for word from a named person with a role and a company or town, or from a named platform the visitor can check. Polished quotes that would fit any product, attributed to first names, invented companies, generated faces or stock portraits, are invented proof. Showing none is fine.",
   why: "A made-up endorsement is a false statement made in the client's name; visitors who spot one stop believing the rest of the page.",
   fix: "Use supplied quotes with their attribution, link the review platform, or remove the block.",
   sources: ["INT-102 (hallmark §121 §238 §362, taste §40 §43 §615, huashu §9 §60, adp §187)", "INT-178 (adp §181 §182 §191)", "INT-104 (taste §43)", "INT-124 (hallmark §467 §121, taste §35-36)", "INT-125 (taste §35-36, hallmark §1711-area)"]}
- {id: INT-010, title: Logos and customer names are real customers, domain: D18, tier: Floor, check: J, remedy: fix-copy, waivable_by: never, tests: [T-PROOF-SOURCE, T-PROOF-SWAP],
   rule: "Show a logo wall, a customer list or a 'Trusted by' line only for real, named customers or partners. Invented company names (the startup cliches the default-names lexicon lists, such as Acme and Nexus, and two-word compounds of a tech noun and Labs, Systems or Corp), redrawn or approximated marks, and a 'Trusted by' line with no names behind it are invented proof. A real company's own customers, partners and press are strengths, not findings.",
   why: "A logo is a claim that a named business chose this product; inventing one borrows a reputation the client does not have.",
   fix: "Use the official marks of real customers with permission, or remove the wall and the 'Trusted by' line together.",
   sources: ["INT-103 (hallmark §121 §238, taste §615, huashu §60)", "INT-119 (hallmark §121 §134, huashu §36, uupm §241)", "INT-137 (hallmark §354-355, taste §44)"]}
- {id: INT-011, title: "Figures carry their unit, baseline and precision", domain: D18, tier: Reflex, check: H, remedy: fix-copy, tests: [T-FIGURE-AUDIT],
   rule: "Give every claimed figure its unit and its source, or make plain that it is the brand's own measurement. Name the baseline and the window of any comparison ('3x faster than X on Y'). Match the precision of the source: no uncited decimals, no round '10,000+' standing in for a count, no derived figure presented alone as a headline. A bare big number leads only when the page is built around it. Invented figures are INT-001's and unsourced stat bands INT-007's: cite those sweep hits, do not repeat them.",
   why: "A number with no unit, baseline or source cannot be checked, so careful readers discount it and the rest of the page with it.",
   fix: "Add the unit, the baseline and the source in the sentence the figure proves, or cut the figure.",
   sources: ["INT-107 (hallmark §362)", "INT-108 (kami §225 §233 §299)", "INT-109 (kami §299)", "INT-110 (kami §227 §299)", "INT-106 (taste §40, hallmark §362, huashu §60)"]}
- {id: INT-012, title: No invented specifics or origin stories, domain: D18, tier: Reflex, check: J, remedy: fix-copy, tests: [T-FILLER, T-PROOF-SWAP],
   rule: "Do not dress copy in invented detail to look authentic: an exact time and room, a batch number, an uneven percentage with no source, or the origin template ('In [year], [two names] found [an old shop]'). Tell a founding story only when the client supplied it; otherwise drop the story section.",
   why: "Invented specifics imitate the texture of a true story; a reader who checks one finds nothing and stops trusting the page.",
   fix: "Use the client's own story and facts, or cut the section.",
   sources: ["INT-105 (taste §43 §49)", "INT-117 (kami §225, huashu §9)"]}
- {id: INT-013, title: Product pictures show the product and sample data reads as sample, domain: D18, tier: Reflex, kind: context, check: J, remedy: fix-copy, tests: [T-STAGED-UI],
   rule: "A product shot, dashboard or interface fragment shows the real product, or a plainly simplified illustration of it (conflict C48). Numbers inside it read as sample data: plausible, uneven, and never repeated elsewhere on the page as results. A staged dashboard of round growth figures, a 'live' panel whose counters are scripted, or a redrawn screenshot passed off as real presents invented results as the product's (conflict C22). Future capability is drawn at a lower weight than shipped capability.",
   why: "Visitors read a product picture as what they will get; staged numbers inside it are a claim the client cannot back.",
   fix: "Capture the real product with real or obviously sample data, or draw a simplified illustration with no result figures.",
   sources: ["INT-113 (huashu §60, hallmark §110, taste §27)", "INT-123 (kami §1642-area, hallmark §115)", "INT-122 (kami §229)", "INT-114 (kami §453)"]}
- {id: INT-014, title: "No prompt, model or template leakage", domain: D18, tier: Floor, check: H, remedy: fix-copy, waivable_by: never, tests: [T-LEAKAGE],
   rule: "No text the model or the template left behind reaches the visitor: chatbot voice ('As an AI', 'Here is a revised version:'), a pasted conversation, image-brief or prompt text in copy, captions or alt text ('21:9 ultra-wide screenshot with a quiet background'), raw markdown, template tokens and bracket slots. Residue the sweep matches (lorem ipsum, TODO, '[insert') is INT-005's; this card covers what the lexicons cannot match. Code samples and documentation that show markup on purpose are not leakage.",
   why: "Leaked instructions show the visitor that nobody read the page before it shipped, and can expose the brief.",
   fix: "Replace the leaked text with the content it was meant to produce, or a visible [DATA NEEDED] slot.",
   sources: ["INT-132 (taste §39)", "INT-133 (kami §304)", "INT-131 (taste §39, kami §654)", "INT-130 (taste §39, hallmark §357, huashu §71, kami §654, uupm §104)", "INT-138 (hallmark §494, kami §654 §3659-area)"]}
- {id: INT-015, title: Samples are not self-labelled and contact details are real, domain: D18, tier: Reflex, check: H, remedy: fix-copy, tests: [T-LEAKAGE],
   rule: "Do not label content as a stand-in in visible copy ('(sample)', 'sample data', 'illustrative', 'names and figures are examples', 'your screenshot here'): either it is real, or it is a plain [DATA NEEDED] slot in a draft (conflicts C21, C22). Print a phone, email, address, domain or social handle only when it is the client's: no example.com addresses shown as real, no 555-01xx, repeated-digit or 1234567 numbers, no invented streets or register numbers.",
   why: "A self-labelled sample admits the page is not finished; a fake phone number or address sends a real visitor nowhere.",
   fix: "Replace samples with real content or a slot, and print only contact details the client supplied.",
   sources: ["INT-134 (taste §24 §34 §39, hallmark §1729-area)", "INT-135 (taste §2 §39 §613 §617 §619)", "INT-150 (taste §619)"]}
- {id: INT-016, title: Promised evidence exists, domain: D18, tier: Reflex, check: H, remedy: fix-harden, tests: [T-PROMISE-LINK],
   rule: "Every 'Read the case study', 'See all reviews', 'View the report' and every link that stands behind a claim goes somewhere real. A bare '#', an empty href or a 'Coming soon' frame in place of a claim's evidence is a finding. 'Coming soon' is allowed only for what the client states is coming, with what and when.",
   why: "A link that promises proof and goes nowhere tells the visitor the proof does not exist.",
   fix: "Link the real page, point the link at the on-page section that holds the evidence, or remove the claim and its link.",
   sources: ["INT-146 (hallmark §120, taste §23 §39, kami §1705-area)", "INT-142 (taste §23 §39)", "INT-145 (hallmark §120)"]}
- {id: INT-017, title: Urgency and scarcity are real, domain: D18, tier: Floor, check: H, remedy: fix-harden, waivable_by: never, tests: [T-URGENCY-REAL],
   rule: "Show a countdown, deadline, stock count, 'X people viewing', 'only N left' or waitlist count only when it is true: a real deadline stated as a date and time in text, a count from live data with its date. A timer that resets on reload or reads differently between captures of the same moment, an evergreen 'limited time', invented viewers and 'last chance' pressure with no deadline are deceptive (conflict C37: integrity wins over conversion advice). A clock showing the current time is not urgency.",
   why: "Fake urgency pushes a visitor into a choice they would not make with the truth in front of them.",
   fix: "State the real deadline or stock as text with its source, or remove the pressure element.",
   sources: ["INT-164 (adp §142, uupm §204-area)", "INT-165 (adp §64 §143, uupm landing)", "INT-162 (adp Part 7 preamble §119-197)", "INT-169 (adp §63)"]}
- {id: INT-018, title: No preselected consent or business-favouring defaults, domain: D18, tier: Floor, check: H, remedy: fix-harden, waivable_by: never, tests: [T-DEFAULT-STATE],
   rule: "Never preselect consent, newsletter, marketing, data-sharing, cost-bearing or access-widening options. A default is what a well-informed visitor would choose for themselves. Ask for a permission when the visitor reaches for the feature, with the narrowest scope.",
   why: "A pre-ticked box takes a decision the visitor did not make; in many jurisdictions it is not valid consent.",
   fix: "Leave every consent and cost option unticked and explain what each one does next to it.",
   sources: ["INT-163 (adp §20 §21-area §119)", "INT-180 (adp §40 §43 §34-area)", "INT-184 (adp §175 §177 §189)"]}
- {id: INT-019, title: No hidden or fake prices, domain: D18, tier: Floor, check: H, remedy: fix-copy, waivable_by: never, tests: [T-PRICE-WHOLE],
   rule: "State the price a visitor will pay where they decide: the recurring term, what a trial turns into (amount and date), and fees known in advance. No cost revealed only at a later step, no 'was' price that was never charged, no decoy plan, no asterisk whose terms appear nowhere on the page. With no price supplied, write 'Price on request' rather than invent one.",
   why: "A price that grows after the decision, or a discount from a price nobody paid, is a false statement about cost.",
   fix: "Show the full price and its terms beside the action, and remove anchors and footnotes that cannot be resolved on the page.",
   sources: ["INT-170 (adp §62 §131 §137 §173)", "INT-171 (adp §123 §169)", "INT-179 (adp §164 §170 §171)", "INT-168 (adp §61 §64)", "INT-149 (taste §613-614)"]}
- {id: INT-020, title: Declining is plain and equal, domain: D18, tier: Reflex, check: J, remedy: fix-copy, tests: [T-DECLINE-READ],
   rule: "Offer the decline, close, skip or cancel option in plain words at a weight the visitor can find. No confirmshaming ('No thanks, I prefer paying full price'), no guilt or fear framing, no decline option greyed out or hidden to steer the choice, and no screen disguised as a system dialog.",
   why: "Shaming or hiding the way out pressures visitors into a choice and makes the brand feel hostile.",
   fix: "Word the decline neutrally ('No thanks') and give it a visible, ordinary control.",
   sources: ["INT-172 (adp §43 §165)", "INT-175 (adp §127 §159 §180)"]}
- {id: INT-021, title: Leaving is as easy as joining, domain: D18, tier: Reflex, kind: context, check: H, remedy: fix-harden, tests: [T-DECLINE-READ],
   rule: "Cancellation, unsubscribe and exits sit where users look and are named plainly: one optional reason, offers beside the exit button and never in front of it, data export offered, no threat of loss. Onboarding tours and gates show Skip and Back on every step, and the first experience of value is not gated. Judge only what the capture shows.",
   why: "A hard exit (a roach motel) traps people who already decided to leave and turns them into complainers.",
   fix: "Put cancel and unsubscribe one step from the account page, with plain labels and export.",
   sources: ["INT-166 (adp §65 §124)", "INT-167 (adp §124 §126)", "INT-182 (uupm §108, adp §163)", "INT-181 (adp §35 §61)"]}
- {id: INT-022, title: Labels of standing are earned, domain: D18, tier: Reflex, check: H, remedy: fix-copy, tests: [T-PROOF-SOURCE],
   rule: "Use 'Most popular', 'Best value', '#1', 'industry-leading', 'award-winning', certification and compliance badges (SOC 2, ISO 27001, HIPAA, GDPR) and green or ethical claims only when true and backed: one 'Most popular' on the plan that is, a ranking or award with its name and year, a certification the company holds and can show. Use 'latest' and version claims only with an as-of date.",
   why: "Unearned badges read as decoration at best and as false claims at worst, and they cheapen the real ones.",
   fix: "Keep the badges the client can show and name their source; cut the rest.",
   sources: ["INT-186 (adp §187, taste §43, hallmark §97)", "INT-115 (kami §226 §302)", "INT-185 (adp §197)"]}
- {id: INT-023, title: Dates are current and true, domain: D18, tier: Finish, check: H, remedy: fix-copy, tests: [T-FIGURE-AUDIT],
   rule: "A copyright year more than a year behind the capture date, or a 'Since' or 'Est.' year that is not the business's real founding year (or repeats as a motif), is a finding.",
   why: "A stale year tells the visitor the page is unattended; an invented founding year is invented history.",
   fix: "Update the year, or remove the 'Since' line unless the client supplied it.",
   sources: ["INT-141 (taste §40 §43 §46)"]}
# ---------------- D10 accessibility ----------------
- {id: INT-008, title: Feedback never outruns the truth, domain: D18, tier: Floor, check: M, remedy: fix-harden, waivable_by: never,
   rule: "An action shows success only after the request it made has succeeded: never while it is still pending, never after it failed, and never when no request was made and nothing else changed. Measured by the async_state detector.",
   why: "A success message the page did not earn is a false claim; the user stops checking and loses work.",
   fix: "Show success from the server's answer and echo the result; on failure keep the input and show what went wrong with a way to retry.",
   sources: ["CMP-110 / CMP-212 (HM §93 §311, ADP §55)", "ux-ui-agent-skills critic answer key: async-lies (Composition 6)", "hallmark §364 §510"]}
- {id: A11-001, title: Text contrast on real pixels, domain: D10, tier: Floor, detector: contrast, remedy: fix-a11y, waivable_by: never, tests: [T-GRADIENT-STOPS],
   rule: "Body text at least 4.5:1 and large text at least 3:1 against the worst sampled background pixel (WCAG 2.2 1.4.3). APCA reported as advisory.",
   why: "Low contrast excludes low-vision readers and everyone in sunlight.", fix: "Darken text or lighten ground; never thin weights on tinted ground.",
   sources: ["web-interface-guidelines", "hallmark §411 §454", "WCAG 2.2 1.4.3"]}
- {id: A11-002, title: Text size floors, domain: D10, tier: Floor, detector: text_floor, remedy: fix-typeset, waivable_by: never,
   rule: "Running text (28+ characters) is at least the medium's body floor (web 16px, dense UI 14px); labels at least 12px.",
   why: "Small text fails readers before any other check.", fix: "Raise to the floor; cut words rather than shrink.", sources: ["huashu §66", "hallmark §52", "ui-ux-pro-max §43"]}
- {id: A11-003, title: Visible focus everywhere, domain: D10, tier: Floor, detector: focus_ring, remedy: fix-a11y, waivable_by: never, tests: [T-TAB-THROUGH],
   rule: "Every focusable element shows a focus indicator at 3:1 or better, never hidden under a sticky header, never removed without replacement.",
   why: "Keyboard users cannot see where they are.", fix: "Use :focus-visible with a 2px ring offset 2px in a contrasting colour.", sources: ["web-interface-guidelines", "hallmark §455", "WCAG 2.2 2.4.7 2.4.11"]}
- {id: A11-004, title: Target size, domain: D10, tier: Floor, detector: targets, remedy: fix-a11y,
   rule: "Interactive targets are at least 24x24px (Floor, WCAG 2.5.8); on touch, at least 44x44px (Reflex).", why: "Small targets cause mis-taps and exclude motor-impaired users.",
   fix: "Enlarge the hit area with padding or a pseudo-element.", sources: ["WCAG 2.2 2.5.8", "hallmark §87", "ui-ux-pro-max §22"]}
- {id: A11-005, title: Images have text alternatives, domain: D10, tier: Floor, detector: img_alt, remedy: fix-a11y, waivable_by: never,
   rule: "Every img has an alt attribute: descriptive for content images, empty for decorative ones.", why: "Screen readers announce file names otherwise.",
   fix: "Write what the image tells the reader, or alt=\"\" if it tells nothing.", sources: ["web-interface-guidelines", "WCAG 2.2 1.1.1"]}
- {id: A11-006, title: Controls have accessible names, domain: D10, tier: Floor, detector: control_names, remedy: fix-a11y, waivable_by: never,
   rule: "Every button, link and form control has an accessible name; icon-only buttons have aria-label.", why: "Unnamed controls are announced as 'button'.",
   fix: "Add visible text or aria-label.", sources: ["web-interface-guidelines", "ui-ux-pro-max §46", "WCAG 2.2 4.1.2"]}
- {id: A11-007, title: Headings and landmarks, domain: D10, tier: Reflex, detector: headings_landmarks, remedy: fix-a11y,
   rule: "One h1; heading levels step one at a time; main, nav and footer landmarks present; a skip link first.", why: "Structure is how screen-reader users navigate.",
   fix: "Fix levels in markup and size with CSS.", sources: ["hallmark §132 §406", "ui-ux-pro-max §43", "taste-skill §631"]}
- {id: A11-008, title: Language and title set, domain: D10, tier: Floor, detector: lang_and_title, remedy: fix-a11y, waivable_by: never,
   rule: "html has a lang attribute and the page has a title in its own words.", why: "Wrong pronunciation and unlabeled tabs.", fix: "Add lang and a specific title.",
   sources: ["hallmark §132 §477", "WCAG 2.2 3.1.1 2.4.2"]}
- {id: A11-009, title: Zoom never blocked, domain: D10, tier: Floor, detector: zoom_blocked, remedy: fix-a11y, waivable_by: never,
   rule: "The viewport meta must not set user-scalable=no or maximum-scale below 2.", why: "Blocks low-vision users from zooming.", fix: "Remove the restriction.",
   sources: ["ui-ux-pro-max §42", "web-interface-guidelines"]}
- {id: A11-010, title: Form fields have labels, domain: D10, tier: Floor, detector: form_labels, remedy: fix-a11y, waivable_by: never,
   rule: "Every input has a programmatic label; placeholder is never the only label; autocomplete set on personal fields.", why: "Placeholders vanish on typing and are not announced reliably.",
   fix: "Add a visible label element.", sources: ["web-interface-guidelines", "ui-ux-pro-max §60", "WCAG 2.2 1.3.1 3.3.2"]}
- {id: A11-011, title: Reduced motion respected, domain: D10, tier: Floor, detector: reduced_motion, remedy: fix-motion, waivable_by: never,
   rule: "When animations exist, a prefers-reduced-motion rule removes movement (opacity and colour changes up to 150ms may stay).",
   why: "Motion can trigger vestibular disorders.", fix: "Wrap movement in @media (prefers-reduced-motion: no-preference) or add a reduce override.",
   sources: ["hallmark §330", "agent-skills", "WCAG 2.2 2.3.3"]}

# ---------------- D15 robustness, D09 motion, web ----------------
- {id: ROB-001, title: Content never depends on animation to appear, domain: D15, tier: Floor, detector: hidden_content, remedy: fix-harden, waivable_by: never, tests: [T-HIDDEN-CONTENT],
   rule: "All content is visible with reduced motion, with an observer that never fires, and with scripts off; under 30% of text hidden after load.",
   why: "Reveal-on-scroll pages are blank for crawlers, print, reduced motion and slow devices.", fix: "Start visible; animate from visible.", sources: ["taste-skill §437", "hallmark §445"]}
- {id: ROB-002, title: Phone parity, domain: D15, tier: Reflex, detector: phone_parity, remedy: fix-layout, tests: [T-PHONE-PARITY],
   rule: "Do not hide 40 or more words at 375px that are shown at 1440px.", why: "Phone visitors get a lesser page.", fix: "Reflow instead of hiding.", sources: ["hallmark §435"]}
- {id: ROB-003, title: No horizontal overflow, domain: D15, tier: Floor, detector: overflow, remedy: fix-harden, waivable_by: never,
   rule: "No sideways scroll and no element wider than the viewport at any tested width.", why: "Sideways scroll breaks reading and zoom.",
   fix: "Find the overflowing element; use min-width: 0, overflow-wrap, and avoid 100vw.", sources: ["hallmark §452", "taste-skill §641"]}
- {id: ROB-004, title: No widows in headings and short paragraphs, domain: D15, tier: Finish, detector: widows, remedy: fix-polish,
   rule: "No single-word last line, and no last line under 35% of the measure, in headings and short paragraphs at 375 and 1280.", why: "Stubs look unfinished.",
   fix: "text-wrap: balance on headings, pretty on paragraphs (Latin only).", sources: ["hallmark §401", "kami §168"]}
- {id: MOT-001, title: Motion CSS hygiene, domain: D09, tier: Reflex, detector: motion_css, remedy: fix-motion,
   rule: "No transition: all; animate transform and opacity, not layout properties; no overshoot past 1.05 in UI; exits 60 to 75% of enters.",
   why: "These produce jank, layout thrash and toy-like motion.", fix: "List properties; use transform; one non-overshoot curve.", sources: ["hallmark §323 §327", "transitions-dev", "agent-skills §1"]}
- {id: MOT-002, title: Transitions measured from frames stay short and direct, domain: D09, tier: Reflex, detector: motion, remedy: fix-motion,
   rule: "Each triggered transition (dialog, menu, tab, disclosure) ends within its kind's limit, enters from at least 0.90 scale and at most 16px away, never passes its end state by more than 1.05, does not use the default ease, and does not push other content while it runs. With reduced motion nothing moves (cited as A11-011).",
   why: "Measured in the browser, these are what make motion read as off-the-shelf: slow, popping from far, drifting, bouncing or dragging the page with it.",
   fix: "Use one tuned curve such as cubic-bezier(0.22, 1, 0.36, 1); start overlays at 0.96-0.97 scale and 6-8px; keep menus near 200ms and dialogs near 250ms; animate transform and opacity only; drop movement under prefers-reduced-motion.",
   sources: ["transitions-dev tokens and generic demo (example.html)", "hallmark §82 §95 §323 §327 §329 §330", "uupm §14 §156 §168 §237", "huashu §337 §349", "agent §28 §78"]}
- {id: MOT-003, title: Movement lands where it ends, domain: D09, tier: Finish, detector: motion_snap, remedy: fix-motion,
   rule: "Recorded in real time after a click, no element glides and then jumps more than 3 px in one frame to its end state, and no content is shoved in one frame while another element is still animating. Instant changes are not judged.",
   why: "A movement that stops short and snaps, or a neighbour that jumps while a panel glides, reads as broken motion: the eye follows the glide and sees the cut.",
   fix: "Tween or spring to the true final layout; when content around an animating element must move, animate its container with the same transition or reserve the space first.",
   sources: ["Stageshow references/motion.md (Things that appear, travel and leave) and scripts/jumps-core.mjs (benjitaylor/skills, MIT)", "Stageshow references/teaching.md (Landing jumps at handoff; New row shoves its neighbors)"]}
# ---------------- D09 motion (lens-motion; judgment and hybrid cards, no detector) ----------------
# Promoted from the mined drafts in rules/D09-MOT.yaml; each source cites the draft id and its original sections.
# Motion findings are Reflex or Finish. Reduced motion (A11-011, the `reduced_motion` check), content hidden behind
# animation (ROB-001), pause controls on motion past 5 s (WCAG 2.2.2) and missing or stuck progress (CMP-001) stay with
# the sweep and lens-a11y. Scope follows the conflict register: product UI keeps the UI scale (C15, C38, C39, C50, C51);
# a showpiece, a product illustration or a demo animation may run longer storytelling motion (C45).
- {id: MOT-004, title: Every motion has a job, domain: D09, tier: Reflex, check: J, remedy: fix-motion, tests: [T-PURPOSE],
   rule: "Name the job of each animation: feedback (the input was received), orientation (where something came from or went), continuity (the same thing in a new state) or a deliberate showpiece the visitor chose to watch. Motion whose loss would go unnoticed if the change were instant has no job; static is the default answer.",
   why: "Motion with no job costs the visitor time on every use and says the page was assembled from a kit that animates everything.",
   fix: "Cut the motion that has no job, or make the change instant; keep the motion that explains a change.",
   sources: ["MOT-101 (agent §1, hallmark §323, taste §408, huashu §324)", "MOT-102 (hallmark §323 §84)"]}
- {id: MOT-005, title: Duration follows how often the motion is seen, domain: D09, tier: Reflex, kind: context, check: H, remedy: fix-motion, tests: [T-FREQUENCY],
   rule: "Time each motion by how often a visitor sees it and what triggered it. Feedback on a control used many times (a tab, a menu, a toggle, a disclosure, a copy button) stays on the product's short scale: press and toggle 100 to 200ms, menus near 200ms, overlays up to about 420ms, and never linear on movement. A long arrival is allowed only for a showpiece the visitor started or sees once (a hero reveal, a shuffle the visitor asks for, a demo), and never on a control's own feedback. A sweep `duration`, `easing`, `travel` or `overshoot` hit on a showpiece is fitting; on repeated feedback it stands (conflict C52).",
   values: {toggle_ms: [100, 200], menu_ms: 200, overlay_max_ms: 420, showpiece_ms: [800, 1000]},
   why: "A 750ms tab switch is pleasant once and a tax on the twentieth click; the same length on a one-time reveal is a choice.",
   fix: "Put repeated feedback on the short scale; keep the long timing only on the moment the visitor sees once.",
   sources: ["MOT-126 (uupm §8 §237)", "MOT-127 (agent §78, huashu §337)", "MOT-128 (uupm §143)", "MOT-125 (hallmark §83 §324 §438)", "MOT-250 (stageshow §48)"]}
- {id: MOT-006, title: Motion has a budget per page, domain: D09, tier: Reflex, kind: cap, check: H, remedy: fix-motion, tests: [T-MOTION-BUDGET],
   rule: "Keep a page to about three motion primitives (one reveal, one hover signal, one functional loop) and one or two moving things per view. Do not give every block the same fade-up, and do not run two self-moving things in one screen.",
   values: {max_primitives: 3, max_per_view: 2, max_self_moving_per_screen: 1},
   why: "When everything moves, nothing points anywhere, and the same entrance on every block is the clearest sign that motion was applied, not designed.",
   fix: "Pick the one moment that earns motion; make the rest still or quieter.",
   sources: ["MOT-103 (hallmark §323, taste §407 §441)", "MOT-104 (uupm §7 §237)", "MOT-105 (taste §33, huashu §364 §324)", "MOT-106 (taste §431 §428)"]}
- {id: MOT-007, title: One curve family and one duration scale, domain: D09, tier: Finish, check: H, remedy: fix-motion, tests: [T-MOTION-SYSTEM],
   rule: "Route durations and easings through one declared set: one non-overshoot curve family for UI (conflict C38) and one three-step duration scale (conflict C39). Raw framework defaults on every element (the browser's `ease`, Tailwind's 150ms cubic-bezier(0.4, 0, 0.2, 1)) and several unrelated curves for the same kind of change show that nobody set the motion.",
   values: {scale_steps: 3, curve_families: 1},
   why: "Motion tuned as a system feels like one product; a mix of defaults feels like several libraries joined.",
   fix: "Declare motion tokens (micro, short, long; enter, exit, move) and replace raw values with them.",
   sources: ["MOT-124 (hallmark §438, uupm §8 §237)", "MOT-125 (hallmark §83 §324 §438)", "MOT-111 (hallmark §340)"]}
- {id: MOT-008, title: The curve fits the direction and the scope, domain: D09, tier: Finish, check: H, remedy: fix-motion, tests: [T-MOTION-SYSTEM],
   rule: "Ease out on arrival, ease in on exit, ease in and out on travel and toggles, and linear only for progress, spinners, loops and scroll scrubbing. Overshoot and springs belong to showpieces, demo films and declared playful moments, never to UI state (conflict C15).",
   why: "An arrival that starts slowly feels late, an exit that lingers blocks the next action, and a bounce on a menu reads as a toy.",
   fix: "Use a decelerating curve such as cubic-bezier(0.16, 1, 0.3, 1) for arrivals and a short ease-in for exits.",
   sources: ["MOT-129 (hallmark §82 §342, uupm §14 §237, agent §80, huashu §335)", "MOT-130 (hallmark §438, huashu §332)", "MOT-131 (hallmark §82 §324 §438, taste §410 §443, uupm §160)"]}
- {id: MOT-009, title: Exits are quicker than entrances and leave no gap, domain: D09, tier: Finish, check: H, remedy: fix-motion, tests: [T-ENTER-EXIT],
   rule: "Pair every enter with an exit (or an explicit none), make the exit 60 to 75% of the enter, and never leave a blank frame of more than 0.3s between outgoing and incoming content.",
   values: {exit_ratio: [0.6, 0.75], max_blank_s: 0.3},
   why: "A view that vanishes in one frame after a long entrance feels broken; a blank pause between views reads as a crash.",
   fix: "Add the matching exit at about two thirds of the enter, and overlap or cross-fade the two states.",
   sources: ["MOT-135 (hallmark §83 §324, uupm §237 §162, agent §79)", "MOT-137 (agent §51, stageshow §50)", "MOT-138 (huashu §377, stageshow §50)"]}
- {id: MOT-010, title: The kind of transition matches what changed, domain: D09, tier: Reflex, check: J, remedy: fix-motion, tests: [T-SPATIAL-MEANING],
   rule: "A shared-element morph means the same thing, deeper; a directional slide means an ordered sequence or a step in a hierarchy; a cross-fade means a lateral swap; an overlay grows from its trigger. Do not slide tabs or unordered views sideways, and keep next from the right and previous from the left (mirrored for right-to-left).",
   why: "Motion tells the visitor where things live. A slide between peers invents a hierarchy that is not there.",
   fix: "Cross-fade lateral swaps, slide only ordered steps, and open overlays from the control that opened them.",
   sources: ["MOT-165 (agent §3 §7-§14)", "MOT-166 (agent §8 §49)", "MOT-167 (agent §49, uupm §237 §364)", "MOT-141 (uupm §237, hallmark §329)"]}
- {id: MOT-011, title: Staggers are short and in reading order, domain: D09, tier: Reflex, kind: cap, check: H, remedy: fix-motion, tests: [T-CHOREOGRAPHY],
   rule: "Stagger at most about 8 items, 30 to 50ms between rows and 60 to 100ms between blocks, 500ms in all, in reading order and once (conflict C50: a demo or a bento grid scrolling in once may use 40 to 80ms in a scene and 80 to 120ms between tiles). Never stagger results on filtering or search.",
   values: {max_items: 8, row_ms: [30, 50], block_ms: [60, 100], max_total_ms: 500},
   why: "A long cascade makes the visitor wait for the last item; a cascade on every filter keystroke turns a fast tool into a slow show.",
   fix: "Cap the cascade, shorten the step, and show filtered results at once.",
   sources: ["MOT-142 (hallmark §83, uupm §237, huashu §342 §349)", "MOT-143 (uupm §157 §159, hallmark §330)", "MOT-144 (hallmark §338, agent §43)", "MOT-252 (stageshow §43 §48)"]}
- {id: MOT-012, title: The page arrives once and is never gated, domain: D09, tier: Reflex, check: H, remedy: fix-motion, tests: [T-CHOREOGRAPHY],
   rule: "Allow at most one page-load reveal, in DOM order, once, with the content readable without it (conflict C16). Do not give every section heading its own rise, do not fade in the hero picture, and do not put a loader, intro or delay before reading. Content hidden until an animation runs is ROB-001's (Floor) and stays with the sweep.",
   values: {max_load_reveals: 1, total_s: [0.4, 0.8]},
   why: "Rising headings on every section and a hero that fades in from nothing are the stock entrance of generated pages, and they make the visitor wait to read.",
   fix: "Keep one short entrance for the hero, or none, and let every other section sit still.",
   sources: ["MOT-148 (hallmark §84 §339, taste §427 §33)", "MOT-149 (taste §33 §459 §427)", "MOT-150 (taste §427)", "MOT-108 (taste §427 §33)"]}
- {id: MOT-013, title: Hover answers with one small signal, domain: D09, tier: Reflex, check: H, remedy: fix-motion, tests: [T-HOVER-SIGNAL],
   rule: "Give each linked element one hover signal on its container (a colour step, a 1 to 2px lift or a border step) within about 150ms. Do not put the same lift or scale on every card, and do not tilt, skew, glow, sweep a shine, follow the cursor or pull a magnetic button. Never give a non-interactive element a hover state.",
   values: {lift_px: [1, 2], max_lift_px: 6, hover_ms: 150},
   why: "Tilt, glow and magnetic pulls are generator flourishes; a uniform card lift tells the visitor nothing about which card matters.",
   fix: "Keep one quiet hover signal per interactive element and drop the decorative ones.",
   sources: ["MOT-183 (hallmark §85 §311 §440, taste §414)", "MOT-185 (hallmark §440)", "MOT-187 (taste §413 §420 §33, hallmark §87 §459)", "MOT-188 (taste §412 §414, uupm §153)", "MOT-184 (hallmark §85 §440, taste §414 §420, uupm §33)"]}
- {id: MOT-014, title: Loops show a state or real data, domain: D09, tier: Reflex, check: H, remedy: fix-motion, tests: [T-LOOPS],
   rule: "Run an infinite loop only for a loader, one small loop or one declared ambient loop. Ban decorative attention loops: pulsing dots, twinkling, flicker, hue cycling, scrambled text, typing dots, a blinking caret after a headline, and marquees of logos or claims with nothing to show. A loop past 5s with no pause control is WCAG 2.2.2 and stays with lens-a11y.",
   values: {small_loop_max_s: 4, ambient_min_s: 8, max_loops_per_screen: 1},
   why: "A pulse or shimmer that shows no state pulls the eye away from the content for nothing, every second the page is open.",
   fix: "Stop the decorative loops; keep a loop only where it shows progress, a live state or real data.",
   sources: ["MOT-219 (hallmark §87, taste §33 §429, stageshow §48)", "MOT-215 (hallmark §87, uupm §12 §145, taste §428)", "MOT-106 (taste §431 §428)"]}
- {id: MOT-015, title: A change moves only what changed, domain: D09, tier: Finish, check: H, remedy: fix-motion, tests: [T-CONTINUITY],
   rule: "Where a surface animates, its content changes with it: no label, menu or number swapped in one frame while the surface glides; the changed span moves and what follows makes room continuously. In product UI a one-time reflow is fine (conflict C51); content shoved in one frame while another element is mid-animation is MOT-003's and stays with the sweep.",
   why: "A glide with a hard cut inside it draws the eye to the cut; motion that half-explains a change is worse than none.",
   fix: "Animate the changed span with its container, or make the whole change instant.",
   sources: ["MOT-253 (stageshow §49 §56)", "MOT-254 (stageshow §49)", "MOT-255 (stageshow §49 §50)", "MOT-256 (stageshow §49 §56)"]}
- {id: MOT-016, title: Solid surfaces arrive whole and hold their anchor, domain: D09, tier: Finish, check: H, remedy: fix-motion, tests: [T-CONTINUITY],
   rule: "Windows, cards, sheets and toasts arrive by moving, opaque or nearly, never as a half-transparent ghost and never uncovered by a hard moving edge that slices text. A popover or menu fits before its first frame and holds the edge it opened from while its content changes; a resizing surface moves size, position and content as one transition without stretching its text.",
   why: "Ghosted solids and sliced text break the illusion that the surface is one object, which is the whole point of animating it.",
   fix: "Animate the surface with transform from just off its resting place, keep it opaque, and size it before it opens.",
   sources: ["MOT-259 (stageshow §50)", "MOT-260 (stageshow §50 §56)", "MOT-261 (stageshow §50)", "MOT-262 (stageshow §50 §56)"]}
- {id: MOT-017, title: A demo animation builds to one payoff, domain: D09, tier: Finish, kind: context, check: J, remedy: fix-motion, tests: [T-POSTER],
   rule: "In a product illustration or demo animation, tell three to five beats that build to one payoff, show the payoff full at the shown size and hold it (about 2s) before the exit, and choose a poster frame (the still for thumbnails and reduced motion) with the result on screen. A second scene adds something new or is cut. UI feedback inside the demo keeps the product's own speed; only storytelling motion slows down (conflict C45).",
   values: {beats: [3, 5], payoff_hold_s: 2, max_still_s: 3},
   why: "A demo that moves without a payoff shows activity, not the product; the poster frame is what most visitors actually see.",
   fix: "Cut beats until one result carries the story, then hold it and make it the poster frame.",
   sources: ["MOT-241 (stageshow §45)", "MOT-242 (stageshow §46)", "MOT-243 (stageshow §46 §47)", "MOT-248 (stageshow §47)", "MOT-250 (stageshow §48)"]}
- {id: MOT-018, title: A demo loop resets with a cause, domain: D09, tier: Finish, kind: context, check: H, remedy: fix-motion, tests: [T-DEMO-LOOP],
   rule: "In a looping demo, give every reset a seen cause (undo, clear, close) or make it invisible, remove what the loop added as one thing, never rewind data or a navigation in view, and leave no dead air at the seam: the next action starts within about 1s of the exit, from a calm, complete frame.",
   values: {seam_max_s: 1},
   why: "A loop that visibly rewinds or sits empty at the seam shows the machinery and loses the story it just told.",
   fix: "Reset while hidden or through a seen action, and start the next loop on a calm, complete frame.",
   sources: ["MOT-245 (stageshow §47)", "MOT-246 (stageshow §47)", "MOT-247 (stageshow §47)", "MOT-220 (taste §428, stageshow §45 §47)"]}
- {id: WEB-001, title: Performance budget, domain: D15, tier: Reflex, detector: performance, remedy: fix-harden,
   rule: "Lab LCP warns at 2.5s and fails at 4.5s; no image over 400KB or more than 2x its rendered width.", why: "Slow pages lose visitors before design matters.",
   fix: "Compress, size and lazy-load images; preload the LCP asset.", sources: ["taste-skill §622", "agent-skills", "web-interface-guidelines"]}

# ---------------- D08 components ----------------
- {id: CMP-001, title: Async actions show that they are working, domain: D08, tier: Reflex, detector: async_state, remedy: fix-harden,
   rule: "While a request runs the clicked action visibly changes within 0.5 to 2 s (busy label, spinner, aria-busy, progress), and every progress state ends when the request ends. False success is cited as INT-008.",
   why: "With no feedback people click again and send twice; a spinner that never stops reads as a crash.",
   fix: "Keep the label and add an inline spinner and aria-busy=\"true\" after ~150 ms; clear both when the answer arrives, success or failure.",
   sources: ["CMP-108 (HM §311, UX §328)", "MOT-200 (hallmark §311)", "A11-160 (uupm §95 §328)"]}
# lens-components: judgment and hybrid cards, no detector. Promoted from the mined drafts in rules/D08-CMP.yaml; each
# source cites the draft id and its original sections. Component findings are Reflex or Finish: focus visibility,
# target size, names, labels, keyboard operation and pause controls stay Floor with the sweep and lens-a11y (A11-003,
# A11-004, A11-006, A11-010), and false success after an action is INT-008. A kit component used as it ships is not
# a finding; a state, label or exit it lacks is.
- {id: CMP-002, title: Every state a control can reach is designed, domain: D08, tier: Reflex, check: H, remedy: fix-harden, tests: [T-STATE-MATRIX],
   rule: "Each control family (buttons, links, fields, choices, tabs, menu items) shows default, hover (inside @media (hover: hover), one signal: a colour step, a 1px lift or a border step), focus-visible, active and, where it can happen, disabled, loading, error and success. Disabled uses more than opacity (cursor, the native disabled or aria-disabled attribute, and 3:1 kept), and a disabled control near the user's attention says why. A stylesheet that declares no hover, active or disabled rule for controls that clearly reach those states, or a capture that shows a press, a disabled button or a busy control looking exactly like its rest state, is a finding. The focus ring itself is A11-003's.",
   why: "A control that looks the same pressed, disabled and at rest leaves people unsure whether it heard them or why it will not work.",
   fix: "Design the missing states for the whole family at once: one hover signal, a pressed step, a disabled look with its reason, and a busy look that keeps the label.",
   sources: ["CMP-101 (HM §91 §311 §142)", "CMP-103 (HM §85 §311, KM §148, UX §232)", "CMP-105 (HM §311 §325, UX §34 §241)", "CMP-106 (HM §92 §311, UX §238 §327)", "CMP-107 (HM §321)", "CMP-113 (UX §242, KM §157)"]}
- {id: CMP-003, title: "Waiting, failure and success belong to the action", domain: D08, tier: Reflex, check: H, remedy: fix-harden, tests: [T-STATE-MATRIX, T-ERROR-PATH],
   rule: "While an action runs it shows progress in place: the label stays readable, the button keeps its width (the slot fits the longest label), a spinner or 'Sending' appears after 150 to 300 ms and stays at least 300 ms, text joins it past 2 s, and the control refuses a second submit only while the request is in flight. When the request fails the user sees what failed and a way to retry, beside the action, with what they typed kept. Success shows the result itself ('The date goes to ana@studio.com'), not only a word. Whether the action responds at all is CMP-001's measurement and a false success is INT-008's: this card judges how the waiting, failing and succeeding states are designed.",
   values: {spinner_after_ms: [150, 300], min_shown_ms: 300, text_after_s: 2},
   why: "The moments after a click are when people decide whether to click again, wait or give up; an undesigned wait or a silent failure loses the task.",
   fix: "Design the pending, failed and done states of each primary action on the same button and in the same place, with a retry on failure and the real result on success.",
   sources: ["CMP-108 (HM §311, UX §328)", "CMP-124 (HM §92 §314, UX §36 §232)", "CMP-208 (HM §95 §321, UX §113 §133 §233)", "CMP-211 (UX §238 §233)", "CMP-269 (stageshow §49)", "CMP-143 (HM §251, TS §67)"]}
- {id: CMP-004, title: One primary action per view, domain: D08, tier: Reflex, check: H, remedy: fix-layout, tests: [T-PRIMARY-COUNT],
   rule: "Each screen and each dialog has one filled primary: the action most visitors take first. Secondaries are outlined or typographic and never louder than the primary; a pair is a filled primary and a quieter action that goes elsewhere. Two filled buttons side by side, three hero actions, a third button style, or a destructive action styled as the primary (unless deleting is the view's one job) is a finding. A nav call to action repeating the hero's primary is the same action, not a second one.",
   values: {max_filled_per_view: 1, max_hero_actions: 2},
   why: "When two actions shout, the visitor has to decide which one the page wants; most take neither.",
   fix: "Keep one filled primary per view, turn the rest into outlined or text actions, and move destructive actions away from it in a danger style.",
   sources: ["CMP-114 (HM §90 §154, TS §63, UX §234)", "CMP-115 (HM §90, TS §63, KM §149)", "CMP-116 (HM §51, KM §149 §267)", "CMP-117 (KM §149 §267, TS §63)", "CMP-122 (HM §90, UX §238)"]}
- {id: CMP-005, title: Controls belong to one family, domain: D08, tier: Finish, check: H, remedy: fix-polish, tests: [T-ONE-FAMILY],
   rule: "Buttons, fields and links share one system: an input matches the height of the button beside it, border width stays constant across states (the focus ring is an outline, not a thicker border), one radius per control size, one link look site-wide, and a filled button keeps its own colour under the pointer (one step of it, never a grey swap). A control hugs its content with an inset on every side; it is never stretched with its label pinned to one end, and its text never touches its edge.",
   why: "Controls that differ by a few pixels and a shade read as assembled from parts, and a border that thickens on focus shifts the layout.",
   fix: "Set control heights, radii, borders and hover steps once as tokens and apply them to every control.",
   sources: ["CMP-138 (HM §92 §315-316)", "CMP-140 (HM §92 §316)", "CMP-127 (KM §152, TS §53)", "CMP-265 (stageshow §13)", "CMP-266 (stageshow §16)", "CMP-267 (stageshow §21)"]}
- {id: CMP-006, title: Every field shows its label and what it needs, domain: D08, tier: Reflex, check: H, remedy: fix-harden, tests: [T-FIELD-READ],
   rule: "Every field has a visible label outside the box, above it (or beside it in a dense app row), that stays while typing. The placeholder shows a format ('01 Jan 2026'), never an instruction or the label. Required or optional is marked in words or an asterisk explained once, never by colour alone. Complex inputs keep a helper line under the field, and related fields are grouped under a legend. A programmatic label missing altogether is A11-010's (Floor); a floating or placeholder-only label is this card's.",
   why: "A label that vanishes on typing, or a field that hides whether it is required, makes people guess and correct after the fact.",
   fix: "Put a persistent label above each field, move instructions into a helper line, mark required or optional in words, and group related fields.",
   sources: ["CMP-129 (HM §314 §326, UX §68 §238)", "CMP-130 (HM §314)", "CMP-136 (HM §314, UX §73)", "CMP-145 (UX §238)"]}
- {id: CMP-007, title: Fields ask for the right input, domain: D08, tier: Reflex, check: H, remedy: fix-harden, tests: [T-FIELD-READ],
   rule: "Each field carries the type, inputmode, autocomplete and name of what it asks for (email, tel, url, a postal code as text with inputmode numeric, a one-time code with autocomplete one-time-code), input text is 16px or more on phones, native controls are used unless a custom one keeps their keyboard and screen-reader behaviour, paste is never blocked and password managers work. A name, address or contact field with no autocomplete, an email typed as text, or a custom select that drops the keyboard is a finding. Email and tel fields without autocomplete are already the sweep's (A11-010, Reflex): cite them.",
   why: "The right type and autocomplete give the phone the right keyboard and let the browser fill the form; a wrong one makes every visitor type by hand.",
   fix: "Set type, inputmode and autocomplete from the field's purpose, keep native controls, and remove any paste block.",
   sources: ["CMP-131 (HM §92, UX §71-72 §77 §238, TS §67)", "CMP-141 (HM §317, UX §234)", "CMP-137 (HM §92, UX §74 §152 §231)"]}
- {id: CMP-008, title: "Errors appear at the field, at the right time", domain: D08, tier: Reflex, check: H, remedy: fix-harden, tests: [T-ERROR-PATH],
   rule: "Validate on blur once a field has been touched, then on every input, with a full check on submit; never on the first keystroke (conflict C06). The error appears under its field, replaces the helper in the same reserved line so nothing jumps, uses the error colour on the border plus text and an icon, and is tied to the field (aria-describedby, aria-invalid). After a failed submit, focus moves to the first invalid field or a linked summary, and everything typed is kept. What the error says is CPY-018's; where and when it appears is this card's.",
   why: "An error far from its field, one that appears while the user is still typing, or a submit that clears the form makes people redo work.",
   fix: "Show each error under its field on blur and on submit, in a reserved line, linked to the field, and keep the user's input after a failed submit.",
   sources: ["CMP-109 (HM §92 §314, UX §69 §238)", "CMP-132 (HM §314 §327, UX §70 §136)", "CMP-133 (HM §314, UX §69 §238)", "CMP-134 (HM §92 §316 §327)", "CMP-135 (HM §92, UX §238, TS §67)"]}
- {id: CMP-009, title: Forms ask only what the task needs, domain: D08, tier: Reflex, check: J, remedy: fix-distill, tests: [T-FIELD-READ],
   rule: "Ask only for fields the next step uses (a booking or contact form in about 6 fields), never the same information twice in one process, and reveal rare options progressively. A multi-step flow shows 'Step N of M', allows Back, and fits each step on a screen; a long form keeps a draft with a visible trace. No modal confirmation stands between a filled form and its submit.",
   values: {short_form_max_fields: 6},
   why: "Every extra field costs completions, and a long form with no sense of progress or saved state is abandoned halfway.",
   fix: "Cut fields to what the next step uses, split long forms into numbered steps with Back, and save drafts.",
   sources: ["CMP-144 (TS §137, UX §78 §201)", "CMP-221 (UX §98 §238, ADP §21 §23)", "CMP-147 (UX §238, ADP §8)", "CMP-149 (TS §22 §137)"]}
- {id: CMP-010, title: Navigation shows where you are, domain: D08, tier: Reflex, check: H, remedy: fix-layout, tests: [T-WHERE-AM-I],
   rule: "On every page past the home page the navigation marks the current section (colour, a soft background or an underline, plus aria-current), tabs mark the selected tab, and a stepper marks the current step. Hierarchies three or more levels deep add breadcrumbs (never on the top page, never as the only navigation). Filters, tabs, pagination and views that change what is shown live in the URL so Back and a shared link return to the same place. Text links keep one weight across states; the current item is never shown as a primary fill.",
   values: {breadcrumbs_from_levels: 3},
   why: "Without a current mark people lose their place, and a view that Back cannot restore makes them rebuild it.",
   fix: "Mark the current item in each nav, tab row and stepper, add breadcrumbs for deep pages, and keep view state in the URL.",
   sources: ["CMP-153 (HM §40, UX §3 §239)", "CMP-164 (ADP §66-67, HM §332)", "CMP-161 (UX §6 §239, ADP §68)", "CMP-163 (HM §145, UX §5 §239)", "CMP-162 (UX §4 §129 §132 §239)"]}
- {id: CMP-011, title: The phone gets the whole navigation, domain: D08, tier: Reflex, check: H, remedy: fix-layout, tests: [T-PHONE-NAV],
   rule: "Under about 60rem, links that no longer fit go behind a real menu button (a button with aria-expanded and a name such as 'Menu'), a tab row scrolls sideways rather than wrapping, and nav labels and button labels never wrap. A bottom tab bar holds 3 to 5 top-level items with icon and label; a sidebar earned by more than about 7 destinations collapses to a menu. A phone width that shows only the logo with no way to reach the other destinations, or a menu holding fewer destinations than the desktop nav without saying where the rest went, is a finding.",
   values: {menu_below_rem: 60, bottom_bar_items: [3, 5], sidebar_min_destinations: 7},
   why: "Most visitors arrive on a phone; a navigation that only works at desktop width hides most of the site from them.",
   fix: "Put the overflow behind a named menu button, keep tab rows on one scrolling line, and carry every top-level destination into the phone menu.",
   sources: ["CMP-154 (HM §40, ADP §209)", "CMP-159 (UX §130 §239)", "CMP-160 (HM §144, UX §239)", "CMP-119 (HM §40 §107, KM §145)"]}
- {id: CMP-012, title: Every navigation item and action goes somewhere, domain: D08, tier: Reflex, check: H, remedy: fix-harden, tests: [T-WHERE-AM-I],
   rule: "Every nav word, button and footer link lands on a real page, anchor or action: never a bare '#', an empty href or a page that does not exist. The logo links home with a name; an explicit Home link exists where users land deep. Dangerous items (delete account, log out) sit apart from ordinary ones, and an unavailable destination says why rather than vanishing. Links behind a claim are INT-016's.",
   why: "A dead link in the navigation tells the visitor the site is unfinished and strands them.",
   fix: "Point every item at its real target or remove it; separate destructive items; explain what is unavailable.",
   sources: ["CMP-157 (TS §95, KM §275)", "CMP-155 (HM §40, ADP §73)", "CMP-167 (UX §239)"]}
- {id: CMP-013, title: Overlays are the last answer and behave as overlays, domain: D08, tier: Reflex, check: H, remedy: fix-harden, tests: [T-OVERLAY-CHECK],
   rule: "Use a dialog only after inline editing and disclosure have been ruled out, never for a primary flow, an error, a success or a warning, and rarely on phones. An open dialog dims the page behind it, holds focus and returns it to its trigger, locks the page scroll, closes on Escape, on a visible close control and (when nothing would be lost) on the backdrop, stays pinned within the viewport (max-height about 80dvh) and puts Cancel before Confirm, with a destructive confirm stating the consequence. A menu or popover flips near the edge and is never clipped by an overflow-hidden parent. Keyboard traps are lens-a11y's (Floor).",
   why: "A dialog takes the whole screen from the user; one that opens for little reason, or that does not close the way overlays close, feels like being trapped.",
   fix: "Replace the dialog with inline content where it can be, and give the remaining ones a scrim, a close control, Escape, scroll lock and focus return.",
   sources: ["CMP-173 (HM §144, ADP §70, UX §239)", "CMP-174 (HM §318, UX §131)", "CMP-175 (HM §318)", "CMP-176 (UX §321)", "CMP-178 (HM §319 §330)"]}
- {id: CMP-014, title: Nothing interrupts the visitor uninvited, domain: D08, tier: Reflex, check: J, remedy: fix-quieter, tests: [T-INTERRUPT],
   rule: "On a page the visitor came to read or buy from, nothing opens or floats over the content before they ask: no newsletter modal, entry gate, preloader, chat bubble, help pill, back-to-top square or award strip that covers content, and no system permission (notifications, location, camera) requested at launch: ask when the visitor reaches the feature, and never disguise a page element as a system dialog. A cookie banner the law requires is not a finding when it is plain and its decline is equal (INT-020 judges the decline).",
   why: "An uninvited overlay stands between the visitor and the reason they came, and a permission asked too early is refused for good.",
   fix: "Remove the interruption or move it into the page flow; request permissions at the feature that needs them.",
   sources: ["CMP-183 (TS §22)", "CMP-220 (ADP §43)", "CMP-217 (ADP §37)"]}
- {id: CMP-015, title: "Feedback sits where the change happened; undo beats confirm", domain: D08, tier: Reflex, check: J, remedy: fix-harden, tests: [T-ERROR-PATH],
   rule: "Show the result of an action where it happened (the row updates, the button says 'Copied' for about 2.5 s); no toast when the effect is already visible, and never a celebratory one. Toasts are for failures and invisible effects: from one corner, aria-live polite, never stealing focus, pausing on hover; an error toast carries one retry and does not leave on its own. Reversible actions run at once with Undo for 5 to 10 s; only irreversible ones confirm, and those name what is destroyed (conflict C27). A changed count or status is announced as a complete phrase without moving focus.",
   values: {undo_s: [5, 10], copied_label_s: 2.5},
   why: "A toast far from the change makes people look in two places, an 'Are you sure?' on every action trains them to click through, and a vanishing error is never read.",
   fix: "Show the change in place, keep toasts for failures with a retry, and replace routine confirmations with Undo.",
   sources: ["CMP-177 (HM §320 §145, UX §238)", "CMP-180 (HM §88 §323 §328)", "CMP-181 (HM §328, UX §99 §238)", "CMP-213 (UX §231, HM §337)", "CMP-128 (HM §311)"]}
- {id: CMP-016, title: "Every data region draws its empty, loading and error states", domain: D08, tier: Reflex, check: J, remedy: fix-harden, tests: [T-EMPTY-FIRST],
   rule: "A list, table, feed, inbox, search or dashboard panel is designed in four states: loading (a skeleton in the content's shape, space reserved so nothing shifts), empty (one line naming what is empty, one on why it matters, one action), error (what failed and a retry) and full. A search with no results suggests what to try. A product shown only full, a blank panel or a bare 'No results', or a spinner standing in for every state is a finding. What the empty and error text say is CPY-019's and CPY-018's; whether the states exist and hold their place is this card's.",
   why: "New users meet the empty state first and everyone meets the error state eventually; drawing only the full state designs a quarter of the screen.",
   fix: "Draw each data region's loading, empty and error states with the same frame as its full state, each with its one next action.",
   sources: ["CMP-191 (HM §94, UX §240)", "CMP-205 (HM §95 §321, UX §96, ADP §52)", "CMP-206 (UX §110)", "CMP-207 (HM §95, UX §97 §238)", "CMP-209 (UX §21 §233)"]}
- {id: CMP-017, title: "Onboarding is short, optional and leads to the work", domain: D08, tier: Reflex, check: J, remedy: fix-distill, tests: [T-FIRST-RUN],
   rule: "Let people see the product before asking for an account where the risk allows; show a welcome only when the next step is not obvious, and not at every login. Coachmarks are few (1 to 2 per screen), placed off their target and never mid-task; a checklist links each task to where it is done and ticks itself; a template gallery keeps a 'Blank' option; the suggested next step is one clear action, never an upgrade or invite before any value. A tour with no Skip, or a gate before any value, is INT-021's: cite it.",
   values: {max_hotspots_per_screen: 2},
   why: "Onboarding that stands between a new user and the work teaches less than the work would, and most people skip it anyway.",
   fix: "Cut the tour to the one step that is not obvious, link checklist tasks to the work, and let people start blank.",
   sources: ["CMP-215 (ADP §30 §34-35)", "CMP-218 (ADP §47-48)", "CMP-219 (ADP §50)", "CMP-222 (ADP §53-54)", "CMP-214 (UX §108 §230)", "CMP-216 (ADP §33)"]}
- {id: CMP-018, title: Tables read as tables, domain: D08, tier: Reflex, check: H, remedy: fix-layout, tests: [T-TABLE-READ],
   rule: "Dense, comparable data is a table, not a grid of cards (a list past about five comparable items becomes one). Text aligns left, numbers right in tabular figures, actions right; heads are sentence case and never wrap; horizontal rules only. On a phone the naming and action columns stay in view: rows restack as labelled blocks or the first column is pinned; a table opening with two or more columns off-screen is a finding. Sorting is offered only past about 10 rows and exposes aria-sort.",
   values: {cards_to_table_after: 5, sort_min_rows: 10},
   why: "Numbers that do not line up cannot be compared, and a phone table that hides its first column shows values with no names.",
   fix: "Right-align numbers in tabular figures, keep heads on one line, and restack or pin the naming column on phones.",
   sources: ["CMP-184 (HM §96, KM §95 §97)", "CMP-185 (UX §322, HM §183, KM §92)", "CMP-187 (HM §96 §145)", "CMP-188 (HM §96 §261 §435, TS §143)", "CMP-190 (ADP §94 §92, UX §111 §240)"]}

# ---------------- D13 imagery (lens-imagery; judgment and hybrid cards, no detector) ----------------
# Promoted from the mined drafts in rules/D13-IMG.yaml; each source cites the draft id and its original sections. Imagery
# findings are Reflex or Finish: draft Floors (IMG-103, IMG-110, IMG-114, IMG-118, IMG-120, IMG-121, IMG-149, IMG-153,
# IMG-161) are promoted as Reflex. The Floors near pictures stay with their owners: face-generator, placeholder-service
# and hotlinked-stock URLs (INT-003, fake_people), stock or generated faces as customers or staff (INT-009), invented
# logos and customers (INT-010, SLP-016), alt text (A11-005), measured contrast (A11-001). The icon tells the sweep
# measures (SLP-003, SLP-013, SLP-015, SLP-017) and image bytes (WEB-001) are cited, never repeated. A real brand's own
# photographs, captures and illustration system are strengths; regions a page shows as examples follow `exhibits`.
- {id: IMG-001, title: No AI-default or cliche imagery, domain: D13, tier: Reflex, check: J, remedy: explore-directions, tests: [T-AI-LOOK, T-MATERIAL-SOURCE],
   rule: "No picture comes from the generated-page kit: illustration packs and characters (unDraw, Humaaans, Storyset, Lottie mascots), glossy 3D blobs and isometric scenes, gradient spheres, mesh blobs, orbs or aurora fields used as hero art or behind text, robot faces, circuit boards, digital rain, glowing particles, and the mood-stock subjects (curtains, plant shadows, fog, latte art from above, a laptop on a desk, a handshake). A generated still is allowed only when the brief asks for one, and then it is inspected: one subject, place, light and lens, no text in the picture, no face to camera, and none of the generator's marks (extra or fused fingers, melted lettering, doubled furniture, plastic skin, the same face twice). data/lexicons/cliche-imagery.yaml lists the subjects; the imagery table matches it on alt text and file names, and the lens looks at the picture itself. A page whose whole direction is the tech-cliche look is CON-011's; this card judges each picture.",
   why: "These pictures appear on thousands of generated pages, so a visitor reads them as no picture at all and as a sign that nobody chose the material.",
   fix: "Replace the picture with the client's own photograph, capture or work; where there is none, set the fact in type or leave a [DATA NEEDED: what the picture must show] slot.",
   sources: ["IMG-111 (hallmark §277)", "IMG-112 (huashu §60, hallmark §277)", "IMG-140 (hallmark §122, huashu §83)", "IMG-131 (taste §36, hallmark §265)"]}
- {id: IMG-002, title: Pictures are the client's own material, domain: D13, tier: Reflex, check: J, remedy: explore-directions, tests: [T-MATERIAL-SOURCE],
   rule: "Take pictures in this order: the client's own photographs and work, captures of the real product, the product built in HTML when it is not built yet, a licensed library photo, a generated still only when the brief asks, and type at full scale. The subjects that are content (the product, the place, the people, the animal, the dish) are shown: a product page that never shows the product fails. Library stock fills detail slots only (at most one picture in three) and never the hero, a person, the room, the shopfront or the product; a library frame is never passed off as the client's own room, staff or region. Illustration is used when the client owns an illustration system. When a real asset cannot be found the gap is marked honestly ([DATA NEEDED], or the panel left out), never filled with a near miss. A stock or generated face presented as a customer, staff member or reviewer is INT-009's (Floor), and a face-service or hotlinked-stock URL is INT-003's (Floor): cite them.",
   values: {library_stock_max_share: 0.33, never_stock: [hero, person, room, shopfront, product]},
   why: "The visitor came to see this product, place or team; a picture that could belong to anyone says the client had nothing to show.",
   fix: "Use the client's own photographs and captures in the lead slots, move any library photo to a detail slot, and mark what is missing instead of filling it.",
   sources: ["IMG-101 (hallmark §114 §264, taste §549, kami §228 §639)", "IMG-103 (huashu §81, taste §35 §554)", "IMG-113 (taste §562, hallmark §264)", "IMG-132 (taste §549)", "IMG-130 (taste §36 §550-551 §553)", "IMG-110 (kami §228 §265 §639, huashu §39 §86)"]}
- {id: IMG-003, title: Every picture carries a fact, domain: D13, tier: Reflex, check: J, remedy: fix-distill, tests: [T-DELETION, T-DELETE-PICTURE, T-PROMISE-PICTURED],
   rule: "Remove each picture in your head: the page must lose a fact (what the product looks like at work, who runs the place, what the dish is, the step the text describes). A picture that only sets a mood, repeats the heading, or fills the right half of a split hero goes, and the picture beside a concrete promise ('takes four crates') shows it. Whether the lead material fits the business kind and whether every headline promise is pictured are lens-concept's (CON-013 to CON-017); this card judges each picture that is there.",
   why: "A picture that says nothing costs the visitor attention and pushes the facts below the fold.",
   fix: "Cut the mood picture or replace it with one that shows the fact the section claims.",
   sources: ["IMG-102 (hallmark §114 §265 §272, huashu §81, kami §639)"]}
- {id: IMG-004, title: No placeholders or empty frames, domain: D13, tier: Reflex, check: H, remedy: fix-harden, tests: [T-EMPTY-FRAME],
   rule: "A shipped artifact shows no grey or tinted box where a picture should be, no empty wash or gradient block of 300 by 200px or more standing in for a picture, no half-loaded frame at any captured width, no default or sample image, and no visible placeholder label ('your screenshot here', '16:9 image', a ratio note, a 'sample' chip). A page with more than five empty slots, or four in a row, is a wireframe. In a labelled draft a slot is allowed when it is labelled with what it needs (conflict C21); at ship it is not. Placeholder text in copy is INT-005's and a self-labelled sample is INT-015's: cite them.",
   values: {empty_slot_min_px: [300, 200], wireframe_slots: 5, wireframe_row: 4},
   why: "An empty frame tells the visitor the page was laid out before its material existed.",
   fix: "Put the real picture in the slot, or remove the slot and let the layout close up; in a draft, label the slot with what it must show.",
   sources: ["IMG-106 (hallmark §117 §268 §277, taste §563)", "IMG-108 (hallmark §119 §268)", "IMG-109 (hallmark §268, taste §39)", "IMG-110 (kami §228 §265 §639, huashu §39 §86)"]}
- {id: IMG-005, title: No drawn stand-ins for real things, domain: D13, tier: Reflex, check: H, remedy: explore-directions, tests: [T-STAND-IN],
   rule: "SVG and CSS draw only icons from one set, the logo, charts and diagrams of real data and plain geometry. Objects, plants, animals, people, products, buildings and scenes drawn in SVG or CSS past icon size, CSS silhouettes, bevelled fakes and styled-div 'product UI' standing in for a product that can be captured are findings. No hand-drawn browser bars, traffic lights, OS title bars or notches around a screenshot: a real screenshot in a figure, or one real device frame with real content. No photo of a screen showing someone else's interface. A deliberate product illustration (an unbuilt product, or a simplified marketing shot of the real one) is judged with IMG-007 instead (conflict C48).",
   why: "A drawn stand-in looks like the real thing at a glance and like nothing on a second look; it tells the visitor the real thing was not available.",
   fix: "Replace the drawing with a capture or photograph of the real thing, or with type; keep SVG for icons, the logo and real data.",
   sources: ["IMG-104 (hallmark §117 §277, huashu §60 §81, taste §23 §25, stageshow §31 §43)", "IMG-105 (hallmark §117, huashu §35 §60, taste §23 §25)", "IMG-119 (hallmark §118 §270)", "IMG-115 (hallmark §277)"]}
- {id: IMG-006, title: "Product captures are real, readable and in a telling state", domain: D13, tier: Reflex, check: J, remedy: fix-layout, tests: [T-CAPTURE-READ],
   rule: "A product shot is a capture of the real product doing its job, in a telling state (the main screen at work, a cropped detail, a second screen, the phone view), captured at 2x. A login screen, an empty state or a splash is not a product shot. Captures are scrubbed (no real names, emails, tokens, file paths, debug overlays or unintended errors), keep their UI text, numbers and controls inside the crop (a capture too tall to fit is split into two or three panels with one frame and padding), and keep captured text readable at the size shown (about 11px or more on screen). A redraw is labelled 'schematic' or 'concept'. Terminal tools show their real output in a code block. Whether software leads with its own UI is lens-concept's (CON-014); whether numbers inside the shot are honest is lens-integrity's (INT-013).",
   values: {capture_scale: 2, min_shown_text_px: 11},
   why: "A capture the visitor cannot read, or one that shows a login box, proves nothing about the product.",
   fix: "Recapture the product at 2x in the state the section describes, crop to the part that matters, and split tall screens into panels.",
   sources: ["IMG-116 (hallmark §115 §269 §475)", "IMG-117 (hallmark §269)", "IMG-118 (hallmark §269, huashu §36)", "IMG-120 (kami §136 §265 §646, stageshow §35)", "IMG-121 (kami §136 §229)", "IMG-123 (hallmark §269)", "IMG-124 (hallmark §270)"]}
- {id: IMG-007, title: A product illustration is built to be read, domain: D13, tier: Reflex, kind: context, check: H, remedy: fix-distill, tests: [T-ILLUSTRATION-READ],
   rule: "Judge every faux UI or product mockup against its five ways to fail: too much (packed with panels), too little (bars and blank pills), generic (no domain content), the wrong look (not the product's own tokens) and the wrong chrome (a browser bar around a product that is not a website). A good one budgets words, not elements: three to seven real strings where the eye lands (the title, the thing acted on, the result) and bars of varied width elsewhere, two or three real rows where the story touches a list, the domain's signature content (album art, thumbnails, avatars), the feature's signal once, one active surface when there are several windows, type at real UI sizes for the shown size (11 to 15px, never under 10px), the product's own icon pack first (conflict C47), and a phone kept at its real proportions. Faux UI that stands in for a product that can be captured is IMG-005's; staged result figures inside it are INT-013's.",
   values: {real_strings: [3, 7], ui_text_px: [11, 15], min_text_px: 10},
   why: "A product illustration exists to explain one thing quickly; packed, empty or off-brand mockups explain nothing and read as generated.",
   fix: "Cut the illustration to one active surface with three to seven real strings in the product's own look, and fill the rest with quiet bars.",
   sources: ["IMG-188 (stageshow §2)", "IMG-189 (stageshow §6)", "IMG-190 (stageshow §7)", "IMG-191 (stageshow §8 §9)", "IMG-193 (stageshow §10)", "IMG-194 (stageshow §11 §57)", "IMG-195 (stageshow §30)", "IMG-196 (stageshow §13 §55)", "IMG-197 (stageshow §32 §60)", "IMG-198 (stageshow §32 §57)", "IMG-199 (stageshow §33)", "IMG-200 (stageshow §23 §24 §25)"]}
- {id: IMG-008, title: One register and one frame across a set, domain: D13, tier: Reflex, check: H, remedy: fix-polish, tests: [T-ONE-REGISTER],
   rule: "Pictures that sit together share one light, one grade and one register: never studio black beside daylight, HDR beside a snapshot, or one black-and-white frame among colour ones unless it is the one deliberate exception. Photographs on a product or service page share one corner radius; a group of captures shares one frame, padding and background. A photo never carries both a border and a wide shadow. A radius, border or shadow that changes from one picture to the next in the same set, with no reason in the content, is a finding.",
   why: "Mismatched pictures read as collected from different places, which is usually what happened.",
   fix: "Choose pictures from one shoot or one grade, set one radius and one frame for the set, and drop the border or the shadow.",
   sources: ["IMG-142 (taste §557, huashu §38)", "IMG-157 (taste §565)", "IMG-156 (hallmark §276, taste §35 §562)", "IMG-120 (kami §136 §265 §646, stageshow §35)"]}
- {id: IMG-009, title: Pictures are shown big enough and sharp, domain: D13, tier: Reflex, check: H, remedy: fix-layout, tests: [T-IMAGE-SIZE],
   rule: "A photograph is shown big or not at all: at least 6 of 12 columns and about 440px tall at 1440, or full-bleed; a set of four or more may run smaller. Ratios and sizes vary across the page (4:5 beside text, 16:9 or 21:9 across, a 1:1 pair; at most four slots in a row). Photographs below the hero take at most about a third of the page at 1440 (about 45% on a photographic or portfolio page), and two photo-led sections never run back to back. A hero image carries at least 2x its shown width (2880px at 1440); no picture is upscaled (natural width under its shown width); every image has width, height and a file that loads. Bytes and LCP are WEB-001's; a blocked image is 'not verified', never a finding.",
   values: {photo_min_columns: 6, photo_min_height_px: 440, max_per_row: 4, photo_budget_share: 0.33, portfolio_budget_share: 0.45, hero_min_density: 2},
   why: "A small or soft photograph looks like a thumbnail of a better page; an upscaled one looks broken on every retina screen.",
   fix: "Show fewer photographs larger, serve each at 2x its shown size, and remove the ones that only fill a slot.",
   sources: ["IMG-143 (hallmark §272)", "IMG-144 (hallmark §116 §273)", "IMG-145 (hallmark §268 §272, taste §556)", "IMG-146 (hallmark §267, taste §558)", "IMG-147 (taste §35 §558)", "IMG-149 (hallmark §122 §470, huashu §66, uupm §42)"]}
- {id: IMG-010, title: Crops keep the subject at every width, domain: D13, tier: Reflex, check: H, remedy: fix-layout, tests: [T-CROP-375],
   rule: "Each picture is cropped by its frame on purpose: a set aspect ratio with object-fit cover and an object-position that keeps the subject (people near center 35%, scans top centre), and UI captures contain-fit so no control is cut. Nothing is stretched (a rendered ratio that differs from the file's with no cover or contain). A full-bleed photograph with words over it gets its own phone crop with the subject inside the middle 342px at 375 to 390, and a picture whose crop changes at 375 still shows its subject. A face cut at the eyes, a product cut in half or a capture cut through its controls is a finding.",
   values: {people_object_position: "center 35%", phone_subject_px: 342},
   why: "A crop that loses the subject on a phone shows most visitors a wall of background.",
   fix: "Set aspect-ratio, object-fit and object-position per picture, contain-fit captures, and give full-bleed photographs a phone crop.",
   sources: ["IMG-148 (hallmark §267 §470, kami §137)", "IMG-154 (taste §558 §560)"]}
- {id: IMG-011, title: Text over pictures stays readable, domain: D13, tier: Reflex, check: H, remedy: fix-layout, tests: [T-TEXT-ON-IMAGE],
   rule: "Words over a photograph sit on its calmest part, on a scrim (35 to 65% of the theme ink from the text edge) or a solid plate, and reach 4.5:1 (3:1 for display text) on the worst pixels beneath them, measured on the textured or photographic result, not the flat token (conflict C20: allowed when the worst-pixel contrast passes). The text is its own layer above the picture, never baked into the image file, and pills and labels are not stuck on photographs. A contrast failure you can measure on the tile is lens-a11y's Floor (A11-001): cite it there; this card judges placement, scrim and layering.",
   values: {body_contrast: 4.5, display_contrast: 3, scrim_pct: [35, 65]},
   why: "Text that crosses a busy picture is unreadable in parts, and text baked into an image cannot be read by translation, search or a screen reader.",
   fix: "Move the text to the calm part or off the picture, add a scrim or a plate, and set the words in HTML above the image.",
   sources: ["IMG-153 (hallmark §274, taste §560)", "IMG-155 (hallmark §268)", "IMG-114 (hallmark §277, taste §566, uupm §275)", "IMG-159 (taste §35)", "IMG-182 (hallmark §282)"]}
- {id: IMG-012, title: Treatment and texture come from the brand, domain: D13, tier: Reflex, check: H, remedy: fix-quieter, tests: [T-TREATMENT],
   rule: "No grain, halftone, dither, duotone, blur, blend or filter is laid over page photographs, UI or text unless the brand system names that treatment (conflict C20). Texture appears only when the theme names it or the lineage is print, in one family per page (grain, halftone, misregistration, scanline or deckle, never two), at opacity 0.08 or less page-wide, 0.15 or less scoped to a card, 0.05 or less (or none) under body text, and never animated. Decorative grid or stripe backgrounds need a canvas, map or measuring tool under them. Hover zoom stays inside the frame at 1.02 to 1.03, with no rotate (conflict C17). Glow halos and stock gradients the sweep measures are SLP-007 and SLP-008: cite them.",
   values: {texture_opacity_page: 0.08, texture_opacity_card: 0.15, texture_opacity_under_text: 0.05, hover_zoom_max: 1.03},
   why: "A filter preset makes every photograph look like the same template, and texture over text costs contrast for nothing.",
   fix: "Remove filters and texture the brand does not name, keep one texture family at its budget, and stop any texture from moving.",
   sources: ["IMG-185 (taste §25 §564, hallmark §276 §471)", "IMG-179 (hallmark §281 §289, taste §25, hallmark §127)", "IMG-180 (hallmark §281 §289, taste §23 §25)", "IMG-181 (hallmark §282, huashu §180)", "IMG-183 (hallmark §283, taste §23 §25)", "IMG-187 (hallmark §117 §127)", "IMG-158 (hallmark §277, taste §561)"]}
- {id: IMG-013, title: One icon system, domain: D13, tier: Reflex, check: H, remedy: fix-quieter, tests: [T-ICON-SYSTEM],
   rule: "Each surface uses one icon library, one stroke width and one style (a brand mark in two places or fewer may differ). No set is a tell by itself, Lucide included (conflict C47); two line sets, glyphs of one set at different stroke widths, or a set mixed with hand-drawn glyphs is. Icons sit on their grid (16, 20, 24 or 32px; a 24 viewBox shown at 24, never scaled to 19), inherit currentColor, and appear only where they help find or name something: not every heading or feature needs one. Filled at 14px and under is fine in dense UI (conflict C49). The sweep measures the tells: icon tiles above headings (SLP-003), emoji as icons (SLP-013), a sparkle for AI (SLP-015), filled and outline mixed in one group (SLP-017): cite them.",
   values: {grid_px: [16, 20, 24, 32], max_extra_brand_marks: 2},
   why: "Icons from several sets, sizes and weights read as collected, and an icon on every heading stops meaning anything.",
   fix: "Pick one set and one stroke width, redraw or replace the odd glyphs, snap sizes to the grid, and cut icons that only decorate.",
   sources: ["IMG-165 (hallmark §123 §278, uupm §234 §937, taste §361, stageshow §25)", "IMG-166 (hallmark §278, uupm §261 §937, taste §366)", "IMG-167 (hallmark §278, uupm §261, taste §363)", "IMG-169 (huashu §60, kami §411)", "IMG-164 (hallmark §123 §278, huashu §60, uupm §234, taste §23 §25, stageshow §2)"]}
- {id: IMG-014, title: Logos are the owners' marks at even weight, domain: D13, tier: Reflex, check: J, remedy: fix-polish, tests: [T-LOGO-ROW],
   rule: "A named tool, partner or customer is shown with its real logo as its owner draws it: in its own colours, or in the owner's official one-colour version when the whole row is set in one neutral. A mark is never redrawn, re-tinted into the page accent, stretched or approximated. A row of logos has even visual weight: a wordmark about 0.7 of the row height and never more than 4.5 times as wide as tall; in tiles, a landscape mark about 70% of the tile width, a portrait one about 68% of its height, a square one about 60%. Mockup collateral (cards, signage) uses the client's real logo. Whether the companies are real customers is INT-010's (Floor) and a one-letter tile in a brand colour is SLP-016's: cite them.",
   values: {wordmark_height: 0.7, max_aspect: 4.5, tile_landscape_width: 0.7, tile_portrait_height: 0.68, tile_square: 0.6},
   why: "A redrawn or uneven logo row looks careless at best and invented at worst.",
   fix: "Use each owner's official mark, set the row in one treatment, and size each mark by visual weight, not by box.",
   sources: ["IMG-171 (taste §360 §366 §376, huashu §34, stageshow §28)", "IMG-173 (taste §365)", "IMG-174 (taste §366-367, stageshow §28)", "IMG-125 (uupm §265)"]}
- {id: IMG-015, title: Each picture appears once, domain: D13, tier: Reflex, check: H, remedy: fix-distill, tests: [T-ONE-REGISTER],
   rule: "Never show the same frame twice on a page: a crop, a mirror or a smaller file of it counts as the same, and three near-identical frames count as one used three times. A carousel or marquee that duplicates its slides to loop is not a repeat unless the copies are on screen together.",
   why: "A repeated photograph shows the visitor how little material there was.",
   fix: "Keep the frame where it carries the most, and replace or cut the other uses.",
   sources: ["IMG-135 (taste §550 §557)"]}
- {id: IMG-016, title: Video is real footage that rests on a poster, domain: D13, tier: Finish, check: H, remedy: fix-harden, tests: [T-MATERIAL-SOURCE, T-POSTER],
   rule: "A video shows the client's own footage (the product, the place, the work), plays muted, looped and inline when it autoplays, and rests on a poster that is a real frame of it, so the first paint shows a picture, not a black box. A file stays near 2MB per 10 seconds (AV1 or VP9 WebM, then H.264). Pause controls for motion past 5 seconds are the sweep's and lens-a11y's (Floor); timing is lens-motion's.",
   values: {max_mb_per_10s: 2},
   why: "Stock footage says the same nothing as stock photographs, and a video with no poster shows an empty box on slow lines.",
   fix: "Use the client's footage with a real poster frame, or replace the video with the best still.",
   sources: ["IMG-161 (hallmark §280 §473)", "IMG-152 (taste §563 §35)"]}

# ---------------- D12 data viz and diagrams (lens-dataviz; judgment and hybrid cards, no detector) ----------------
# Promoted from the mined drafts in rules/D12-DVZ.yaml; each source cites the draft id and its original sections. Dataviz
# findings are Reflex or Finish: draft Floors (DVZ-107, DVZ-117, DVZ-118, DVZ-127 to DVZ-131, DVZ-134, DVZ-136, DVZ-157,
# DVZ-158, DVZ-168, DVZ-171 to DVZ-174, DVZ-180, DVZ-191, DVZ-194, DVZ-212) are promoted as Reflex. Truth stays with its
# owners: invented figures and series (INT-001, INT-012), unsourced stat bands (INT-007), the unit, baseline and source of
# a claimed figure (INT-011), staged numbers in product pictures (INT-013); text size (A11-002), contrast (A11-001) and
# image alt text (A11-005) stay with the sweep and lens-a11y. This lens judges how the data is shown: form, scale, focus,
# labels, colour by meaning and connector grammar. A real publication's own chart style is a strength, not a finding;
# regions a page shows as examples follow `exhibits`.
- {id: DVZ-001, title: Each chart or diagram earns its place, domain: D12, tier: Reflex, check: J, remedy: fix-distill, tests: [T-DIAGRAM-EARNS, T-ONE-QUESTION],
   rule: "Every chart answers one question a reader has (how did this change, which is biggest, what share, how do these parts connect) and adds a comparison, trend, distribution or connection the text does not already give. A chart that restates a figure already on screen or a sentence goes. Two things compared are a sentence or a table, and one labelled box is a sentence. When the point is how things connect, draw a diagram; when the point is what a user sees, show a capture or a UI fragment, never a diagram of a screen. When the data can carry the page, it becomes the picture itself (objects scaled to proportion, a route on a real map) rather than three big number cards.",
   why: "A chart that answers nothing costs the reader time and tells them the page was decorated, not informed.",
   fix: "Name the question each chart answers and cut the ones the text already answers; turn a two-value chart into a sentence and a diagram of a screen into a capture.",
   sources: ["DVZ-101 (kami §338 §344)", "DVZ-102 (kami §141 §262 §301)", "DVZ-104 (taste §372)", "DVZ-108 (huashu §82 §168)", "DVZ-201 (kami §391 §372)"]}
- {id: DVZ-002, title: The chart form fits the comparison, domain: D12, tier: Reflex, check: H, remedy: fix-layout, tests: [T-CHART-FORM],
   rule: "Choose the form from the data relationship (change over time, ranking, part-to-whole, correlation, distribution, deviation, flow, magnitude, place), then the look. Time is a line, or bars when absolute counts per period matter most; four points or fewer is a stat tile, not a line. A category comparison is bars sorted by value, horizontal when the labels are long or there are seven or more; about 8 categories by 3 series at most, and a table past about 12. Part-to-whole is a stacked bar; a pie or donut only for 2 to 5 labelled parts (conflict C04: flag 6 or more), never for slices within 5% of each other. One value is a stat tile, never a one-bar chart. Correlation is a scatter of 20 points or more; distribution a box plot or histogram of 20 or more per group. Funnels only for sequential stages (3 to 8), radar only for 2 or 3 series over 5 to 8 axes, treemaps and sunbursts to 3 levels, heatmaps of 20 cells or more with a numeric legend, and no word cloud where values matter. When several forms fit, pick the one that shows the difference most clearly.",
   values: {line_min_points: 4, max_categories: 8, max_series: 3, table_past: 12, pie_parts: [2, 5], scatter_min_points: 20, funnel_stages: [3, 8], radar_axes: [5, 8]},
   why: "The wrong form hides the comparison the chart exists for: a pie of nine slices or a line through three points makes the reader work out what a bar chart would have shown at a glance.",
   fix: "Name the relationship, then redraw in its form: sorted bars for ranking, a line for time, a stacked bar for shares, a table past a dozen rows.",
   sources: ["DVZ-124 (huashu §266, kami §343)", "DVZ-109 (hallmark §305, kami §260 §431 §434, uupm §170)", "DVZ-110 (kami §419)", "DVZ-111 (kami §260 §433, uupm §171, hallmark §305)", "DVZ-112 (kami §419 §435, uupm §171)", "DVZ-113 (hallmark §305, kami §419 §436, uupm §172)", "DVZ-103 (hallmark §305, uupm §170)", "DVZ-105 (hallmark §305, uupm §171)", "DVZ-114 (uupm §173 §186)", "DVZ-115 (uupm §174)", "DVZ-116 (uupm §176)", "DVZ-120 (uupm §183)", "DVZ-121 (uupm §180 §189)", "DVZ-123 (uupm §193)", "DVZ-125 (kami §419)"]}
- {id: DVZ-003, title: No decorative charts or dashboards, domain: D12, tier: Reflex, check: J, remedy: explore-directions, tests: [T-FILLER, T-ONE-QUESTION],
   rule: "A chart, gauge, donut or KPI tile is there because a reader needs its numbers, never to make the page look technical: no donut walls, gauge rows or KPI confetti, no decorative line squiggles or 'live' graphs behind a hero, no icon, number and word metric cards with nothing behind them, and no hand-drawn map or contour or dot pattern dressed as one (real geodata, or no map). A dashboard leads with one hero figure, one supporting chart and one table, in one currency and unit system over one meaningful default range, with totals that reconcile. Whether the numbers are real is lens-integrity's (INT-001, INT-007, and INT-013 for a staged dashboard of round growth figures): cite it as evidence; this card judges whether the chart is there to inform.",
   values: {dashboard_hero_figures: 1, dashboard_charts: 1, dashboard_tables: 1},
   why: "Charts drawn as decoration teach the reader to skip every chart on the page, including the one that matters.",
   fix: "Cut the decorative charts and tiles, keep the one figure, chart and table the reader acts on, and draw maps from real geodata.",
   sources: ["DVZ-106 (hallmark §304 §310, huashu §60)", "DVZ-107 (huashu §60, taste §40)", "DVZ-174 (kami §167)", "DVZ-212 (huashu §265, taste §620)", "DVZ-138 (taste §25)"]}
- {id: DVZ-004, title: Scales are honest, domain: D12, tier: Reflex, check: H, remedy: fix-layout, tests: [T-HONEST-SCALE],
   rule: "Bars and areas start at zero. A line may start near its data only when the axis says so ('axis starts at 94%'). Ticks run at even intervals on one linear scale (a log scale is labelled as one), rounded outward to 4 to 8 ticks in steps of 1, 2, 2.5 or 5, with the precision of the step ('0 to 20 by 5', not '0.0 to 20.0'). No dual y-axes: two units are two charts or small multiples, and small multiples share one axis range. Candlesticks and range charts need not start at zero, and each high and low contains its open and close. The charts table reads tick values, whether a value axis includes zero, the value at a bar baseline and the step pattern; a canvas or image chart is read on its crop. A truncated axis that turns a small change into a large one, used as a claim, is also lens-integrity's (INT-001, INT-012): cite it.",
   values: {ticks: [4, 8], tick_steps: [1, 2, 2.5, 5]},
   why: "A bar's length is its value: cut the axis and a 3% difference looks like a doubling, which readers take as the page's claim.",
   fix: "Start bars and areas at zero, label any line axis that does not, set even rounded ticks, and split dual axes into two charts.",
   sources: ["DVZ-127 (hallmark §306 §308, kami §425)", "DVZ-128 (hallmark §308, kami §425)", "DVZ-129 (hallmark §306)", "DVZ-130 (huashu §272)", "DVZ-135 (kami §425)", "DVZ-118 (kami §418 §438, uupm §184)"]}
- {id: DVZ-005, title: The chart agrees with itself and its words, domain: D12, tier: Reflex, check: J, remedy: fix-copy, tests: [T-CHART-TEXT-MATCH],
   rule: "What the words say is what the marks show: a caption that says 'accelerated' sits over a line that bends upward, the focal colour lands on the series the caption names, a labelled value matches the bar it labels, a waterfall's closing bar equals its running sum, donut and stacked shares add to exactly 100% at the precision shown (largest remainder), and every mark sits where its value puts it, never placed by hand. A series made up to fill a chart is lens-integrity's (INT-012); this card judges the agreement a reader can check on the page.",
   why: "A reader who catches one chart contradicting its caption or its own totals stops trusting every number on the page.",
   fix: "Recompute the marks from the data, reconcile totals and shares, and rewrite the caption to say what the chart shows.",
   sources: ["DVZ-134 (kami §262 §299)", "DVZ-131 (kami §261 §418 §301)", "DVZ-136 (kami §436)", "DVZ-117 (kami §437 §418, uupm §182)", "DVZ-177 (kami §342 §351 §453)"]}
- {id: DVZ-006, title: "No 3D, effects or motion in data marks", domain: D12, tier: Reflex, check: H, remedy: fix-quieter, tests: [T-DATA-INK],
   rule: "Data marks are flat: no 3D bars or pies (a third axis only where the data has one, with a 2D fallback), no drop shadows, glows, bevels or gradients in bars and slices (a sparkline's fade fill is the one sanctioned gradient), no halftone, grain, sheen or moving traces in a chart area, and no animation still running after the data has drawn. Dark mode re-derives the series colours (less chroma, more lightness), never inverts them. Gradient and glow tells the sweep measures are SLP-007 and SLP-008: cite them.",
   why: "Depth and effects distort the values they sit on (a 3D pie's front slice looks largest) and mark the chart as chart-library ornament.",
   fix: "Flatten the marks, remove shadows and gradients, stop the motion once the data has drawn, and derive dark-mode colours.",
   sources: ["DVZ-122 (uupm §191, hallmark §306)", "DVZ-137 (hallmark §306, huashu §168, kami §263)", "DVZ-138 (taste §25)", "DVZ-161 (hallmark §309, huashu §62)"]}
- {id: DVZ-007, title: Chart furniture stays quiet, domain: D12, tier: Finish, check: H, remedy: fix-polish, tests: [T-DATA-INK, T-FIGURES],
   rule: "Gridlines are hairlines (1px, solid, never dashed), 3 to 5 horizontal and no vertical ones unless time needs them, and the axis line is no heavier than the grid. Bars are 24px thick or less with tight gaps (2 to 4px within a group) and a radius of 2px or less at the data end; lines are 2px, with markers only at annotated points. Sparklines inside a component have no axes, no grid and no second colour. Tick and value labels are ink or muted, never the series colour, set in tabular figures with real number formats (thousands separators, the minus before the currency, signed deltas). Tick labels align to the column edge so the chart lines up with the text, and charts in one document share one plot height and type scale.",
   values: {grid_lines: [3, 5], bar_max_px: 24, bar_gap_px: [2, 4], bar_radius_max_px: 2, line_px: 2},
   why: "Heavy grids, fat rounded bars and coloured labels are the chart library's defaults; they compete with the data for the reader's eye.",
   fix: "Thin the grid to a few hairlines, slim the bars, drop markers and set labels in muted ink with tabular figures.",
   sources: ["DVZ-141 (hallmark §306, kami §425)", "DVZ-139 (hallmark §306, kami §433)", "DVZ-140 (hallmark §306, kami §434)", "DVZ-142 (hallmark §306)", "DVZ-159 (hallmark §307)", "DVZ-160 (hallmark §307, kami §100)", "DVZ-146 (kami §430)", "DVZ-145 (kami §426)", "DVZ-144 (kami §422)"]}
- {id: DVZ-008, title: One focal series and colour by meaning, domain: D12, tier: Reflex, check: H, remedy: fix-colorize, tests: [T-FOCAL],
   rule: "Each chart makes one point and colours it: the series or bar the title names carries the accent and the rest stay neutral. A multi-series chart uses a lightness ramp on one hue in a fixed order, never a cycled rainbow, and categorical hues share lightness and saturation. One colour means one thing across every chart on the page; no hue appears mid-chart from outside the page's declared roles, and no bar chart colours each bar differently (rank by order or opacity instead). The charts table's `palette` lists the chromatic colours in each chart's pixels and `bar_colours` the colour at each bar's centre.",
   values: {focal_series: 1, ramp_lightness_step_pct: [12, 15]},
   why: "When every series is loud the reader cannot tell which one the chart is about; a rainbow of bars invents categories the data does not have.",
   fix: "Put the accent on the one series the title names, grey the rest, and replace per-bar hues with one colour.",
   sources: ["DVZ-154 (hallmark §305 §307, kami §420, huashu §272)", "DVZ-155 (hallmark §307)", "DVZ-156 (hallmark §307, huashu §168 §258 §263)", "DVZ-162 (taste §612, kami §111)", "DVZ-164 (huashu §268-269)"]}
- {id: DVZ-009, title: Meaning survives without colour, domain: D12, tier: Reflex, check: H, remedy: fix-a11y, tests: [T-GRAYSCALE, T-SECOND-ENCODING],
   rule: "No series, status or direction is told by hue alone: lines differ by style or carry a direct label, bars by position or label, deltas by sign or arrow, map classes by pattern or value. Red and green together need a second encoding (conflict C05); scientific figures use a colour-blind-safe pair such as blue and orange. A swatch close to the background gets an outline. A chart whose figures the text does not repeat has a text alternative (a summary sentence or a data table beside it, an svg title and desc, an aria-label), and hover values are reachable by keyboard. The charts table's `colour_checks` flags red with green and colour pairs that fall within 10 Delta E under protanopia or deuteranopia. Label contrast is A11-001's and an image chart's alt text A11-005's (Floor): cite them.",
   values: {cvd_min_delta_e: 10},
   why: "About one man in twelve cannot tell red from green; a chart that relies on hue tells him nothing, and a screen reader gets nothing from a picture of a chart.",
   fix: "Add a second encoding (direct labels, line styles, signs or arrows), choose a colour-blind-safe pair, and give the chart a summary or a table.",
   sources: ["DVZ-157 (uupm §170-194 §41, hallmark §307)", "DVZ-158 (kami §358 §421, uupm §182, huashu §276)", "DVZ-163 (kami §420)", "DVZ-172 (uupm §170-194)"]}
- {id: DVZ-010, title: "The takeaway, unit, base and source are on the figure", domain: D12, tier: Reflex, check: J, remedy: fix-copy, tests: [T-TAKEAWAY-TITLE],
   rule: "Each chart states its point once in words: a title or caption that says the finding ('Revenue grew faster after the Q2 price change'), not the topic ('Revenue by quarter'). Where the takeaway sits is by scope (conflict C53): an insight title on web and slide charts, a caption under a print or editorial figure, never both repeating each other. The unit sits in an axis caption or on the value labels; any index base, definition or shared scale sits in the subtitle ('Jan 2019 = 100'); a data chart credits its source in a line under it; a statistical figure states n, the error measure and the test. Whether the cited source is real is lens-integrity's (INT-011).",
   why: "A topic title makes every reader work out the point alone, and a chart with no unit or source cannot be read or checked.",
   fix: "Rewrite the title as the finding, add the unit and any base to the axis or subtitle, and add a source line.",
   sources: ["DVZ-165 (kami §262 §301 §342 §429 §644, huashu §261 §266 §269 §272)", "DVZ-169 (huashu §266 §268 §272)", "DVZ-170 (kami §427 §430)", "DVZ-168 (kami §429, huashu §266 §269)", "DVZ-173 (huashu §276)", "DVZ-222 (kami §342 §413, taste §376)"]}
- {id: DVZ-011, title: Label directly and keep the legend for when it is needed, domain: D12, tier: Finish, check: H, remedy: fix-layout, tests: [T-DIRECT-LABEL],
   rule: "Name series where they are: end-of-line labels or labels on the bars, 12px or more apart and clear of each other. A legend appears only for more than one series that cannot be labelled directly (always for a direction-coded chart), sits in a strip below the plot rather than floating inside it, and shows only the encodings the chart uses. A single series has no legend. The charts table counts `legend` entries (svg swatch pairs and HTML legends) against `direct_labels` (words inside the plot) for each chart.",
   values: {label_gap_px: 12},
   why: "A legend makes the reader match colours back and forth; a label on the line is read once.",
   fix: "Move series names onto the lines or bars, drop the legend for a single series, and put any remaining legend below the plot.",
   sources: ["DVZ-167 (kami §434, huashu §269, uupm §170)", "DVZ-166 (kami §428, uupm §288)", "DVZ-199 (kami §367 §450)"]}
- {id: DVZ-012, title: Charts read at their size and on a phone, domain: D12, tier: Reflex, check: H, remedy: fix-layout, tests: [T-CHART-375],
   rule: "A chart sits at its column's full width and scales with it (viewBox scaling, width 100% and height auto); it is never capped in height or shrunk to fit, and crowding is fixed by cutting, banding or splitting, never by smaller type. At 375 a chart still reads (fewer ticks, labels about 11px or more as rendered, nothing cut off) or turns into a table or a list; it never overflows the page or shrinks its labels to a few pixels inside a scaled SVG. A slide holds one diagram that fills most of it; a long document one figure per page. The charts table gives each region's width at 375, whether it overflows or scrolls, and the rendered size of the smallest SVG label. Text below the size floor is A11-002's (the sweep's text_floor): cite it.",
   values: {min_label_px_rendered: 11, slide_fill: 0.65},
   why: "Most readers see the phone rendering: a chart that shrinks its labels to 5px or runs off the screen shows them nothing.",
   fix: "Let the chart take the column width, cut ticks or labels at small widths, and swap it for a table or list on phones when it cannot read.",
   sources: ["DVZ-147 (adp §226)", "DVZ-143 (kami §424)", "DVZ-203 (kami §408 §454)", "DVZ-220 (kami §641)", "DVZ-171 (kami §423, huashu §75)", "DVZ-149 (kami §347 §417)"]}
- {id: DVZ-013, title: Stat tiles and sparklines show a figure honestly, domain: D12, tier: Reflex, check: H, remedy: fix-copy, tests: [T-STAT-TILE],
   rule: "One value is a stat tile: the figure, a worded qualifier that says what it counts and over what period, and, when it changed, a signed delta against a named baseline. A sparkline beside it shows the real trend of that same figure (no axes, no grid, one colour) or is left out; a squiggle that does not follow the data, a ring or bar with no target, a trend of three points, or a delta whose colour is its only sign of direction is a finding. Tiles in one row share one unit system and one period. Whether the figure is sourced is INT-007's and INT-011's (the sweep's stat_band): cite them; this card judges how the figure is shown.",
   why: "A big number with no qualifier, period or baseline cannot be read, and a decorative trend line beside it implies a history nobody measured.",
   fix: "Give each tile its qualifier, period and baseline, keep a sparkline only when it plots that figure, and sign every delta.",
   sources: ["DVZ-103 (hallmark §305, uupm §170)", "DVZ-142 (hallmark §306)", "DVZ-174 (kami §167)", "DVZ-108 (huashu §82 §168)", "DVZ-109 (hallmark §305, kami §260 §431 §434, uupm §170)"]}
- {id: DVZ-014, title: A diagram has one focal point and a node budget, domain: D12, tier: Reflex, check: H, remedy: fix-distill, tests: [T-DIAGRAM-EARNS, T-DIAGRAM-FOCAL, T-30S-BOARD],
   rule: "A figure holds about 9 nodes (12 on a web diagram card, conflict C54); more is two diagrams or a list. It marks one or two focal elements in the accent, on the element the caption names, with the accent under about 5% of the figure. Nodes vary in size by tier (two or three sizes, never every node its own), and carry an optional icon, a title in the product's own terms and two or three short lines, never a paragraph or a jargon node ('orchestration layer', 'AI engine'). Diagrams introduce no new colours or fonts and look like one system with each other: no glows, gradients, shadows, radii over 10px or neon on dark as 'technical'. Plan furniture (dates, owners, phases) stays out of architecture diagrams, and future or uncertain parts are drawn at lower weight (dashed, faded), never focal. A reader can state the main path in 30 seconds.",
   values: {max_nodes: 9, max_nodes_web_card: 12, focal_max: 2, accent_area_max: 0.05, node_size_tiers: [2, 3], max_radius_px: 10},
   why: "A diagram with every box equally loud and twenty nodes has no main path, so the reader leaves with nothing.",
   fix: "Cut or merge nodes to the budget, put the accent on the one element the caption names, and size nodes by tier.",
   sources: ["DVZ-175 (kami §348 §369 §387, taste §376)", "DVZ-176 (kami §350 §449)", "DVZ-177 (kami §342 §351 §453)", "DVZ-183 (kami §360 §449)", "DVZ-184 (kami §361 §403 §442 §451, taste §376)", "DVZ-185 (taste §376)", "DVZ-186 (kami §339 §390)", "DVZ-187 (kami §340 §448)", "DVZ-181 (kami §353 §453)", "DVZ-180 (kami §341 §352 §453)", "DVZ-179 (kami §348)"]}
- {id: DVZ-015, title: Connectors have one grammar, domain: D12, tier: Reflex, check: H, remedy: fix-polish, tests: [T-CONNECTORS],
   rule: "Connectors route orthogonally behind nodes, never through a node, across a label or along a module's top edge; curves only for loops and back arcs. Each arrow lands on a node edge (within about 4px, never floating 5 to 10px short), branches from one node leave from separate points, and arrowheads are open chevrons drawn in their direction. Line style means one thing: solid for the main path, dashed only for exceptional, auxiliary, return or not-yet paths (sequence returns dashed), never as decoration. Each architecture relationship carries a short verb or protocol on a masking plate that covers no node or other label, and no text runs vertically along an arrow. A line the reader cannot parse is deleted rather than explained, and minor relations move to the caption. The charts table counts straight segments, crossings, segments through nodes and ends floating 4 to 14px from a node; curves, diagonals, dashes and arrowhead direction are read on the crop.",
   values: {endpoint_standoff_px: 4, float_band_px: [5, 10]},
   why: "When arrows mean several things, cross, or stop short of their boxes, the reader cannot follow the flow the diagram exists to show.",
   fix: "Reroute connectors orthogonally behind the nodes, land each on an edge, keep dashes for one meaning and label each relationship with a verb.",
   sources: ["DVZ-191 (kami §363 §391 §404)", "DVZ-192 (kami §365 §391 §450)", "DVZ-193 (kami §363)", "DVZ-194 (kami §364 §642)", "DVZ-195 (kami §366)", "DVZ-196 (kami §439 §450)", "DVZ-197 (kami §369 §405)", "DVZ-198 (kami §441)", "DVZ-200 (kami §391 §450)", "DVZ-209 (kami §378)"]}

# ---------------- D15 robustness (lens-robustness; judgment and hybrid cards, no detector) ----------------
# Promoted from the mined drafts in rules/D15-ROB.yaml; each source cites the draft id and its original sections.
# Robustness findings are Reflex or Finish: draft Floors (ROB-103, ROB-107, ROB-108, ROB-116, ROB-118, ROB-131, ROB-164,
# ROB-165, ROB-170, ROB-174, ROB-194, ROB-196, ROB-200, ROB-202, ROB-216) are promoted as Reflex. The Floors stay with the
# sweep: content hidden behind script or animation (ROB-001, hidden_content) and sideways scroll (ROB-003, overflow); the
# measured tells are cited, never repeated: phone parity (ROB-002), widows (ROB-004), weight and LCP (WEB-001), text size
# (A11-002), lang and title (A11-008), the fallback face (TYP-004), action feedback (CMP-001). States a component must
# draw are lens-components' (CMP-002, CMP-003, CMP-016), lines that collide are typography's (TYP-022), CJK setting is
# TYP-023. This lens judges what happens when real content and real conditions arrive; the stress matrix has no
# detector yet, so it reads layout evidence (white-space, clipping, fixed boxes, card heights, the stylesheet) and the
# fixtures in data/fixtures/hostile.yaml are applied in the head, never claimed as run.
- {id: ROB-005, title: Long and unbroken text reflows, domain: D15, tier: Reflex, check: H, remedy: fix-harden, tests: [T-HOSTILE-CONTENT, T-STRESS],
   rule: "Every text slot takes a 60-character name, a 16-character unbroken word, a long URL or e-mail and an empty value without breaking the layout. Display heads carry overflow-wrap: break-word (never anywhere on a heading), URLs, IDs and user content reflow with overflow-wrap: anywhere (never word-break: break-all on prose), flex and grid text children can shrink (min-width: 0) and tracks that hold media or text use minmax(0, 1fr), not a bare 1fr (conflict C55). Absolutely positioned children have a positioned parent so long text cannot drag them off their anchor. A word that already runs past its box or the screen is ROB-003's (Floor) when the sweep measures sideways scroll: cite it.",
   values: {long_name_chars: 60, unbroken_word_chars: 16},
   why: "Real names, product titles and pasted links are longer than the sample copy, and one unbroken string can push a whole column off a phone screen.",
   fix: "Add overflow-wrap to headings and user content, min-width: 0 to flex and grid children, and minmax(0, 1fr) to tracks.",
   sources: ["ROB-104 (hallmark §4 §426, uupm §107 §236)", "ROB-105 (hallmark §4 §400, huashu §122)", "ROB-106 (uupm §236)", "ROB-109 (huashu §374)"]}
- {id: ROB-006, title: "Wrap before truncating, and never truncate what matters", domain: D15, tier: Reflex, check: H, remedy: fix-layout, tests: [T-TRUNCATION, T-HOSTILE-CONTENT],
   rule: "Text wraps before it is cut. Where it must be cut (a dense table cell, a card excerpt), it ends in an ellipsis, a clamp keeps 2 to 3 lines, and the full text is one operable step away (a link, an expander, the detail page), never hover-only. Headings, actions, error and safety text, prices and the names that tell items apart are never truncated. Text clipped by overflow: hidden with no ellipsis, a single-line box that hides the end of a sentence, or two cards that read the same because their distinguishing words were cut is a finding.",
   values: {clamp_lines: [2, 3]},
   why: "A cut label hides the one word the visitor needed, and clipped text with no ellipsis looks like a rendering fault.",
   fix: "Let the text wrap; where space is fixed, clamp to 2 or 3 lines with an ellipsis and link to the full text.",
   sources: ["ROB-117 (uupm §101 §107 §236 §335)", "ROB-118 (uupm §105, taste §84)"]}
- {id: ROB-007, title: Short labels stay whole on one line, domain: D15, tier: Reflex, check: H, remedy: fix-layout, tests: [T-HOSTILE-CONTENT, T-TRANSLATE, T-WIDTHS],
   rule: "Button labels, primary navigation links, badges and chips stay on one line at every width: shorten first, then set nowrap on a label that can still shrink, then move the navigation into a menu below about 60rem. A chip collection wraps as a whole before any chip shrinks, and a '+n' overflow opens. Footer links, tabs and breadcrumbs wrap to at most two lines and only at a real phrase; sentence-case table heads never wrap. A label of more than about 24 characters is at risk and is checked at every captured width. (Wrapping beats truncation for running text and names, ROB-006; short controls are the exception because a two-line button reads as two buttons.)",
   values: {label_at_risk_chars: 24, menu_below_rem: 60, max_lines_footer_tabs: 2},
   why: "A button or nav link that breaks onto two lines reads as two items and makes the bar uneven, and it is the first thing a translation breaks.",
   fix: "Shorten the label, give it nowrap with room to shrink, or collapse the row into a menu at the width where it no longer fits.",
   sources: ["ROB-119 (uupm §107 §235)", "ROB-120 (hallmark §90 §259 §407)", "ROB-121 (hallmark §90 §407)", "ROB-122 (hallmark §96)"]}
- {id: ROB-008, title: Boxes grow with their content, domain: D15, tier: Reflex, check: H, remedy: fix-layout, tests: [T-HOSTILE-CONTENT, T-STRESS],
   rule: "A box that holds text takes its height from the text: no fixed height on a card, panel or banner whose text can change, and cards in a row line up by stretching to the tallest, not by a set height that the longest text overruns. Cards that keep one height when stacked one per row on a phone while their text lengths differ have a fixed or minimum height. Grid column counts come from the data or auto-flow, never a fixed number paired with a data constant; metric labels are planned against their column (stack the value over the label whenever a label can wrap); a missing image or an empty field leaves the card whole. Fixed boxes are kept only for text that animates or swaps (a rolling count reserves its widest width, tab panels share one height).",
   why: "A design tuned to equal-length sample copy breaks the day a real title runs a line longer or a field is empty.",
   fix: "Remove fixed heights from text boxes, let rows stretch, and reserve space only where text animates.",
   sources: ["ROB-110 (huashu §376)", "ROB-123 (kami §658 §659)", "ROB-124 (taste §419 §430 §432)", "ROB-177 (kami §640 §641)"]}
- {id: ROB-009, title: "Nothing overlaps, is sliced or hides under chrome", domain: D15, tier: Reflex, check: H, remedy: fix-layout, tests: [T-WIDTHS, T-HOSTILE-CONTENT],
   rule: "At every captured width no text is painted under an opaque box, an image or other text (sticky or fixed chrome scrolling over content excepted), nothing on a phone sits under a fixed bar, nothing crosses a section edge, is sliced by an overflow clip or peeks out behind another element, and no element runs past a 375 screen hidden only by an overflow clip on the page (restack it instead). Two sticky elements never stack at top: 0; the second is offset. Lines of type that collide are TYP-022's; sideways scroll is ROB-003's (Floor): cite them.",
   why: "Overlaps and slices are what a visitor sees as broken, and they appear first at the widths and text lengths nobody designed for.",
   fix: "Restack or resize the element at the width where it collides, offset the second sticky element, and give fixed bars matching padding.",
   sources: ["ROB-107 (hallmark §131 §457, taste §84)", "ROB-108 (taste §84, kami §682)", "ROB-103 (hallmark §425)", "ROB-111 (hallmark §427)"]}
- {id: ROB-010, title: The layout holds between and beyond the captured widths, domain: D15, tier: Reflex, check: H, remedy: fix-layout, tests: [T-WIDTHS],
   rule: "The design is judged at each captured width (375, 1280, 1440) and reasoned about across the matrix of conflict C40 (320 to 1920): both sides of each breakpoint the stylesheet declares, a tablet width and landscape. The container is capped and centred at wide sizes (about 1360 to 1520px, text blocks no wider than 1600px, no extra grid columns at 1920); heights that meet mobile browser chrome use dvh or svh, never vh on a hero; safe-area insets are folded into gutters with viewport-fit=cover; phone gutters are 16px and running text never comes within 8px of the edge; nested scroll regions are avoided; a widget whose layout depends on its own box uses a container query. The 1280 by 800 fold holds the hero, 1440 by 900 shows it as one screen.",
   values: {container_px: [1360, 1520], max_text_block_px: 1600, phone_gutter_px: 16, text_edge_px: 8},
   why: "The captures are three points on a continuous range; most layout faults live just either side of a breakpoint or past the widest screen anyone checked.",
   fix: "Cap the container, replace vh with dvh or svh, add safe-area padding, and test each breakpoint at its edges.",
   sources: ["ROB-210 (hallmark §256 §452, uupm §81 §334, taste §641)", "ROB-211 (hallmark §152 §453 §424)", "ROB-212 (kami §168, uupm §244)", "ROB-213 (hallmark §4 §424)", "ROB-214 (hallmark §260 §420, uupm §235)", "ROB-215 (hallmark §260, uupm §148 §235 §243)", "ROB-216 (hallmark §431 §257)", "ROB-218 (uupm §235)", "ROB-219 (hallmark §133, uupm §331)"]}
- {id: ROB-011, title: Room for other languages, domain: D15, tier: Reflex, kind: context, check: H, remedy: fix-harden, tests: [T-TRANSLATE],
   rule: "Leave room for translated strings 30 to 40% longer than the English: a row of navigation links, tabs or buttons that has no room for 35% longer labels, a fixed-width button whose label already fills it, or a heading set to fit one line exactly will break in German or French. Words live in HTML, never only in a picture (a banner, a quote card, a headline set in the image file). Dates are typed into text fields, not native date pickers, on pages not in English. Weighted most when the brief or the page names more than one language or market; on a single-language page it is a Finish-level note unless the layout has no slack at all.",
   values: {expansion: [0.3, 0.4], check_at: 0.35},
   why: "Translation is the commonest real content change, and a layout with no slack fails in every language but the one it was drawn in.",
   fix: "Give rows and buttons room or a wrap, size controls by their content, and move words out of pictures into HTML.",
   sources: ["ROB-126 (hallmark §263)", "ROB-120 (hallmark §90 §259 §407)", "ROB-144 (taste §67)"]}
- {id: ROB-012, title: "Dates, numbers and money follow one locale", domain: D15, tier: Reflex, check: H, remedy: fix-copy, tests: [T-LOCALE-FORMAT],
   rule: "Dates, times, numbers and money are formatted for the reader's locale (Intl.DateTimeFormat, Intl.NumberFormat, Intl.RelativeTimeFormat), not hard-coded strings, and one surface uses one currency, one unit system, one thousands separator and one percent style. A numeric date that reads two ways (03/04/2026) on a page read in more than one country, 12-hour beside 24-hour times, comma and dot separators mixed, or prices in two currencies with no switch is a finding. A single-locale page whose formats are consistent is not. Whether a figure is true is lens-integrity's (INT-011); a unit split from its figure is TYP-024's.",
   why: "A date or price written for one country is misread in the next, and mixed formats on one page read as stitched together.",
   fix: "Format with the locale APIs from one locale setting and use one currency, unit and separator style per surface.",
   sources: ["ROB-145 (hallmark §263, uupm §102 §103 §240, huashu §356)", "ROB-147 (kami §167 §653)"]}
- {id: ROB-013, title: Ready for right-to-left, domain: D15, tier: Finish, kind: context, check: H, remedy: fix-harden, tests: [T-RTL-READY],
   rule: "Spacing, borders, insets and alignment use logical properties (margin-inline-start, padding-inline, inset-inline-end, text-align: start) or are mirrored under [dir=rtl], so the layout can flip. Directional marks mirror in right-to-left: arrows and chevrons that mean next or back, carousels, progress, sliders, charts with a time axis, marquees, parallax and directional motion. Logos, media controls, clocks and numbers do not. On a page that serves or links to a right-to-left language, a failure is reported at Reflex, citing draft ROB-127; elsewhere it is a Finish note about readiness, never a finding against a page that has no such audience.",
   why: "A layout built on left and right has to be rebuilt to ship in Arabic or Hebrew, and an arrow that still points right sends readers backwards.",
   fix: "Replace physical spacing and alignment with logical properties and mirror directional icons and motion under dir=rtl.",
   sources: ["ROB-125 (hallmark §263, adp §264)", "ROB-127 (uupm §247 §364)"]}
- {id: ROB-014, title: Each language and script is declared and has its face, domain: D15, tier: Reflex, check: H, remedy: fix-typeset, tests: [T-SCRIPT-COVERAGE],
   rule: "The html lang names the language the page is written in (its presence is A11-008's, Floor), a document keeps one locale with no bilingual stacking, and locale variants keep the same facts, colours and spacing tokens (only font stacks differ). Mixed-script font stacks are ordered so each script gets the face chosen for it, every glyph the copy uses exists in the chosen faces (no tofu, no system face drawing an arrow, a key symbol or a CJK run mid-line by accident), and language menus do not clip descenders. Which face rendered at all is TYP-004's (Floor); how CJK is set is TYP-023's: cite them.",
   why: "A wrong lang sends screen readers, hyphenation and translation the wrong way, and a glyph from a fallback face is a visible patch in the line.",
   fix: "Set lang to the page's language, order the font stack per script with a face that covers every glyph, and keep one locale per document.",
   sources: ["ROB-128 (kami §61)", "ROB-129 (kami §692 §709)", "ROB-131 (huashu §127, kami §51 §630)", "ROB-116 (huashu §375, kami §708)", "ROB-143 (kami §60)"]}
- {id: ROB-015, title: Content and navigation do not depend on script, domain: D15, tier: Reflex, kind: context, check: H, remedy: fix-harden, tests: [T-NO-SCRIPT, T-HIDDEN-CONTENT],
   rule: "A page meant to be read (a landing page, an article, docs, a shop's product page) shows its text, navigation and primary action with scripts off and when an observer never fires: nothing is hidden at rest until script runs (hide only under a script-added class, or animate from visible), hero words hide only until script or a safety mark of about 700ms, required facts are not in SVG text or behind conditional visibility, key screens have their own URL, and the page throws no script error on load. The share of text hidden is ROB-001's (Floor, hidden_content): cite it; this card judges what the visitor loses. An application's working surface may need script, and says so; a client-rendered marketing page that is blank without it is a finding.",
   values: {hero_safety_ms: 700},
   why: "Scripts fail, load late or are blocked more often than designers think, and crawlers, previews, readers and slow phones see the page without them.",
   fix: "Render content and navigation in the HTML, start visible and animate from visible, and give each key screen a URL.",
   sources: ["ROB-202 (hallmark §84 §445 §347, uupm §156)", "ROB-204 (taste §427)", "ROB-206 (kami §680 §681)", "ROB-207 (kami §681)", "ROB-196 (hallmark §462, huashu §66 §107)", "ROB-200 (uupm §239, kami §709)"]}
- {id: ROB-016, title: "The page degrades on slow and failed networks, not breaks", domain: D15, tier: Reflex, check: H, remedy: fix-harden, tests: [T-FAILURE-PATH, T-SLOW-LINE],
   rule: "When the network is slow or a request fails, the page answers: a timed-out request shows what happened with a retry and keeps everything typed; slow connections get a degraded mode (lower-resolution images, fewer effects) and offline gets a message; a feature that depends on an outside provider (maps, payments, chat, video, fonts) has a fallback. A broken or missing image shows a styled frame in the ground colour, never the browser's broken-image icon or an empty hole, and images sit on a loading fill until they arrive; every WebGL or canvas piece shows a poster first and falls back to a still on missing WebGL2, a lost context or an empty first frame. How a clicked action shows it is working is CMP-001's and CMP-003's: cite them. A request the capture blocked is 'not verified', never a finding.",
   why: "Most visitors meet the slow or failed case some of the time, and a page that only works on a fast, perfect connection looks broken to them.",
   fix: "Add timeouts with retry, a loading fill and a styled broken state for images, a poster for every canvas, and fallbacks for outside providers.",
   sources: ["ROB-194 (uupm §238, taste §67)", "ROB-195 (uupm §233)", "ROB-201 (agent §324)", "ROB-170 (hallmark §463, huashu §66, adp §256)", "ROB-171 (taste §622 §623)", "ROB-174 (taste §630)"]}
- {id: ROB-017, title: Loading never moves what the visitor is reading, domain: D15, tier: Reflex, check: H, remedy: fix-harden, tests: [T-LAYOUT-SHIFT],
   rule: "Everything that arrives late has its space reserved: images declare width and height or an aspect-ratio, data regions load into a skeleton in their own shape, ads, embeds, chat and cookie banners reserve space or render out of flow (a consent banner is never rendered synchronously in the head), web fonts use font-display swap or optional with metric-matched fallbacks (size-adjust, ascent-override) so the swap does not reflow, and a stored theme is read by a tiny inline script before first paint so the page never flashes the wrong mode. Layout shift is not measured by the capture: judge it from what arrives late and whether its space is held.",
   why: "Text that jumps as images, fonts and banners arrive makes visitors lose their place and click the wrong thing.",
   fix: "Give every late element its size up front, load data into shaped skeletons, and match fallback font metrics.",
   sources: ["ROB-164 (hallmark §470 §262, taste §621 §622, agent §288, uupm §233)", "ROB-157 (agent §298 §291)", "ROB-179 (uupm §64 §233, hallmark §297, taste §624)", "ROB-180 (hallmark §297, uupm §91)", "ROB-187 (agent §383, hallmark §301)"]}
- {id: ROB-018, title: Weight fits the page's job, domain: D15, tier: Reflex, kind: context, check: H, remedy: fix-harden, tests: [T-WEIGHT-FOR-JOB],
   rule: "Judge the measured weight against budgets (WARN then FAIL): transfer 1500 then 3000 KiB, images 1200 then 2400, the largest image 350 then 700, JavaScript 450 then 900, CSS 120 then 250, 60 then 110 requests, 4 then 6 font files and 160 then 320 KiB of fonts; lab LCP warns at 2.5s and fails at 4.5s (conflict C41). Over a budget is a finding when the weight buys nothing for the page's job: a 2MB logo, a 6MB hero on a landing page, a full-resolution photo shown at thumbnail size, a WebGL scene behind body text. A photo portfolio may spend its budget on photographs and a product page on its demo video, provided the LCP element is never lazy-loaded (fetchpriority high), images below the fold are lazy, files are served at 2x their shown width or less in AVIF or WebP (a hero at 400KB or less, other photos at 250KB or less), below-fold photos are img not CSS backgrounds, scripts are deferred, WebGL is capped (4 live contexts, paused off-screen) and effect modules that never mount are not loaded. Report observed numbers only; the sweep measures image bytes and LCP (WEB-001): cite it.",
   values: {transfer_kib: [1500, 3000], image_kib: [1200, 2400], largest_image_kib: [350, 700], js_kib: [450, 900], css_kib: [120, 250], requests: [60, 110], font_files: [4, 6], font_kib: [160, 320], lcp_ms: [2500, 4500], hero_kib: 400, photo_kib: 250, max_density: 2},
   why: "Weight is paid by every visitor on every load; it is worth paying only for what the visitor came to see.",
   fix: "Resize and recompress what is oversized, lazy-load below the fold, defer scripts, and cut effects that buy nothing.",
   sources: ["ROB-152 (taste §621)", "ROB-153 (taste §621)", "ROB-154 (taste §621)", "ROB-165 (hallmark §89 §472, taste §622, agent §284)", "ROB-166 (hallmark §262, taste §621 §623, uupm §61)", "ROB-167 (taste §621 §622, hallmark §470, agent §285, uupm §60)", "ROB-168 (taste §622 §623)", "ROB-169 (taste §621 §622)", "ROB-156 (agent §382 §296 §297, uupm §65)", "ROB-161 (taste §626-§629, uupm §981 §1083)", "ROB-162 (taste §621)", "ROB-163 (uupm §118)", "ROB-181 (hallmark §297, taste §624, uupm §233, agent §381)", "ROB-160 (agent §276)"]}
- {id: ROB-019, title: Counts and lists survive their extremes, domain: D15, tier: Reflex, check: J, remedy: fix-harden, tests: [T-EXTREME-COUNTS],
   rule: "Every count, list and search holds at 0, 1, 2, 99, 10000 and 1234567: plurals read right ('1 item', not '1 items'), a zero never leaks as a stray '0' from a falsy conditional, an empty search says 'No results' with suggestions instead of a blank screen or a bare '0 results', lists past about 50 items are virtualised or use content-visibility, and the biggest number fits its badge, column or tile. Empty, loading and error states as designed screens are CMP-016's; tables on phones are CMP-018's: cite them.",
   values: {counts: [0, 1, 2, 99, 10000, 1234567], virtualise_after: 50},
   why: "Sample data always has a handful of items; real accounts have none or thousands, and that is where the layout and the grammar break.",
   fix: "Pluralise with the locale's rules, guard falsy counts, design the empty search, and size counters for their largest value.",
   sources: ["ROB-113 (agent §387)", "ROB-198 (uupm §110, hallmark §321)", "ROB-159 (uupm §140 §233, agent §227 §380)"]}

# ---------------- process ----------------
- {id: PRC-001, title: Capture must be trustworthy, domain: D17, tier: Floor, detector: near_blank, remedy: none, waivable_by: never, tests: [T-VERIFY-VERIFIER],
   rule: "Stop the run if the control render fails or a screenshot is empty (under 0.15% of pixels differ by more than 24 levels from the dominant colour).",
   why: "A blank or wrong render produces confident nonsense.", fix: "Fix the capture (wait for fonts, network, lazy content) and recapture.", sources: ["huashu §49 §106"]}
- {id: PRC-002, title: Redesigns keep content and behaviour, domain: D17, tier: Floor, detector: redesign_loss, remedy: none, waivable_by: brief,
   rule: "A redesign keeps every link, field, handler and id, and does not drop more than 40% of words without the brief saying so.", why: "Silent loss breaks the product.",
   fix: "Restore the missing items or get them cut in the brief.", sources: ["hallmark §521"]}
