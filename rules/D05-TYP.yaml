  status: active
- id: TYP-012
  title: Running text is led for reading
  domain: D05
  tier: Reflex
  check: H
  remedy: fix-typeset
  tests:
  - T-LEADING
  rule: 'Lead running text from its computed line-height: 1.5 to 1.65 on UI and web text, 1.65 to 1.75 on long prose, 1.5 to 1.55 in print (never
    1.6 or more on print body). Lines under 30 characters may sit at 1.4 to 1.5. Multi-line prose is never under 1.3.'
  values:
    ui:
    - 1.5
    - 1.65
    prose:
    - 1.65
    - 1.75
    print:
    - 1.5
    - 1.55
    short_lines:
    - 1.4
    - 1.5
    floor: 1.3
  why: Tight leading makes the eye lose the next line; loose leading breaks a paragraph into separate strips.
  fix: Set a unitless line-height per role on the type tokens.
  sources:
  - TYP-155 (HM §59, UU §88 §236 §298, HS §77, TS §60)
  - TYP-156 (HM §59 §398)
  - TYP-159 (HS §121, KM §40)
  - TYP-160 (KM §39 §40 §179)
  priority: P1
  kind: ban
