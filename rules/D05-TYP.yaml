- id: TYP-016
  title: Headings are set in one voice
  domain: D05
  tier: Reflex
  check: H
  remedy: fix-typeset
  tests:
  - T-HEAD-TREATMENT
  rule: Do not set one word of a heading apart by colour, italic, weight, underline, stroke or highlight. Get stress from a line break or a second
    line at a second size. The one exception is a declared theme signature, used once, in the hero only, in a true italic.
  why: The accent word is the most common generated headline treatment; it shouts one word and turns the rest into filler.
  fix: Set the heading in one weight, one style and one colour; move the stress to a line break.
  sources:
  - TYP-182 (HM §57 §370 §393, HS §59 §60)
  - TYP-183 (HM §57 §298)
  - TYP-153 (HM §57 §370)
  - TYP-184 (HM §57 §393)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: TYP-017
  title: Figures that compare are tabular
  domain: D05
  tier: Finish
  check: H
  remedy: fix-typeset
  tests:
  - T-FIGURES
  rule: 'Where numbers compare (tables, prices, stats, axes, counts, display figures 24px and up), use tabular lining figures (font-variant-numeric:
    tabular-nums lining-nums). When the display face has only oldstyle figures, set the figures in the body face.'
  why: Proportional or oldstyle digits make columns wobble and totals hard to compare.
  fix: Add tabular-nums to the number roles, or move figures to a face that has tabular lining digits.
  sources:
  - TYP-189 (HM §63 §298 §402 §307, HS §129 §138, KM §58 §190)
  - TYP-190 (KM §58 §190)
