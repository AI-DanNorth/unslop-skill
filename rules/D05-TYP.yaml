    - DejaVu Serif
    - Bitstream Vera
    - Calibri
    - Aptos
    - Times New Roman
- id: TYP-005
  title: Type is chosen for this brief
  domain: D05
  tier: Reflex
  check: J
  remedy: fix-typeset
  waivable_by: brand-system
  tests:
  - T-TYPE-SOURCE
  rule: Choose type from the content, the language mix and the voice, and pick names last. The brand's or client's own faces come first and override
    every pairing rule. A default stack (one UI sans for every role, a framework default, the pairing any neighbouring brief would get) is a finding
    unless the brief or the brand chose it.
  why: Type is the first place a brand's voice shows; a default stack makes the artifact sound like every other one.
  fix: Use the brand's faces. With none, choose a display face for the content and the voice, and set the real headline in two or three candidates
    before deciding.
  sources:
  - TYP-110 (HS §117)
  - TYP-120 (HS §117, HM §137)
  - TYP-104 (HS §125 §138, HM §291)
  - TYP-111 (HM §290)
  priority: P1
  kind: ban
  status: active
- id: TYP-006
  title: Each face has one job
  domain: D05
  tier: Reflex
  check: H
  remedy: fix-typeset
  tests:
  - T-FACE-ROLES
  rule: 'Use a display face and a body face (one family may do both). A third face is an outlier with exactly one role: the wordmark, a headline
    figure, or code. A face that appears in several unrelated roles, or two faces that share one role, is drift. One family at several weights
    counts as one face.'
  values:
    faces: 2
    outliers: 1
  why: When faces swap roles between sections, the reader cannot learn what each face signals.
  fix: Give each face one role and move stray elements onto it; drop a face that has no role of its own.
  sources:
  - TYP-101 (HM §52 §290 §391, TS §57, HS §126)
  - TYP-102 (HM §52, TS §57)
  - TYP-114 (HM §64 §296)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: TYP-007
  title: Saturated faces need an argument
  domain: D05
  tier: Reflex
  kind: context
  check: H
  remedy: fix-typeset
  waivable_by: brand-system
  tests:
  - T-TYPE-SOURCE
  rule: A saturated face (the saturated group in data/lexicons/fonts.yaml, such as Playfair Display, Fraunces, Instrument Serif, Space Grotesk
    or Geist) needs an argument from the contract, the brand system or the content. Without one, it is a finding when it sets the whole display
    system or joins a look-family cluster. The face alone is not a finding (conflict C33).
  why: These are the faces generators reach for when asked for taste; without a reason they read as the generator's choice, not the client's.
  fix: Keep the face if the brand chose it; otherwise try a same-build substitute from data/lexicons/fonts.yaml.
  sources:
  - TYP-106 (HM §292, HS §124 §125)
  - TYP-105 (HM §291, TS §30, HS §61)
  - TYP-107 (HS §125)
  priority: P1
  status: active
- id: TYP-008
  title: Monospace only for code and figures
  domain: D05
  tier: Reflex
  check: H
  remedy: fix-typeset
  tests:
  - T-FACE-ROLES
  - T-LABEL-TRANSFORM
  rule: Set monospace only for code, figures, measurements, times, prices and versions, or where mono is the declared material of a technical
    brand. Never set a body paragraph in mono. Mono on labels, captions, meta and table heads is costume when 4 or more small labels use it.
  values:
    min_mono_labels: 4
    label_max_px: 14
  why: Mono lines run about 30% longer and read slower; as label dressing it signals 'technical' with nothing technical behind it.
