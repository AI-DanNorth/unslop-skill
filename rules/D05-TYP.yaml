- id: TYP-018
  title: Punctuation is typeset and consistent
  domain: D05
  tier: Finish
  check: H
  remedy: fix-copy
  tests:
  - T-PUNCTUATION
  rule: Use one quote and apostrophe style throughout; a page that mixes straight and curly marks is the finding (conflict C32). Use a true ellipsis,
    not three dots. Keep a number with its unit on one line with a non-breaking space.
  why: Mixed quotes and split units read as text pasted together from several places.
  fix: Normalise quotes at the content source; join numbers and units with a non-breaking space.
  sources:
  - TYP-193 (HM §63 §403, AS §155, TS §60)
  - TYP-194 (HM §63, TS §60, AS §150 §151)
  priority: P3
  kind: ban
