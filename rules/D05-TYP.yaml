- id: TYP-011
  title: Headlines fit their length
  domain: D05
  tier: Reflex
  check: H
  remedy: fix-typeset
  tests:
  - T-HEADLINE-FIT
  rule: 'Size a headline to its length: up to 20 characters may take full display size, 21 to 50 display, 51 to 90 small display or a split, and
    over 90 needs rewriting. Headings hold to two lines and the hero h1 to three, at every width. A figure never outgrows the h1 or h2 it serves,
    and a heading is never smaller than the text under it.'
  values:
    full_display_chars: 20
    display_chars: 50
    small_display_chars: 90
    max_heading_lines: 2
    max_h1_lines: 3
    max_figure_to_h2: 1.08
  why: A long line at display size becomes a wall of large type; a figure bigger than its heading takes the heading's place.
  fix: Shorten the line or step the size down; move the detail into the line under it.
  sources:
  - TYP-129 (HM §56)
  - TYP-130 (TS §30 §59)
  - TYP-131 (TS §59)
  priority: P1
  kind: ban
