- id: TYP-009
  title: The scale fits the medium
  domain: D05
  tier: Reflex
  check: H
  remedy: fix-typeset
  tests:
  - T-LADDER
  rule: 'Derive sizes from one ratio taken from the body size and fitted to the medium: about 1.2 for dense UI and docs, 1.25 for general web,
    1.333 for editorial, 1.5 for posters and slides. App screens use a fixed scale of 1.125 to 1.2 with no fluid headings. From 1024px wide, adjacent
    heading levels differ by at least 1.3x (1.2x below).'
  values:
    ratio_dense: 1.2
    ratio_web: 1.25
    ratio_editorial: 1.333
    ratio_poster: 1.5
    app_ratio:
    - 1.125
    - 1.2
    min_heading_step: 1.3
    min_heading_step_narrow: 1.2
  why: A marketing scale on a tool shouts over the work; a tool's scale on a landing page gives the eye no place to start.
  fix: Pick the medium's ratio, give each role a step, and collapse the sizes between steps.
  sources:
  - TYP-121 (HS §118, HM §54, UU §90 §297)
  - TYP-122 (HM §54 §348)
  - TYP-125 (TS §59, HM §170)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: TYP-010
  title: One size per kind of element
  domain: D05
  tier: Reflex
  check: H
  remedy: fix-typeset
  tests:
  - T-LADDER
  rule: 'Give each kind of element one size and weight across the artifact: every card title, price, caption and figure the same. Every size is
    a declared step; neighbours such as 12.5, 13.5 and 14.5px are drift.'
  why: When one kind of element changes size between sections, the reader looks for a meaning that is not there.
