- id: TYP-015
  title: Small labels earn their caps
  domain: D05
  tier: Reflex
  check: H
  remedy: fix-typeset
  tests:
  - T-LABEL-TRANSFORM
  rule: 'Text at 15px and under in uppercase, small caps or tracked past 0.03em (labels, captions, table heads, nav, tags, meta, bylines) must
    pass the label transform-delete test: without the caps and tracking it reads worse. When caps stay, track them lightly (conflict C19). Wordmarks,
    tickers and 2 to 5 letter acronyms are exempt. Running text is never set in caps.'
  values:
    max_px: 15
    max_tracking_em: 0.03
  why: Tracked caps on every small label is the generator's sign for 'designed'; it slows reading and says nothing the body face a step smaller
    would not.
  fix: Set labels in the body face a step smaller, in sentence case, untracked.
  sources:
  - TYP-165 (HM §60 §395 §298, TS §30, HS §59)
  - TYP-188 (HM §60 §395)
