- id: TYP-020
  title: Weight steps are clear
  domain: D05
  tier: Reflex
  check: H
  remedy: fix-typeset
  tests:
  - T-LADDER
  rule: Build hierarchy from size, weight and space. Where weight alone separates two roles, take a clear step (400 to 700, or 300 to 800), not
    500 to 600; when a step is unclear, widen the gap or skip a weight rather than add an in-between size. There is no weight-count rule (conflict
    C08). No weight under 400 below 20px.
  values:
    light_max_px: 20
    min_weight_small: 400
  why: Neighbouring weights look like a rendering accident; light weights at small sizes break up on screen.
  fix: Move the two roles to weights far enough apart to see, or separate them by size.
  sources:
  - TYP-133 (KM §47, UU §93)
  - TYP-149 (HM §53 §392)
  - TYP-148 (TS §58, UU §298)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: TYP-021
  title: Display-only faces stay at display size
  domain: D05
  tier: Reflex
  check: H
  remedy: fix-typeset
  tests:
  - T-FACE-ROLES
  rule: Use display-only faces (single-weight, hairline or high-contrast cuts such as Instrument Serif or Cormorant) only at display sizes; their
    thin strokes break up under 24px. Never set whole paragraphs in a display face (in CJK, readers tire after about 200 characters).
  values:
    min_px: 24
  why: A display cut at text size loses its strokes and turns a paragraph into texture.
  fix: Set text sizes in the body face; keep the display cut for headings.
  sources:
  - TYP-118 (HS §124 §134)
  - TYP-215 (HS §126 §138)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: TYP-022
  title: Lines never collide or clip
  domain: D05
  tier: Floor
  check: H
  remedy: fix-typeset
  waivable_by: never
  tests:
  - T-LEADING
  rule: Lines of text never overlap and glyphs are never clipped, at any captured width. Wrapping uppercase display is never led under 1.0. Menus,
    buttons and inputs that hold descenders are not set at line-height 1 inside a fixed height. Confirm every case on the screenshot, not from
    the CSS alone.
  values:
    caps_min_leading: 1.0
    control_leading: 1.35
  why: Letters that overlap or are cut off cannot be read.
  fix: Raise the line-height (1.02 to 1.08 on caps display, about 1.35 on controls) and let the box grow with its text.
  sources:
  - TYP-158 (HM §55 §394 §298)
  - TYP-162 (KM §60)
  - TYP-180 (UU §57)
  priority: P0
  kind: ban
  status: active
- id: TYP-023
  title: CJK text is set for CJK
  domain: D05
  tier: Reflex
  kind: context
  check: H
  remedy: fix-typeset
  tests:
  - T-FACE-ROLES
  - T-LEADING
  - T-MEASURE
  rule: When the artifact sets Chinese, Japanese or Korean text, give it a named CJK face, never the bare system default. Lead CJK body about
    0.2 looser than Latin (Chinese body near 1.8), keep its measure at 22 to 38 characters (best 28 to 32), keep tracking near zero with no Latin
    negative display tracking, and never italicise hanzi.
  values:
    leading_body: 1.8
    measure:
    - 22
    - 38
    measure_best:
    - 28
    - 32
    tracking_em:
    - 0
    - 0.05
  why: Latin settings applied to CJK make dense blocks with cramped lines and slanted characters that have no italic form.
  fix: Add a CJK face to the stack and give CJK text its own leading, measure and tracking.
  sources:
  - TYP-200 (HS §127 §138)
  - TYP-206 (HS §121 §77, KM §54)
  - TYP-207 (HS §120)
  - TYP-209 (HS §133, KM §41 §49 §54)
  - TYP-210 (HS §131)
  priority: P1
  waivable_by: brief
  status: active
