- id: TYP-014
  title: Prose has a readable measure
  domain: D05
  tier: Reflex
  check: H
  remedy: fix-typeset
  tests:
  - T-MEASURE
  rule: Cap running prose at 45 to 75 characters per line (65ch by default) on the text element. Lines averaging 88 or more characters over 3
    or more lines fail. Never squeeze a block under 16 characters a line over 4 or more lines; short ledes and captions under 200 characters may
    sit from 28 characters.
  values:
    range:
