- id: TYP-001
  title: Clear type hierarchy
  domain: D05
  tier: Reflex
  detector: flat_hierarchy
  remedy: fix-typeset
  rule: Adjacent type roles must differ by at least 1.25x in size (or a clear weight step) when three or more roles are in use.
  why: Sizes that are nearly equal make everything read at one level.
  fix: Adopt a scale (1.25 to 1.5) and assign roles to steps.
  sources:
  - impeccable §513
  - huashu §104
  priority: P1
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    min_ratio: 1.25
    min_roles: 3
- id: TYP-002
  title: Sizes on a declared ladder, families limited
  domain: D05
  tier: Reflex
  detector: type_ladder
  remedy: fix-typeset
  rule: Every font size is a declared step; use at most 3 families (warn) and never 4.
  why: Drifting sizes and extra families are craft errors that read as unplanned.
  fix: Collapse sizes to the scale; drop the extra family.
  sources:
  - kami §35
  - hallmark §56
  - huashu §104
  priority: P1
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    max_distinct_sizes: 8
    warn_families: 3
    fail_families: 4
- id: TYP-003
  title: No UI text faces as display type
  domain: D05
  tier: Reflex
  detector: banned_fonts
  remedy: fix-typeset
  rule: Do not set display type (32px and up, or h1-h2) in a UI text face (Inter, Roboto, system-ui and similar). Saturated faces need an argument
    in the contract.
  why: UI faces at display size are the model's default headline.
  fix: Pick a display face for the brief; see substitutes in data/lexicons/fonts.yaml.
  sources:
  - hallmark §291 §390
  - huashu §61 §125
  - taste-skill §30
  priority: P1
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    lexicon: fonts
    display_min_px: 32
- id: TYP-004
  title: The intended font actually renders
  domain: D05
  tier: Floor
  detector: fallback_face
  remedy: fix-typeset
  waivable_by: never
  rule: The face that draws the text must be the declared face, not a fallback.
  why: A silent fallback changes metrics, layout and voice.
  fix: Fix the font load (path, format, font-display) and wait for fonts before capture.
  sources:
  - kami §189 §624 §629
  - hallmark §462
  priority: P0
