  remedy: fix-typeset
  tests:
  - T-LEADING
  rule: Lead display type (32px and up) at 1.0 to 1.15, tighter as it grows; 1.2 or 'normal' on a large heading reads as inherited. Track regular-width
    Latin display at -0.02 to -0.04em (condensed or heavy faces 0 to -0.015em). Never add positive tracking to a Latin heading, and letters never
    touch. Carry display with size and tight setting, not with bold-and-big.
