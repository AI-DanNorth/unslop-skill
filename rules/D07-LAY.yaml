- id: LAY-015
  title: Section order follows the argument
  domain: D07
  tier: Reflex
  check: J
  remedy: fix-layout
  tests:
  - T-STOCK-ORDER
  - T-ANATOMY
  rule: 'Order sections by the argument the page makes, not by the default run (hero, three features, steps, figures, CTA band, footer). Lead
    with the strongest real thing after the hero: what it does, show it, prove it, then act. Steps only for a process the visitor really goes
