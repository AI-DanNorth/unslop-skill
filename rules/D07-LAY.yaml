  waivable_by: brief
  status: active
  values:
    min_px: 2
    max_px: 3
    min_size: 12
    max_container: 900
    max_hits: 4
- id: LAY-024
  title: Nested corners share a centre
  domain: D07
  tier: Finish
  detector: nested_radius
  remedy: fix-layout
  rule: A rounded box evenly inset in a rounded container uses an outer radius of about the inner radius plus the inset; never an inner box rounder
    than its container.
  why: With equal radii the gap between the curves pinches at the corners and the nesting looks off.
  fix: Outer radius = inner radius + padding; or reduce the inner radius to the outer minus the padding.
  sources:
  - stageshow craft.md Spacing and alignment (nested shapes pad evenly)
  priority: P3
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    min_inset: 4
    max_inset: 32
    min_size: 24
    tolerance_px: 4
    tolerance_ratio: 0.5
    max_hits: 4
