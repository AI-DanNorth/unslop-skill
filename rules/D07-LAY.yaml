- id: LAY-007
  title: The first screen answers what, for whom and what next
  domain: D07
  tier: Reflex
  check: H
  remedy: fix-layout
  tests:
  - T-FIVE-SECOND
  rule: Keep the headline, the line under it, the primary action and the lead visual's focal point inside the first screen at 1280x800 and at
    390 wide. On a page that persuades, the primary action is never below the first screen.
