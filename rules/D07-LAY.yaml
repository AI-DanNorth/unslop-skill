- id: LAY-014
  title: No zigzag splits
  domain: D07
  tier: Reflex
  kind: cap
  check: H
  remedy: fix-layout
  tests:
  - T-COMPOSITION-RUN
  rule: Do not alternate text-and-picture splits left and right down the page. Mirror a split at most once (conflict C24), change the ratio between
    two splits (5/7, 4/8, 6/6), and vary weight with a larger lead row instead of A-B-A-B.
  values:
    max_mirrors: 1
  why: Zigzag alternation is the stock feature-page rhythm; it makes each feature look the same size and the same importance.
  fix: Turn the run into one lead split plus a grid, rows or a table, in the order of importance.
