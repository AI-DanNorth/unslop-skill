- id: LAY-009
  title: Group with space before boxes
  domain: D07
  tier: Reflex
  check: J
  remedy: fix-layout
  tests:
  - T-DELETION
  rule: 'Group related items with whitespace first, and climb the surface ladder only as far as needed: whitespace, then a 1px hairline, then
    a tinted well, then a card (border or shadow, never both). Reserve cards for things that are independently interactive or of a different kind.
    Repeated rows carry no ornament.'
  why: Boxes around everything erase the groups they are meant to show; space that is tight within a group and open between groups shows them
    for free.
  fix: Remove boxes where space already groups; keep one card style for real objects.
  sources:
  - LAY-122 (UX §236, KM §67)
  - LAY-143 (HM §74)
  - LAY-142 (HM §4, HM §74, TS §94, TS §192)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
