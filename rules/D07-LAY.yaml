- id: LAY-018
  title: Edges line up on one grid
  domain: D07
  tier: Reflex
  check: H
  remedy: fix-layout
  tests:
  - T-LEFT-EDGES
  rule: Lay sections on one column grid so left edges line up from nav to footer. Text starts on at most two lines (the container's left line
