- id: LAY-023
  title: Edges meet or part clearly
  domain: D07
  tier: Finish
  detector: near_tangent
  remedy: fix-layout
  rule: 'A painted box does not sit 2 to 3 px from its painted container''s edge or from the painted box beside it: line the edges up exactly,
    or part them by at least the layout''s gap.'
  why: 'Edges a hair apart read as an accident: the eye sees a near-miss, not a decision.'
  fix: Share the edge (0 px or one border), or part the boxes by the container's padding, at least 8 px.
  sources:
