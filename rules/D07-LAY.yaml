- id: LAY-011
  title: Every section has mass
  domain: D07
  tier: Reflex
  check: H
  remedy: fix-layout
  tests:
  - T-JUDGE-TILE
  - T-SCREEN-BY-SCREEN
  rule: 'A heading and a paragraph are a head block, not a section. Give every section mass: a visual at least 300px tall, three items across
    spanning at least 70% of the container, a list or table of 3 or more rows, 2 or more form fields, or a statement at section size. Empty area
    over 35% of a section inside its container warns and over 50% fails. Never centre a short block in a tall screen to hide that it is short.'
  values:
    min_visual_px: 300
    min_span_share: 0.7
    warn_empty_share: 0.35
    fail_empty_share: 0.5
  why: Thin sections make the page read as a list of announcements with nothing behind them.
  fix: Add mass (a bigger visual, a body across about 10 columns, a statement) or merge the section into its neighbour. Never add words or shrink
    the gap.
  sources:
  - LAY-151 (HM §34, HM §176, HM §429)
  - LAY-153 (HM §34, HM §172, KM §258)
  - LAY-156 (TS §78)
  - LAY-157 (TS §74, TS §78)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: LAY-012
  title: Vary compositions
  domain: D07
  tier: Reflex
  kind: cap
  check: J
  remedy: fix-layout
  tests:
  - T-COMPOSITION-RUN
  rule: Use 3 to 6 different compositions on a page. Never more than two neighbours with the same skeleton, and any card layout at most twice.
    Head-then-block repeated down the page is a template.
  values:
    min_compositions: 3
    max_compositions: 6
    max_same_neighbours: 2
    max_card_layouts: 2
  why: When every section has the same shape, the reader cannot tell where one idea ends and the next begins.
  fix: Change the composition of the middle section in each run of three; pick the shape the content suggests (a table for specifications, a showcase
    for one picture).
  sources:
  - LAY-167 (HM §195, HM §205, TS §92, TS §99)
  - LAY-168 (HM §174, HM §41)
  priority: P1
  waivable_by: brief
  status: active
- id: LAY-013
  title: Dense sections are followed by quiet ones
  domain: D07
  tier: Finish
  check: J
  remedy: fix-layout
  tests:
  - T-SQUINT
  rule: 'Follow a dense section (grid, table, bento, index) with a quiet one (statement, showcase). After at most two visual sections, place a
    calm one. Earn space by mass: a large gap frames a tall section and is a hole under a short one.'
  why: Unbroken density tires the reader; unbroken calm reads as empty.
  fix: Reorder so dense and quiet sections alternate, or scale the gap to the section it frames.
  sources:
  - LAY-169 (HM §206, TS §92)
