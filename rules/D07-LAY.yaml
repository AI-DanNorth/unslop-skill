- id: LAY-001
  title: Spacing has rhythm
  domain: D07
  tier: Reflex
  detector: spacing_monotony
  remedy: fix-layout
  rule: Do not use one spacing value for more than 60% of gaps; use at least 4 distinct steps across a page.
  why: Uniform gaps make every group look equally related.
  fix: Tighten within groups, open between groups.
  sources:
  - impeccable §540
  - hallmark §76
  priority: P1
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    max_share_one_value: 0.6
    min_values: 10
    min_distinct: 4
- id: LAY-002
  title: Spacing on the scale
  domain: D07
  tier: Finish
  detector: off_scale_spacing
  remedy: fix-layout
  rule: Spacing values sit on the 4px scale; no more than 3 off-scale values.
  why: Off-scale values are drift.
  fix: Snap to the nearest step.
  sources:
  - hallmark §76
  - huashu §104
  priority: P3
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    base_px: 4
    max_off_scale: 3
- id: LAY-003
  title: Headings sit with their content
  domain: D07
  tier: Reflex
  detector: heading_rhythm
  remedy: fix-layout
  rule: A heading must be closer to its own content than to the block above it.
  why: Otherwise headings visually belong to the wrong section.
  fix: Increase space above headings; reduce space below.
  sources:
  - impeccable §541
  priority: P1
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    min_violations: 2
- id: LAY-004
  title: No dead bands
  domain: D07
  tier: Reflex
  detector: dead_band
  remedy: fix-layout
  rule: No empty vertical band taller than 160px at any fold width.
  why: Dead bands read as broken layout and push content below the fold.
  fix: Remove the empty band or fill it with content that earns the space.
  sources:
  - hallmark §453
  priority: P1
  kind: ban
  check: M
  waivable_by: brief
  status: active
  values:
    max_empty_px: 160
- id: LAY-005
  title: Every screen has a reason
  domain: D07
  tier: Reflex
  check: J
  remedy: fix-layout
  tests:
  - T-SCREEN-BY-SCREEN
  - T-JUDGE-TILE
  rule: Scroll the artifact one screen at a time (1440x900 tiles). Every screen holds one thing big enough to be its reason, and the first screen
    has a focal point. This outranks every detail finding.
  why: A screen with nothing to look at is where visitors stop scrolling; detail fixes on it change nothing.
  fix: Give the screen a lead element (the section's visual, a statement at section size, a table) or merge it into its neighbour.
  sources:
  - LAY-110 (HM §157, HM §210)
  - LAY-101 (TS §99)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: LAY-006
  title: Hierarchy survives the squint
  domain: D07
  tier: Reflex
  check: H
  remedy: fix-typeset
  tests:
  - T-SQUINT
  rule: With the render blurred, the primary element, the secondary elements and the groups read in that order, each section keeps a shape, and
    the page has a rhythm of heavy and light. Build the order from size, weight and space, never from colour or ornament alone.
  why: If the order disappears when the words blur, the reader has to read everything to find what matters.
  fix: Enlarge the primary element, quiet the competitors, and open the space between groups.
  sources:
  - LAY-102 (HM §210, HM §151, HU §99)
  - LAY-106 (UX §235, KM §177-178)
  priority: P1
