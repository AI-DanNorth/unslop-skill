  remedy: fix-polish
  tests:
  - T-ONE-REGISTER
  rule: 'Pictures that sit together share one light, one grade and one register: never studio black beside daylight, HDR beside a snapshot, or
    one black-and-white frame among colour ones unless it is the one deliberate exception. Photographs on a product or service page share one
