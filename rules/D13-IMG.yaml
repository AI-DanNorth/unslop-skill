- id: IMG-005
  title: No drawn stand-ins for real things
  domain: D13
  tier: Reflex
  check: H
  remedy: explore-directions
  tests:
  - T-STAND-IN
  rule: 'SVG and CSS draw only icons from one set, the logo, charts and diagrams of real data and plain geometry. Objects, plants, animals, people,
    products, buildings and scenes drawn in SVG or CSS past icon size, CSS silhouettes, bevelled fakes and styled-div ''product UI'' standing
    in for a product that can be captured are findings. No hand-drawn browser bars, traffic lights, OS title bars or notches around a screenshot:
    a real screenshot in a figure, or one real device frame with real content. No photo of a screen showing someone else''s interface. A deliberate
    product illustration (an unbuilt product, or a simplified marketing shot of the real one) is judged with IMG-007 instead (conflict C48).'
  why: A drawn stand-in looks like the real thing at a glance and like nothing on a second look; it tells the visitor the real thing was not available.
  fix: Replace the drawing with a capture or photograph of the real thing, or with type; keep SVG for icons, the logo and real data.
  sources:
