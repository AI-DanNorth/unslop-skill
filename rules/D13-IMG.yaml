- id: IMG-003
  title: Every picture carries a fact
  domain: D13
  tier: Reflex
  check: J
  remedy: fix-distill
  tests:
  - T-DELETION
  - T-DELETE-PICTURE
  - T-PROMISE-PICTURED
  rule: 'Remove each picture in your head: the page must lose a fact (what the product looks like at work, who runs the place, what the dish is,
    the step the text describes). A picture that only sets a mood, repeats the heading, or fills the right half of a split hero goes, and the
    picture beside a concrete promise (''takes four crates'') shows it. Whether the lead material fits the business kind and whether every headline
    promise is pictured are lens-concept''s (CON-013 to CON-017); this card judges each picture that is there.'
  why: A picture that says nothing costs the visitor attention and pushes the facts below the fold.
  fix: Cut the mood picture or replace it with one that shows the fact the section claims.
  sources:
