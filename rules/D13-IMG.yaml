- id: IMG-006
  title: Product captures are real, readable and in a telling state
  domain: D13
  tier: Reflex
  check: J
  remedy: fix-layout
  tests:
  - T-CAPTURE-READ
  rule: A product shot is a capture of the real product doing its job, in a telling state (the main screen at work, a cropped detail, a second
    screen, the phone view), captured at 2x. A login screen, an empty state or a splash is not a product shot. Captures are scrubbed (no real
    names, emails, tokens, file paths, debug overlays or unintended errors), keep their UI text, numbers and controls inside the crop (a capture
    too tall to fit is split into two or three panels with one frame and padding), and keep captured text readable at the size shown (about 11px
    or more on screen). A redraw is labelled 'schematic' or 'concept'. Terminal tools show their real output in a code block. Whether software
    leads with its own UI is lens-concept's (CON-014); whether numbers inside the shot are honest is lens-integrity's (INT-013).
  values:
    capture_scale: 2
    min_shown_text_px: 11
  why: A capture the visitor cannot read, or one that shows a login box, proves nothing about the product.
  fix: Recapture the product at 2x in the state the section describes, crop to the part that matters, and split tall screens into panels.
  sources:
