  tests:
  - T-EMPTY-FRAME
  rule: 'A shipped artifact shows no grey or tinted box where a picture should be, no empty wash or gradient block of 300 by 200px or more standing
    in for a picture, no half-loaded frame at any captured width, no default or sample image, and no visible placeholder label (''your screenshot
    here'', ''16:9 image'', a ratio note, a ''sample'' chip). A page with more than five empty slots, or four in a row, is a wireframe. In a labelled
