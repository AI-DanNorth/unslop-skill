- id: IMG-011
  title: Text over pictures stays readable
  domain: D13
  tier: Reflex
  check: H
  remedy: fix-layout
  tests:
  - T-TEXT-ON-IMAGE
  rule: 'Words over a photograph sit on its calmest part, on a scrim (35 to 65% of the theme ink from the text edge) or a solid plate, and reach
    4.5:1 (3:1 for display text) on the worst pixels beneath them, measured on the textured or photographic result, not the flat token (conflict
    C20: allowed when the worst-pixel contrast passes). The text is its own layer above the picture, never baked into the image file, and pills
    and labels are not stuck on photographs. A contrast failure you can measure on the tile is lens-a11y''s Floor (A11-001): cite it there; this
    card judges placement, scrim and layering.'
  values:
    body_contrast: 4.5
    display_contrast: 3
    scrim_pct:
    - 35
    - 65
  why: Text that crosses a busy picture is unreadable in parts, and text baked into an image cannot be read by translation, search or a screen
    reader.
  fix: Move the text to the calm part or off the picture, add a scrim or a plate, and set the words in HTML above the image.
  sources:
  - IMG-153 (hallmark §274, taste §560)
  - IMG-155 (hallmark §268)
  - IMG-114 (hallmark §277, taste §566, uupm §275)
  - IMG-159 (taste §35)
