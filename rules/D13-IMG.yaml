- id: IMG-013
  title: One icon system
  domain: D13
  tier: Reflex
  check: H
  remedy: fix-quieter
  tests:
  - T-ICON-SYSTEM
  rule: 'Each surface uses one icon library, one stroke width and one style (a brand mark in two places or fewer may differ). No set is a tell
    by itself, Lucide included (conflict C47); two line sets, glyphs of one set at different stroke widths, or a set mixed with hand-drawn glyphs
    is. Icons sit on their grid (16, 20, 24 or 32px; a 24 viewBox shown at 24, never scaled to 19), inherit currentColor, and appear only where
    they help find or name something: not every heading or feature needs one. Filled at 14px and under is fine in dense UI (conflict C49). The
    sweep measures the tells: icon tiles above headings (SLP-003), emoji as icons (SLP-013), a sparkle for AI (SLP-015), filled and outline mixed
    in one group (SLP-017): cite them.'
  values:
    grid_px:
    - 16
    - 20
    - 24
    - 32
    max_extra_brand_marks: 2
  why: Icons from several sets, sizes and weights read as collected, and an icon on every heading stops meaning anything.
  fix: Pick one set and one stroke width, redraw or replace the odd glyphs, snap sizes to the grid, and cut icons that only decorate.
  sources:
