- id: IMG-012
  title: Treatment and texture come from the brand
  domain: D13
  tier: Reflex
  check: H
  remedy: fix-quieter
  tests:
  - T-TREATMENT
  rule: 'No grain, halftone, dither, duotone, blur, blend or filter is laid over page photographs, UI or text unless the brand system names that
    treatment (conflict C20). Texture appears only when the theme names it or the lineage is print, in one family per page (grain, halftone, misregistration,
    scanline or deckle, never two), at opacity 0.08 or less page-wide, 0.15 or less scoped to a card, 0.05 or less (or none) under body text,
    and never animated. Decorative grid or stripe backgrounds need a canvas, map or measuring tool under them. Hover zoom stays inside the frame
    at 1.02 to 1.03, with no rotate (conflict C17). Glow halos and stock gradients the sweep measures are SLP-007 and SLP-008: cite them.'
  values:
    texture_opacity_page: 0.08
    texture_opacity_card: 0.15
    texture_opacity_under_text: 0.05
    hover_zoom_max: 1.03
  why: A filter preset makes every photograph look like the same template, and texture over text costs contrast for nothing.
  fix: Remove filters and texture the brand does not name, keep one texture family at its budget, and stop any texture from moving.
  sources:
