- id: IMG-014
  title: Logos are the owners' marks at even weight
  domain: D13
  tier: Reflex
  check: J
  remedy: fix-polish
  tests:
  - T-LOGO-ROW
  rule: 'A named tool, partner or customer is shown with its real logo as its owner draws it: in its own colours, or in the owner''s official
    one-colour version when the whole row is set in one neutral. A mark is never redrawn, re-tinted into the page accent, stretched or approximated.
    A row of logos has even visual weight: a wordmark about 0.7 of the row height and never more than 4.5 times as wide as tall; in tiles, a landscape
    mark about 70% of the tile width, a portrait one about 68% of its height, a square one about 60%. Mockup collateral (cards, signage) uses
    the client''s real logo. Whether the companies are real customers is INT-010''s (Floor) and a one-letter tile in a brand colour is SLP-016''s:
    cite them.'
  values:
    wordmark_height: 0.7
    max_aspect: 4.5
    tile_landscape_width: 0.7
    tile_portrait_height: 0.68
    tile_square: 0.6
  why: A redrawn or uneven logo row looks careless at best and invented at worst.
  fix: Use each owner's official mark, set the row in one treatment, and size each mark by visual weight, not by box.
  sources:
  - IMG-171 (taste §360 §366 §376, huashu §34, stageshow §28)
  - IMG-173 (taste §365)
  - IMG-174 (taste §366-367, stageshow §28)
