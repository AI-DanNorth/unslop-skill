- id: IMG-007
  title: A product illustration is built to be read
  domain: D13
  tier: Reflex
  kind: context
  check: H
  remedy: fix-distill
  tests:
  - T-ILLUSTRATION-READ
  rule: 'Judge every faux UI or product mockup against its five ways to fail: too much (packed with panels), too little (bars and blank pills),
    generic (no domain content), the wrong look (not the product''s own tokens) and the wrong chrome (a browser bar around a product that is not
    a website). A good one budgets words, not elements: three to seven real strings where the eye lands (the title, the thing acted on, the result)
    and bars of varied width elsewhere, two or three real rows where the story touches a list, the domain''s signature content (album art, thumbnails,
    avatars), the feature''s signal once, one active surface when there are several windows, type at real UI sizes for the shown size (11 to 15px,
    never under 10px), the product''s own icon pack first (conflict C47), and a phone kept at its real proportions. Faux UI that stands in for
    a product that can be captured is IMG-005''s; staged result figures inside it are INT-013''s.'
