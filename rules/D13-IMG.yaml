- id: IMG-001
  title: No AI-default or cliche imagery
  domain: D13
  tier: Reflex
  check: J
  remedy: explore-directions
  tests:
  - T-AI-LOOK
  - T-MATERIAL-SOURCE
  rule: 'No picture comes from the generated-page kit: illustration packs and characters (unDraw, Humaaans, Storyset, Lottie mascots), glossy
    3D blobs and isometric scenes, gradient spheres, mesh blobs, orbs or aurora fields used as hero art or behind text, robot faces, circuit boards,
    digital rain, glowing particles, and the mood-stock subjects (curtains, plant shadows, fog, latte art from above, a laptop on a desk, a handshake).
    A generated still is allowed only when the brief asks for one, and then it is inspected: one subject, place, light and lens, no text in the
    picture, no face to camera, and none of the generator''s marks (extra or fused fingers, melted lettering, doubled furniture, plastic skin,
    the same face twice). data/lexicons/cliche-imagery.yaml lists the subjects; the imagery table matches it on alt text and file names, and the
    lens looks at the picture itself. A page whose whole direction is the tech-cliche look is CON-011''s; this card judges each picture.'
  why: These pictures appear on thousands of generated pages, so a visitor reads them as no picture at all and as a sign that nobody chose the
    material.
  fix: 'Replace the picture with the client''s own photograph, capture or work; where there is none, set the fact in type or leave a [DATA NEEDED:
    what the picture must show] slot.'
  sources:
  - IMG-111 (hallmark §277)
  - IMG-112 (huashu §60, hallmark §277)
  - IMG-140 (hallmark §122, huashu §83)
  - IMG-131 (taste §36, hallmark §265)
  priority: P1
  kind: ban
  waivable_by: brief
  status: active
- id: IMG-002
  title: Pictures are the client's own material
  domain: D13
  tier: Reflex
  check: J
  remedy: explore-directions
  tests:
  - T-MATERIAL-SOURCE
  rule: 'Take pictures in this order: the client''s own photographs and work, captures of the real product, the product built in HTML when it
    is not built yet, a licensed library photo, a generated still only when the brief asks, and type at full scale. The subjects that are content
    (the product, the place, the people, the animal, the dish) are shown: a product page that never shows the product fails. Library stock fills
    detail slots only (at most one picture in three) and never the hero, a person, the room, the shopfront or the product; a library frame is
    never passed off as the client''s own room, staff or region. Illustration is used when the client owns an illustration system. When a real
    asset cannot be found the gap is marked honestly ([DATA NEEDED], or the panel left out), never filled with a near miss. A stock or generated
    face presented as a customer, staff member or reviewer is INT-009''s (Floor), and a face-service or hotlinked-stock URL is INT-003''s (Floor):
    cite them.'
  values:
    library_stock_max_share: 0.33
    never_stock:
    - hero
    - person
    - room
    - shopfront
    - product
  why: The visitor came to see this product, place or team; a picture that could belong to anyone says the client had nothing to show.
  fix: Use the client's own photographs and captures in the lead slots, move any library photo to a detail slot, and mark what is missing instead
    of filling it.
  sources:
  - IMG-101 (hallmark §114 §264, taste §549, kami §228 §639)
  - IMG-103 (huashu §81, taste §35 §554)
  - IMG-113 (taste §562, hallmark §264)
  - IMG-132 (taste §549)
  - IMG-130 (taste §36 §550-551 §553)
  - IMG-110 (kami §228 §265 §639, huashu §39 §86)
  priority: P1
  kind: ban
  waivable_by: brief
