name: Test set 1 (live)
built: '2026-11-08'
note: >
  Live sites from the web research and repo agents. Capture these from a machine with normal internet access
  (local Claude Code). Labels are what the citing source claims, not audit results. Sites change: record the
  capture date, and treat a redesigned or dead site as "not verified", never as a pass.
