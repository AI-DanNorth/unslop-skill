name: Test set 2 (controlled pairs)
# One fault per pair: the bad and good halves of Stageshow's teaching pairs (benjitaylor/skills, MIT), captured one
# half at a time from the local playground, with the other half, the captions and the lesson header removed from the DOM by `isolate`.
# Expected labels live only here. Reviewers never see the lesson id: withhold_target keeps the URL out of run.json and manifest.json.
sources:
  stageshow:
    github: benjitaylor/skills
    commit: 299140fafd08df55a9c234e610c3f64af3f45531
# Serve the playground first: cd <refs>/stageshow/stageshow && npm ci && npx vite playground --config playground/vite.config.ts --port 5199 --strictPort --host 127.0.0.1
# expect: slop for the six style faults that are AI tells; borderline for single craft faults; good for good halves.
items:
- id: P01
  url: http://127.0.0.1:5199/?capture=contrasts&lesson=edge-separation
  path: stageshow playground
  repo: stageshow
  commit: 299140fafd08df55a9c234e610c3f64af3f45531
  medium: web
  kind: page
  expect: borderline
  group: pair-composition
  pair: edge-separation
  half: bad
  why: 'bad half: The confirmation almost touches the panel'
  withhold_target: true
  widths: 375,1440
  capture_flags:
  - --no-interact
  isolate:
    remove:
    - .tc-picker
    - section > header
    - figcaption
    pair:
      parent: '[class*="-pair"]'
      child: figure
      keep: 1
