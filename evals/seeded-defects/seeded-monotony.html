<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacing monotony seed</title>
<meta name="unslop-seeds" content="spacing_monotony">
<style>
  body { margin: 0; font: 18px/1.6 "Liberation Sans", sans-serif; color: #222; background: #fafafa; }
  * { margin: 0; padding: 0; }
  main, section, h1, h2, p, ul, li { margin: 24px; padding: 24px; }
</style></head>
<body><main>
  <h1>Every gap is the same</h1>
  <section><h2>First block</h2><p>All margins and paddings on this page are 24 pixels, so nothing groups.</p></section>
  <section><h2>Second block</h2><p>Related and unrelated things sit at exactly the same distance.</p><ul><li>One</li><li>Two</li><li>Three</li></ul></section>
</main></body></html>
