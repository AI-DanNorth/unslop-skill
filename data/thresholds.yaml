# Every numeric limit used by scripts/checks, keyed by detector.
# Resolution order (core/precedence.md): brief > brand > media adapter > profile > this file.
# `tier` is the default tier of a hit; `rule` is the card the finding cites.
version: 1
widths: {web: [320, 375, 414, 768, 1024, 1280, 1440, 1920], fold: [[1280, 800], [1440, 900], [1920, 1080]]}

# Exhibits (live round 1, L19 and L20): regions a page shows on purpose as examples, such as a slop specimen or a
# "before" panel, found from the class or id names of the region's root (core.Evidence.exhibit_ids). The listed
# slop-tell and copy detectors leave them out; accessibility, robustness and motion detectors never do. A root taller
# than max_share of the page is ignored, so a page that is itself marked "slop" is still judged as a whole.
exhibits:
  pattern: '(^|[\s_-])(slop|specimens?|anti-?patterns?|antipatterns?|dont|do-not|bad-example|before)([\s_-]|$)'
  max_share: 0.5
  detectors: [eyebrow, numbered_labels, icon_tile, side_tab_border, card_kit, container_monotony, gradient, glow, neon_violet,
              stock_swatches, banned_fonts, lexicon_copy, repeated_label, emoji_icons, ai_sparkle, invented_mark, mixed_icons,
              nested_cards, chrome_glyphs, invented_metrics, default_names, fake_people, placeholder_residue, stat_band, em_dash,
              near_tangent, nested_radius, unit_wrapped]

detectors:
  # ---- slop: visual tells ---------------------------------------------------
  eyebrow:          {rule: SLP-001, tier: Reflex, max_size_px: 14, max_ratio_to_heading: 0.45, min_tracking_em: 0.06, min_heading_px: 20, max_gap_px: 48, budget: 0}
  numbered_labels:  {rule: SLP-002, tier: Reflex, max_size_px: 13, min_heading_ratio: 1.3, min_count: 2, budget: 0}
  icon_tile:        {rule: SLP-003, tier: Reflex, min_px: 32, max_px: 128, min_tint_alpha: 0.05, min_repeats: 3}
  side_tab_border:  {rule: SLP-004, tier: Reflex, min_side_px: 2, max_other_px: 1, min_radius_px: 4}
  card_kit:         {rule: SLP-005, tier: Reflex, min_same_recipe: 4, wide_shadow_px: 32, min_row: 3}
  container_monotony: {rule: SLP-006, tier: Reflex, min_selectors: 6}
  gradient:         {rule: SLP-007, tier: Reflex, max_stops: 3, max_hue_span_deg: 40,
                     banned_pairs: [[265, 330, 200, 264], [265, 330, 331, 25], [170, 230, 265, 330]]}   # violet-blue, violet-pink, cyan-violet (oklch hue ranges)
  glow:             {rule: SLP-008, tier: Reflex, min_blur_x_alpha_px: 3, spotlight_min_alpha: 0.14}
  neon_violet:      {rule: SLP-009, tier: Reflex, violet_hue: [265, 330], violet_min_chroma: 0.12, cyan_hue: [170, 230], cyan_min_chroma: 0.10, dark_bg_max_l: 0.40, min_px: 24}   # oklch hue and chroma
  accent_footprint: {rule: CLR-001, tier: Reflex, fold: [1280, 800], warn_pct: 5, fail_pct: 8}
  stock_swatches:   {rule: CLR-002, tier: Reflex, lexicon: swatches, min_used: 3}
  # ---- type and spacing -----------------------------------------------------
  flat_hierarchy:   {rule: TYP-001, tier: Reflex, min_ratio: 1.25, min_roles: 3}
  type_ladder:      {rule: TYP-002, tier: Reflex, max_distinct_sizes: 8, warn_families: 3, fail_families: 4}
  banned_fonts:     {rule: TYP-003, tier: Reflex, lexicon: fonts, display_min_px: 32}
  fallback_face:    {rule: TYP-004, tier: Floor, bad_faces: [DejaVu Sans, DejaVu Serif, Bitstream Vera, Calibri, Aptos, Times New Roman]}
  spacing_monotony: {rule: LAY-001, tier: Reflex, max_share_one_value: 0.60, min_values: 10, min_distinct: 4}
  off_scale_spacing: {rule: LAY-002, tier: Finish, base_px: 4, max_off_scale: 3}
  heading_rhythm:   {rule: LAY-003, tier: Reflex, min_violations: 2}
  dead_band:        {rule: LAY-004, tier: Reflex, max_empty_px: 160}
  # ---- copy -----------------------------------------------------------------
  words_per_screen: {rule: CPY-001, tier: Reflex, screen_px: 900, warn: 80, fail: 95}
  page_words:       {rule: CPY-002, tier: Reflex, fail: 450}
  h1_words:         {rule: CPY-003, tier: Reflex, fail: 7, max_chars: 50}
  em_dash:          {rule: CPY-004, tier: Reflex, budget: 0, saturation_count: 8, saturation_per_chars: 500}
  lexicon_copy:     {rule: CPY-005, tier: Reflex, lexicons: [buzzwords, stock-phrases, button-labels, self-labels, chrome-glyphs]}
  repeated_label:   {rule: CPY-006, tier: Reflex, min_repeats_in_card: 3}
  emoji_icons:      {rule: SLP-013, tier: Reflex, min_px: 16, min_count: 2}
  # icons (source 21: Stageshow craft.md Icons and logos; invented_mark ported from film-checks detectInventedMark). Named glyphs only.
  ai_sparkle:       {rule: SLP-015, tier: Reflex, max_px: 48, max_hits: 4, ligatures: [auto_awesome, auto_fix_high, magic_button],
                     names: 'sparkles?|magic[-_ ]?wand|wand[-_ ]?(magic|sparkles?)|\bwand\b|auto[-_]?awesome|\bbi-stars\b|ai[-_]sparkle'}
  invented_mark:    {rule: SLP-016, tier: Reflex, min_px: 14, max_px: 44, min_spread: 0.24, max_hits: 4,   # spread: 60/255, colorlib channels are 0-1
                     brands: 'chase|wells fargo|bank of america|citibank|barclays|hsbc|monzo|revolut|capital one|goldman|jpmorgan|stripe|paypal|visa|mastercard|amex|american express|slack|figma|notion|linear|github|gitlab|vercel|netlify|shopify|dropbox|google|gmail|apple|microsoft|amazon|aws|spotify|netflix|uber|lyft|airbnb|zoom|discord|twitter|meta|facebook|instagram|tiktok|openai|anthropic'}
  mixed_icons:      {rule: SLP-017, tier: Finish, min_px: 10, max_px: 32, min_each: 3, min_group: 3, width_ratio: 1.3, max_hits: 4}   # width check: set 2 icon pairs (1 vs 2.2px, 2.2 vs 3px strokes). min_each 3: live L25 (Linear status glyphs, 4 filled 2 outline) and L06 (footer social logos, 2 filled 3 outline) are not mixed sets
  # craft (source 21: Stageshow craft.md Spacing and alignment). Finish only; px are CSS px at the captured width.
  near_tangent:     {rule: LAY-023, tier: Finish, min_px: 2, max_px: 3, min_size: 12, max_container: 900, max_hits: 4}
  nested_radius:    {rule: LAY-024, tier: Finish, min_inset: 4, max_inset: 32, min_size: 24, tolerance_px: 4, tolerance_ratio: 0.5, max_hits: 4}
  unit_wrapped:     {rule: TYP-024, tier: Finish, max_chars: 14, max_hits: 4}
  nested_cards:     {rule: SLP-014, tier: Reflex, max_depth: 4}
  chrome_glyphs:    {rule: SLP-010, tier: Reflex, budget: 0}
  # ---- integrity ------------------------------------------------------------
  invented_metrics: {rule: INT-001, tier: Floor, lexicon: invented-metrics}
  default_names:    {rule: INT-002, tier: Reflex, lexicon: default-names}
  fake_people:      {rule: INT-003, tier: Floor, lexicon: fake-people}
  fake_send:        {rule: INT-004, tier: Floor, lexicon: fake-success}
  placeholder_residue: {rule: INT-005, tier: Floor, lexicon: self-labels, group: residue}
  stat_band:        {rule: INT-007, tier: Reflex, min_px: 24, min_count: 3}
  data_slots:       {rule: INT-006, tier: Reflex, max_per_page: 2, pattern: "\\[DATA NEEDED"}
  # ---- accessibility --------------------------------------------------------
  contrast:         {rule: A11-001, tier: Floor, body: 4.5, large: 3.0, large_px: 24, large_bold_px: 18.66, apca_body_lc: 60, apca_large_lc: 45,
                     scaled_ratio: 0.85, mock_hint: '(?:^|[-_]|(?<=[a-z0-9])(?=[A-Z]))(?i:graphic|mock(?:up)?|illustration|screenshot|preview|demo|frame)s?(?![a-z])'}
                     # mock_hint / scaled_ratio: text in a product illustration (class token on a non-interactive ancestor) or CSS-scaled
                     # (glyph box < scaled_ratio x font size) is incidental under WCAG 1.4.3 and drops to Reflex (live round 1: L25 Linear frame, L27 Stripe graphics)
  text_floor:       {rule: A11-002, tier: Floor, hard_px: 12, body_px: 16, dense_ui_px: 14, label_px: 12, min_run_chars: 28, max_label_runs: 2, min_shrunk: 3,
                     scaled_ratio: 0.85, mock_hint: '(?:^|[-_]|(?<=[a-z0-9])(?=[A-Z]))(?i:graphic|mock(?:up)?|illustration|screenshot|preview|demo|frame)s?(?![a-z])'}   # Floor below hard_px; Reflex below dense_ui_px; Finish below body_px; mock text drops to Reflex
  focus_ring:       {rule: A11-003, tier: Floor, min_contrast: 3.0, fail_below: 2.95}
  targets:          {rule: A11-004, tier: Floor, floor_px: 24, touch_px: 44, touch_tier: Reflex, footer_tier: Reflex}   # footer links: Reflex (owner call, 9 Nov 2026)
  img_alt:          {rule: A11-005, tier: Floor}
  control_names:    {rule: A11-006, tier: Floor}
  headings_landmarks: {rule: A11-007, tier: Reflex}
  lang_and_title:   {rule: A11-008, tier: Floor}
  zoom_blocked:     {rule: A11-009, tier: Floor}
  form_labels:      {rule: A11-010, tier: Floor}
  reduced_motion:   {rule: A11-011, tier: Floor, spinner_names: 'spin|loader|loading|progress|skeleton|blink|caret', font_hosts: 'fonts\.googleapis|fonts\.gstatic|typekit\.net|fonts\.bunny'}   # live round 1: L31 spinners, L30 unreadable sheet
  # ---- robustness and motion ------------------------------------------------
  hidden_content:   {rule: ROB-001, tier: Floor, max_hidden_share: 0.30, observer_wait_ms: 4000}
  phone_parity:     {rule: ROB-002, tier: Reflex, desktop: 1440, phone: 375, max_hidden_words: 40}
  overflow:         {rule: ROB-003, tier: Floor, tolerance_px: 1}
  widows:           {rule: ROB-004, tier: Finish, min_last_line_share: 0.35, widths: [375, 1280]}
  motion_css:       {rule: MOT-001, tier: Reflex, max_overshoot: 1.05, exit_ratio: [0.60, 0.75], banned: ["transition: all", "transition-property: all"], layout_props: [width, height, top, left, right, bottom, margin, padding]}
  # motion: measured from motion.json (transition frames seeked at 10 ms steps after each trigger click).
  #   max_ms           per trigger kind. MOT-126/127/128 (hallmark §95, uupm §168, agent §78, huashu §337): 150-300 ms is the
  #                    starting range; menus and toggles ~220 ms, modal/drawer/accordion ~420 ms. Duration = last 10 ms
  #                    step at which a changed element still differs from its end state.
  #   min_enter_scale  MOT-141 (uupm §237, hallmark §329): modal panel 0.96 -> 1; transitions-dev tokens: dropdown 0.97,
  #                    modal 0.96; its "generic AI" demo uses 0.85 (example.html generic block). 0.90 leaves margin.
  #                    Applies to surfaces (min_root_px and up): glyph swaps scale from 0.25 in the same tuned tokens
  #                    (--icon-swap-start-scale on 16 px icons).
  #   max_travel_px    MOT-146 (huashu §349 §365, uupm §156, agent §28): entrances translate 8-16 px; MOT-188: menu drop
  #                    6 px; transitions-dev page slide 8 px vs generic 30 px. Exempt: elements that end on a viewport
  #                    edge (drawers and sheets slide their own width).
  #   max_overshoot    MOT-001 / MOT-131 (hallmark §323 §327): nothing past 1.05 of its end size or travel in UI state.
  #   banned_easing    MOT-129 (hallmark §82 §342, uupm §14 §237, taste §410): never the browser default `ease`;
  #                    MOT-128: never linear for core UI movement (Finish tier).
  #   layout_px        MOT-118: animations must not reflow other content; other elements caught mid-way between their
  #                    start and end positions by more than this moved during the transition.
  #   reduced_*        A11-011 / WCAG 2.2 2.3.3 (hallmark §330): with prefers-reduced-motion: reduce nothing moves or
  #                    scales; opacity may change. Hits cite reduced_rule at Floor.
  motion:           {rule: MOT-002, tier: Reflex, max_ms: {menu: 300, tab: 300, button: 300, disclosure: 450, dialog: 450},
                     min_enter_scale: 0.90, max_travel_px: 16, max_overshoot: 1.05, min_overshoot_px: 1, banned_easing: [ease], linear_movement: true,
                     layout_px: 2, settle_px: 1, settle_opacity: 0.02, min_root_px: 32, reduced_move_px: 2, reduced_scale: 0.02, reduced_min_px: 24, reduced_rule: A11-011}
  # motion_snap: from the live run in motion.json (real-time click, every painted element's box each animation frame).
  #   A snap is a change over 2 px in one frame that is over 3x the change in the frames either side (Stageshow
  #   jumps-core, MIT). settle = the element glided in 3 of the 8 frames before; shove = another element is mid-glide.
  #   Instant changes are not judged (product UI may open instantly). min_px: the smallest jump reported.
  motion_snap:      {rule: MOT-003, tier: Finish, min_px: 3, max_hits: 6}
  # async_state: measured from async.json (primary actions clicked with fetch/XHR held 3 s, then with a forced 500).
  #   checks_ms        MOT-200 (hallmark §311, uupm): show progress after 150-300 ms, "Loading..." past 2 s. No visible change
  #                    at both 0.5 s and 2 s while a request is pending = no feedback.
  #   min_changed_px   pixels that must differ (by more than pixel_level, the near_blank level) between the pre-click and
  #                    in-flight screenshots for the UI to count as having responded.
  #   false success    CMP-110 / CMP-212 (HM §93 §311, ADP §55): no success before the answer, none where no request
  #                    was made, none after a failure. success_pattern extends the fake-success lexicon with the
  #                    past-participle confirmations of app actions (C01 "Draft project created", ux-ui-agent-skills
  #                    critic answer key, Composition 6). Hits cite false_success_rule at Floor.
  #   stuck spinner    CMP-108 / A11-160 (HM §311, UX §328, uupm §95): progress and aria-busy end when the request ends.
  async_state:      {rule: CMP-001, tier: Reflex, checks_ms: [500, 2000], min_changed_px: 100, pixel_level: 24, max_success_chars: 120, false_success_rule: INT-008,
                     success_pattern: "\\b(created|saved|added|sent|published|updated|submitted|uploaded|exported|imported|subscribed|confirmed|booked|reserved|registered|invited|deleted|removed|success(ful(ly)?)?|thanks|thank you|all set|you're (in|on the list|all set)|done)\\b",
                     honest_pattern: "\\b(not|nothing|no longer|failed|fail|error|couldn't|could not|can't|cannot|unable|try again|invalid|required|sending|saving|loading|pending|will be)\\b"}
  performance:      {rule: WEB-001, tier: Reflex, lcp_warn_ms: 2500, lcp_fail_ms: 4500, image_max_kb: 400, image_max_ratio: 2.0}
  # ---- capture and cross-output ---------------------------------------------
  near_blank:       {rule: PRC-001, tier: Floor, max_diff_share: 0.0015, level: 24}   # capture sanity: an empty render, not a sparse page
  look_family:      {rule: SLP-012, tier: Reflex, families_file: look-families.yaml}
  distinctness:     {rule: SLP-011, tier: Reflex, min_palette_oklab: 0.06, max_edge_corr: 0.55, ledger_size: 8}
  redesign_loss:    {rule: PRC-002, tier: Floor, max_word_drop: 0.40}
