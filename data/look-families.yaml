# The AI-default looks, as numeric tells. Each tell alone is info.
# A family becomes a finding (rule SLP-012) when >= profile.look_family_cluster_min (+ the family's cluster_extra) of its tells fire on one surface.
# Sources: huashu §58 §68, hallmark §16 §386, impeccable §200 §532, taste-skill §31, design-taste §5.
families:
  warm-paper-serif:
    description: Cream page, serif display, terracotta accent, caps eyebrows, 01/02/03 numbering.
    tells:
      - {id: cream_bg, test: "page background oklch L > 0.90, hue 40-110, C >= 0.003; or sRGB all channels >= 209, R>=G>=B, R-B in 6..48"}
      - {id: terracotta_accent, test: "an accent within oklab distance 0.07 of #D97757, or oklch C >= 0.08 at hue 15-55"}
      - {id: serif_display, test: "h1/h2 rendered in a serif face"}
      - {id: italic_serif_hero, test: "italic serif text >= 40px in an h1/h2 or in a child span of one (the italic accent word)"}
      - {id: eyebrows, test: "eyebrow detector fires >= 1, or 3+ tracked uppercase labels <= 14px (caps_labels)"}
      - {id: numbered_labels, test: "numbered_labels detector fires"}
  dark-single-accent:
    description: Near-black page with one saturated accent, often neon or GitHub-dark.
    tells:
      - {id: dark_bg, test: "page background oklch L < 0.20"}
      - {id: single_vivid, test: "exactly one colour with oklch C > 0.15 across text, borders and fills"}
      - {id: neon_cyan_violet, test: "neon_violet detector fires"}
      - {id: glow, test: "glow detector fires"}
      - {id: mono_labels, test: "monospace face on non-code labels"}
  hairline-newspaper:
    description: Broadsheet hairlines, zero radius, italic serif and mono labels.
    # Live round 1 + local recapture (84 items, 9 Nov 2026): hairlines 42% slop vs 51% good, zero_radius 13% vs 22%,
    # mono_labels 23% vs 29%. Three of four tells fire more on good work, so this family needs every tell.
    cluster_extra: 1
    tells:
      - {id: hairlines, test: ">= 8 elements wider than 200px with 1px borders"}
      - {id: zero_radius, test: "> 90% of bordered elements have radius 0"}
      - {id: mono_labels, test: "monospace face on non-code labels"}
      - {id: italic_serif, test: "italic serif display"}
  saas-card-kit:
    description: Equal cards with icon tiles, one radius, one soft shadow, Inter everywhere.
    tells:
      - {id: card_kit, test: "card_kit detector fires"}
      - {id: icon_tiles, test: "icon_tile detector fires"}
      - {id: equal_grid, test: "a row of 3 or 4 equal-width cards: repeat(3|4, 1fr)"}
      - {id: inter_only, test: "one family on the whole page and it is Inter, Roboto or system-ui"}
      - {id: stock_greys, test: "stock_swatches hits on text greys (#6b7280, #9ca3af)"}
  violet-gradient:
    description: Indigo-to-violet gradient, radial glow.
    # scattered_radii (>= 5 distinct radii) removed 9 Nov 2026: 29% slop vs 27% good across 84 items, and it was one of
    # the three tells on all five good sites the family flagged in live round 1 (L19, L20, L24, L25, L27).
    tells:
      - {id: ai_purple, test: "#6366F1 or #8B5CF6 present, or a fill at oklch hue 265-330 with C > 0.12"}
      - {id: gradient_pair, test: "gradient detector fires on a banned pair"}
      - {id: glow, test: "glow detector fires"}
